<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOUBA STOR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial,sans-serif;padding-bottom:90px}
header{background:#000;border-bottom:2px solid #ffd700;padding:12px;text-align:center;position:sticky;top:0;z-index:50}
header h1{color:#ffd700;font-size:26px;letter-spacing:1px}
.search{display:flex;gap:8px;padding:12px}
.search input{flex:1;padding:12px;border-radius:25px;border:1px solid #ffd700;background:#111;color:#fff;font-size:16px}
.search button{background:#ffd700;border:none;padding:0 18px;border-radius:20px;font-weight:bold}
h2{padding:10px 12px;color:#ffd700;font-size:18px}
.grid{display:flex;gap:12px;overflow-x:auto;padding:0 12px 12px;scroll-snap-type:x mandatory}
.card{flex:0 0 82%;max-width:320px;background:#111;border:1px solid #ffd700;border-radius:14px;overflow:hidden;scroll-snap-align:start}
.card img{width:100%;height:260px;object-fit:cover;display:block;background:#222}
.card .info{padding:10px}
.card .info b{font-size:17px;display:block;line-height:1.3}
.card .price{color:#ffd700;font-size:19px;font-weight:bold;margin:6px 0}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:16px;font-weight:bold;margin-top:8px;cursor:pointer}
.btn-gold{background:#ffd700;color:#000}
.btn-green{background:#25d366;color:#fff}
.btn-dark{background:#222;color:#fff;border:1px solid #555}
.tag{font-size:13px;color:#aaa;margin-top:6px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 12px 12px}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid #ffd700;background:#111;color:#fff}
.tabs button.on{background:#ffd700;color:#000}
.footer-links{display:flex;justify-content:center;gap:18px;padding:20px 12px 10px;color:#ffd700;font-size:14px}
.footer-links a{color:#ffd700;text-decoration:none}
.help-row{display:flex;gap:10px;padding:0 12px 20px}
.help-row button{flex:1;padding:12px;border-radius:25px;border:none;font-weight:bold;font-size:15px}
.help-row .conseils{background:#ffd700;color:#000}
.help-row .aide{background:#25d366;color:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:2px solid #ffd700;display:flex;justify-content:space-around;padding:8px 0;z-index:100}
.nav a{color:#fff;text-decoration:none;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:2px}
.nav a span{font-size:20px}
.empty{text-align:center;padding:30px;color:#aaa}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#ffd700;color:#000;padding:10px 18px;border-radius:20px;font-weight:bold;display:none;z-index:200}
</style></head>
<body>
<header><h1>BOUBA STOR</h1></header>
<div class="search"><input id="q" placeholder="🔍 Chercher un article..."><button onclick="setLang()">🌐 EN</button></div>
<div class="tabs" id="tabs">
<button class="on" onclick="filtrer('all',this)">🌍 Toutes</button>
<button onclick="filtrer('Vêtements',this)">👗 Vêtements</button>
<button onclick="filtrer('Maillots',this)">⚽ Maillots</button>
<button onclick="filtrer('Chaussures',this)">👟 Chaussures</button>
<button onclick="filtrer('Électrique',this)">📱 Électrique</button>
<button onclick="filtrer('Sacs',this)">👜 Sacs</button>
<button onclick="filtrer('Beauté',this)">💄 Beauté</button>
<button onclick="filtrer('Montres',this)">⌚ Montres</button>
<button onclick="filtrer('Maison',this)">🏠 Maison</button>
</div>
<h2>🛍️ Boutiques</h2>
<div class="grid" id="grid"></div>
<div class="footer-links"><a href="#">À Propos</a><span>|</span><a href="#">Contact</a><span>|</span><a href="#">Confidentialité</a></div>
<div class="help-row"><button class="conseils" onclick="alert('Conseils : Choisis ta taille, paie par Wave / Orange Money au 07 87 61 97 17')">💡 Conseils</button><button class="aide" onclick="location.href='amis.html'">💬 Aide</button></div>

<nav class="nav">
<a href="index.html"><span>🏠</span>Accueil</a>
<a href="#" onclick="voirPanier();return false"><span>🛒</span>Panier <b id="nbPanier"></b></a>
<a href="#"><span>🎬</span>Vibes</a>
<a href="#"><span>⭐</span>Stars</a>
<a href="amis.html"><span>💬</span>Chat</a>
<a href="#"><span>📺</span>Vidéos</a>
<a href="#"><span>⚙️</span>Contrôle</a>
</nav>
<div id="toast"></div>
<script>
let PRODS=[]; let FILTRE='all';
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
function load(){
  try{let l=JSON.parse(localStorage.getItem('b_products')||'[]'); if(Array.isArray(l)&&l.length) PRODS=l;}catch(e){}
  if(!PRODS.length){
    PRODS=[
      {id:'1',name:'Ensemble / homme / XL / Orange',price:9000,cat:'Vêtements',img:'https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=600&q=80'},
      {id:'2',name:'Ensemble 2 pièce / 3XL / XXL / blanc noir',price:8000,cat:'Vêtements',img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600&q=80'},
      {id:'3',name:'Robe longue',price:10000,cat:'Vêtements',img:'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600&q=80'}
    ];
  }
  render();
}
function filtrer(c,btn){FILTRE=c;document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');render()}
function render(){
  let q=(document.getElementById('q').value||'').toLowerCase();
  let list=PRODS.filter(p=>(FILTRE==='all'||p.cat===FILTRE)&&(p.name||'').toLowerCase().includes(q));
  let g=document.getElementById('grid');
  if(!list.length){g.innerHTML='<div class="empty">Aucun article.<br>Ajoute un article dans Contrôle.</div>';return}
  g.innerHTML=list.map(p=>`
  <div class="card">
    <img src="${p.img||''}" onerror="this.src='https://via.placeholder.com/600x600?text=BOUBA+STOR'">
    <div class="info"><b>${p.name}</b><div class="price">${Number(p.price).toLocaleString('fr-FR')} F</div>
    <button class="btn btn-gold" onclick="ajouter('${p.id}')">🛒 Ajouter</button>
    <button class="btn btn-green" onclick="partager('${p.id}')">📤 Partager</button>
    <div class="tag">${(p.cat||'vêtements').toLowerCase()}</div>
    <button class="btn btn-dark" onclick="retourner('${p.id}')">↩️ Retourner</button>
    </div>
  </div>`).join('');
  let cart=JSON.parse(localStorage.getItem('b_cart')||'[]');document.getElementById('nbPanier').textContent=cart.length? '('+cart.length+')':'';
}
function ajouter(id){let p=PRODS.find(x=>x.id==id);let c=JSON.parse(localStorage.getItem('b_cart')||'[]');c.push(p);localStorage.setItem('b_cart',JSON.stringify(c));toast('✅ Ajouté !');render()}
function partager(id){let p=PRODS.find(x=>x.id==id);let t=`${p.name} - ${p.price}F sur BOUBA STOR`;if(navigator.share)navigator.share({text:t});else{navigator.clipboard.writeText(t);toast('🔗 Lien copié')}} 
function retourner(id){toast('↩️ Demande de retour envoyée - Admin te répond en 24h')}
function voirPanier(){let c=JSON.parse(localStorage.getItem('b_cart')||'[]');if(!c.length){toast('Panier vide');return}let total=c.reduce((s,x)=>s+Number(x.price||0),0);alert('Panier : '+c.length+' articles\\nTotal : '+total.toLocaleString('fr-FR')+' F\\n\\nPaiement Wave / Orange Money : 07 87 61 97 17')}
function setLang(){toast('Langue : FR / EN bientôt')}
document.getElementById('q').addEventListener('input',render);
load();
</script>
</body></html>
