<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BOUBA PRO LIVE</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f5f5f7}.h{background:#000;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}.logo{font-weight:900}.live{background:#00ff88;color:#000;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:900}.cart{position:relative;background:#fff;color:#000;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}.count{position:absolute;top:-5px;right:-5px;background:red;color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07)}.card img{width:100%;height:160px;object-fit:cover}.info{padding:10px}.name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-weight:900}.btn{width:100%;background:#000;color:#fff;border:none;padding:10px;border-radius:10px;margin-top:8px;font-weight:700}.fab{position:fixed;bottom:20px;right:20px;background:#000;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:99}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}.modal.open{display:flex}.box{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:20px;max-height:90vh;overflow:auto}.inp{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px}.btnP{width:100%;background:#000;color:#fff;padding:14px;border:none;border-radius:12px;font-weight:900}.st{padding:12px;background:#000;color:#0f0;text-align:center;font-size:12px;font-weight:700}</style></head><body><div class="h"><div style="display:flex;align-items:center;gap:8px"><div class="logo">BOUBA STORE</div><div class="live">● LIVE</div></div><div class="cart" onclick="openCart()">🛒<div class="count" id="cartCount">0</div></div></div><div class="st" id="status">🔄 Connexion...</div><div class="grid" id="products"></div><div class="fab" onclick="openAdmin()">+</div><div class="modal" id="adminModal"><div class="box"><div style="display:flex;justify-content:space-between;margin-bottom:16px"><h3>AJOUTER PRODUIT LIVE</h3><span onclick="closeAdmin()" style="font-size:24px">×</span></div><p style="font-size:12px;background:#eafff2;padding:8px;border-radius:8px;margin-bottom:12px">✅ Visible instantanément par tous!</p><input class="inp" id="pName" placeholder="Nom produit"><input class="inp" id="pPrice" type="number" placeholder="Prix"><input class="inp" id="pOldPrice" type="number" placeholder="Ancien prix"><input class="inp" id="pImage" placeholder="Lien image ou vide"><select class="inp" id="pCat"><option>Homme</option><option>Femme</option><option>Enfant</option></select><button class="btnP" onclick="addProduct()" id="addBtn">🚀 PUBLIER EN LIVE</button><hr style="margin:16px 0"><div id="adminList"></div><button onclick="closeAdmin()" style="margin-top:12px;width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff">Fermer</button></div></div><div class="modal" id="cartModal"><div class="box"><div style="display:flex;justify-content:space-between;margin-bottom:16px"><h3>Panier</h3><span onclick="closeCart()" style="font-size:24px">×</span></div><div id="cartItems"></div><div style="margin-top:16px;display:flex;justify-content:space-between;font-weight:900"><span>Total:</span><span id="cartTotal">0 FCFA</span></div><button class="btnP" style="margin-top:12px" onclick="orderWA()">Commander WhatsApp</button></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getFirestore,collection,addDoc,onSnapshot,deleteDoc,doc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyDRD5Log6Nd5pEB7jctQQt-IDwC88culCk",authDomain:"bouba-51a6f.firebaseapp.com",projectId:"bouba-51a6f",storageBucket:"bouba-51a6f.firebasestorage.app",messagingSenderId:"267309248026",appId:"1:267309248026:web:8a43e3dfc934c45adeeba3"};const app=initializeApp(firebaseConfig);const db=getFirestore(app);const col=collection(db,"products");let products=[],cart=JSON.parse(localStorage.getItem('bouba_cart')||'[]');const statusEl=document.getElementById('status');onSnapshot(col,(s)=>{products=s.docs.map(d=>({id:d.id,...d.data()}));products.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render();renderA();statusEl.innerHTML="✅ LIVE AUTO - "+products.length+" produits";statusEl.style.background="#00c853";},e=>{statusEl.innerHTML="❌ "+e.message;statusEl.style.background="red";});function render(){const el=document.getElementById('products');if(!products.length){el.innerHTML='<div style="grid-column:1/3;text-align:center;padding:40px;color:#999">Aucun produit. Clique +</div>';return;}el.innerHTML=products.map(p=>`<div class="card"><img src="${p.image||'https://via.placeholder.com/300'}" onerror="this.src='https://via.placeholder.com/300'"><div class="info"><div class="name">${p.name}</div><div><span class="price">${Number(p.price).toLocaleString()} FCFA</span>${p.oldPrice?`<span style="color:#999;text-decoration:line-through;font-size:12px;margin-left:6px">${Number(p.oldPrice).toLocaleString()}</span>`:''}</div><button class="btn" onclick="addToCart('${p.id}')">Ajouter</button></div></div>`).join('');}function renderA(){document.getElementById('adminList').innerHTML=products.map(p=>`<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee"><img src="${p.image}" style="width:50px;height:50px;border-radius:10px;object-fit:cover"><div style="flex:1"><div style="font-weight:700;font-size:13px">${p.name}</div><div style="font-size:12px">${Number(p.price).toLocaleString()} FCFA</div></div><button onclick="del('${p.id}')" style="background:#ff1744;color:#fff;border:none;padding:6px 10px;border-radius:8px">X</button></div>`).join('');}window.addProduct=async()=>{const n=document.getElementById('pName').value.trim(),pr=document.getElementById('pPrice').value.trim(),o=document.getElementById('pOldPrice').value.trim(),im=document.getElementById('pImage').value.trim()||'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500',c=document.getElementById('pCat').value;if(!n||!pr){alert('Nom et Prix!');return;}const b=document.getElementById('addBtn');b.innerHTML='⏳...';b.disabled=true;try{await addDoc(col,{name:n,price:Number(pr),oldPrice:o?Number(o):null,image:im,category:c,createdAt:serverTimestamp()});document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pOldPrice').value='';document.getElementById('pImage').value='';alert('🚀 Publié LIVE!');}catch(e){alert(e.message);}b.innerHTML='🚀 PUBLIER EN LIVE';b.disabled=false;};window.del=async(id)=>{if(!confirm('Supprimer?'))return;await deleteDoc(doc(db,"products",id));};window.addToCart=id=>{const p=products.find(x=>x.id===id);const ex=cart.find(c=>c.id===id);if(ex)ex.qty++;else cart.push({...p,qty:1});save();};function save(){localStorage.setItem('bouba_cart',JSON.stringify(cart));document.getElementById('cartCount').innerText=cart.reduce((s,c)=>s+c.qty,0);renderC();}function renderC(){const el=document.getElementById('cartItems');if(!cart.length){el.innerHTML='<div style="text-align:center;color:#999;padding:20px">Vide</div>';document.getElementById('cartTotal').innerText='0 FCFA';return;}el.innerHTML=cart.map((c,i)=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee"><img src="${c.image}" style="width:50px;height:50px;border-radius:10px"><div style="flex:1"><div style="font-weight:700;font-size:13px">${c.name}</div><div style="font-size:12px">${Number(c.price).toLocaleString()} x ${c.qty}</div></div><button onclick="rem(${i})" style="background:#eee;border:none;width:28px;height:28px;border-radius:50%">×</button></div>`).join('');document.getElementById('cartTotal').innerText=cart.reduce((s,c)=>s+c.price*c.qty,0).toLocaleString()+' FCFA';}window.rem=i=>{cart.splice(i,1);save();};window.openAdmin=()=>document.getElementById('adminModal').classList.add('open');window.closeAdmin=()=>document.getElementById('adminModal').classList.remove('open');window.openCart=()=>{renderC();document.getElementById('cartModal').classList.add('open');};window.closeCart=()=>document.getElementById('cartModal').classList.remove('open');window.orderWA=()=>{if(!cart.length){alert('Vide');return;}const t=cart.reduce((s,c)=>s+c.price*c.qty,0);let m="Salut BOUBA STORE! Commande:%0A";cart.forEach(c=>m+=`- ${c.name} x${c.qty} = ${(c.price*c.qty).toLocaleString()} FCFA%0A`);m+=`%0ATotal: ${t.toLocaleString()} FCFA`;window.open('https://wa.me/2250787619717?text='+m,'_blank');};save();</script></body></html>
