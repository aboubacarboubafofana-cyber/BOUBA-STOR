function toastM(m){let t=document.getElementById('toast');t.innerHTML=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}
function showP(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('p'+p.charAt(0).toUpperCase()+p.slice(1)).classList.add('active');render();}
function render(){let c=document.getElementById('appList');let s=document.getElementById('search').value.toLowerCase();let f=apps.filter(a=>a.name.toLowerCase().includes(s)||a.desc.toLowerCase().includes(s));document.getElementById('statusText').innerHTML=isPaid?'✅ HYPERSONIQUE DÉBLOQUÉ - VITESSE MAX!':'🔒 '+f.length+' apps HYPERSONIQUES - 500F Wave/OM +225 0787619717';c.innerHTML=f.map((a,i)=>'<div class=\"app-card\"><div class=\"app-icon\">'+a.icon+'</div><div style=\"flex:1\"><b style=\"font-size:12px\">'+a.name+'</b><br><span style=\"font-size:9px;color:#AAA\">'+a.desc+'</span><br><span style=\"background:#FFD700;color:#000;padding:2px 7px;border-radius:12px;font-size:8px;font-weight:900\">'+(isPaid?'✅ HYPER':'🔒 500F')+'</span> <span style=\"font-size:8px;color:#FF8C00\">⚡ '+a.views+'</span><br><div style=\"display:flex;gap:6px;margin-top:6px\"><button style=\"background:'+(isPaid?'#00FF88':'#FFD700')+';color:#000;border:none;padding:6px 14px;border-radius:20px;font-size:10px;font-weight:900;flex:1\" onclick=\"openApp('+i+')\">'+(isPaid?'🚀 LANCER':'🔓 500F')+'</button><button style=\"background:#25D366;color:#fff;border:none;padding:6px 10px;border-radius:20px;font-size:10px;font-weight:900\" onclick=\"shareApp('+i+')\">📤</button></div></div></div>').join('');}

function openApp(i){if(!isPaid){document.getElementById('payModal').classList.add('show');return;}apps[i].views++;localStorage.setItem('BOUBA_HYPER_APPS',JSON.stringify(apps));if(apps[i].link&&apps[i].link!=='#')window.open(apps[i].link,'_blank');else toastM('🚀 '+apps[i].name+' LANCÉ HYPERSONIQUE!');}

function shareStore(){

else{shareWhatsApp(text);}

function shareApp(i){

else{shareWhatsApp(text);}
}
function shareWhatsApp(text){
