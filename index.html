<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>BOUBA STORE</title>
<style>
*{margin:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;padding-bottom:70px}
.header{border:2px solid #d4af37;padding:10px;position:sticky;top:0;background:#000;z-index:100}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.logo{width:42px;height:42px;border-radius:50%;border:2px solid gold;object-fit:cover;background:#0a331a}
.search{margin-top:10px;border:1px solid #d4af37;border-radius:30px;padding:10px 15px}
.search input{background:transparent;border:0;outline:0;color:#fff;width:100%}
.cats{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.cat{padding:8px 16px;border-radius:20px;border:1px solid #d4af37;background:transparent;color:#d4af37;font-size:13px;white-space:nowrap}
.cat.active{background:#d4af37;color:#000;font-weight:700}
.banner{background:linear-gradient(90deg,#8B5A2B,#D4AF37);color:#000;text-align:center;padding:8px;font-size:11px;font-weight:900}
#net{text-align:center;font-size:11px;padding:4px;font-weight:700;background:#111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.card{background:#111;border:1px solid #d4af37;border-radius:12px;overflow:hidden;position:relative}
.card img{width:100%;height:170px;object-fit:cover;background:#222}
.info{padding:7px;font-size:13px}
.btn{width:100%;background:linear-gradient(gold,#b8860b);border:0;padding:9px;border-radius:7px;font-weight:800;font-size:12px;margin-top:5px}
.btn:disabled{background:#444;color:#999}
.nav{position:fixed;bottom:0;width:100%;background:#000;border-top:1px solid #d4af37;display:flex;justify-content:space-around;padding:8px 0;font-size:11px;text-align:center;z-index:100}
.page{display:none;position:fixed;inset:0;background:#000;z-index:200;overflow-y:auto;padding:15px;padding-bottom:90px}
.page.active{display:block}
.input{width:100%;padding:12px;border-radius:8px;border:1px solid #d4af37;background:#111;color:#fff;margin-bottom:10px}
.gold{width:100%;padding:12px;background:gold;border:0;border-radius:8px;font-weight:900;color:#000;margin-top:4px}
.ghost{width:100%;padding:12px;background:transparent;border:1px solid #555;color:#fff;border-radius:8px;margin-top:8px}
.ctrl{border:1px solid #333;border-radius:10px;padding:10px;margin-bottom:10px;background:#0f0f0f}
.row{display:flex;gap:8px;align-items:center;background:#111;padding:8px;border-radius:8px;margin-bottom:6px;font-size:12px}
.row img{width:46px;height:46px;border-radius:8px;object-fit:cover}
.row .g{flex:1}
.mini{padding:6px 10px;border-radius:6px;border:1px solid gold;background:#000;color:gold;font-size:11px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.tabs button{padding:9px 14px;border-radius:20px;border:1px solid gold;background:#000;color:gold;white-space:nowrap;font-weight:700}
.tabs button.on{background:gold;color:#000}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:#111;border:1px solid gold;border-radius:10px;padding:14px;text-align:center}
.stat b{display:block;font-size:22px;color:gold}
.badge{position:absolute;top:6px;left:6px;background:#c00;color:#fff;font-size:10px;padding:3px 7px;border-radius:10px}
#gate{position:fixed;inset:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.gateBox{background:#0f0f0f;border:2px solid gold;border-radius:20px;padding:20px;width:100%;max-width:380px;text-align:center}
#toast{position:fixed;top:70px;left:10px;right:10px;background:gold;color:#000;padding:10px;border-radius:10px;font-weight:700;display:none;z-index:1000;text-align:center}
</style></head><body><div id="gate"><div class="gateBox">
<h2 style="color:gold">👑 BOUBA STORE</h2>
<p style="font-size:12px;color:#aaa;margin:8px 0">Crée ton compte pour commander</p>
<input id="uName" class="input" placeholder="Nom complet">
<input id="uPhone" class="input" placeholder="N° WhatsApp (ex: 07...)" type="tel">
<input id="uCity" class="input" placeholder="Ville / Quartier">
<button class="gold" onclick="register()">✅ Entrer</button>
</div></div>

<div class="header">
<div class="top"><img id="logo" class="logo" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
<b id="shopName" style="color:gold;font-size:18px">BOUBA STORE</b>
<span onclick="openPage('profilePage')" style="font-size:22px">👤</span></div>
<div class="search"><input id="qIn" placeholder="🔍 Chercher un article..." oninput="q=this.value;renderStore()"></div>
<div class="cats" id="cats"></div>
</div>
<div class="banner" id="bannerText">LIVRAISON 24H ABIDJAN • WAVE • ORANGE MONEY</div>
<div id="net">⏳ Connexion...</div>
<div class="grid" id="grid"></div>
<div id="toast"></div>

<div class="nav">
<div onclick="closeAll()">🏠<br>Accueil</div>
<div onclick="openPage('cartPage')">👜<br>Panier <b id="cartN" style="color:gold"></b></div>
<div onclick="openPage('adminPage');renderAdmin()">⚙️<br>Contrôle</div>
</div>

<div id="cartPage" class="page">
<button class="mini" onclick="closeAll()">← Retour</button>
<h2 style="color:gold;margin:10px 0">👜 MON PANIER</h2>
<div id="cartList"></div>
<h3 id="cartTotal" style="color:gold;margin:10px 0"></h3>
<button class="gold" onclick="commander()">📲 Commander sur WhatsApp</button>
</div>

<div id="profilePage" class="page">
<button class="mini" onclick="closeAll()">← Retour</button>
<h2 style="color:gold;margin:10px 0">👤 MON COMPTE</h2>
<div class="ctrl"><input id="eName" class="input" placeholder="Nom"><input id="ePhone" class="input" placeholder="WhatsApp"><input id="eCity" class="input" placeholder="Ville">
<button class="gold" onclick="saveProfile()">✅ Sauver</button></div>
<button class="ghost" onclick="logout()" style="color:#f44;border-color:#f44">🚪 Déconnexion</button>
</div>

<div id="adminPage" class="page">
<button class="mini" onclick="closeAll()">← Retour</button>
<h2 style="color:gold;margin:10px 0">⚙️ CONTRÔLE TOTAL</h2>
<div id="adminLogin" class="ctrl">
<h4 style="color:gold;margin-bottom:8px">🔐 Connexion admin</h4>
<input id="aMail" class="input" type="email" placeholder="Email admin">
<input id="aPass" class="input" type="password" placeholder="Mot de passe">
<button class="gold" onclick="adminLogin()">Se connecter</button>
</div>
<div id="adminPanel" style="display:none">
<div class="tabs" id="tabs"></div>
<div id="adminBody"></div>
<button class="ghost" onclick="adminLogout()" style="color:#f44;border-color:#f44">🚪 Déconnexion admin</button>
</div>
</div><script>
const ADMIN_UID="Yhv7spnIt6OE1aBn2AjyYQ47wxn2";
const DEFAULT_WA="2250787619717";
const FB_CFG={
 apiKey:"AIzaSyDRD5Log6Nd5pEB7jctQQt-IDwC88culCk",
 authDomain:"bouba-51a6f.firebaseapp.com",
 databaseURL:"https://bouba-51a6f-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"bouba-51a6f",
 storageBucket:"bouba-51a6f.firebasestorage.app",
 messagingSenderId:"267309248026",
 appId:"1:267309248026:web:8a43e3dfc934c45adeeba3"
};
const $=id=>document.getElementById(id);
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Mémoire pleine')}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg=u=>/^(https?:|data:image\/)/.test(u||'')?esc(u):'';
const fmt=n=>Number(n||0).toLocaleString('fr-FR');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

let S=LS('b_state',null)||{};
S.info=S.info||{};S.products=S.products||{};S.users=S.users||{};S.orders=S.orders||{};
let outbox=LS('b_out',[]),cart=LS('b_cart',[]),me=LS('b_me',null);
let isAdmin=false,cat='all',q='',online=false,fb=null,flushing=false,adminSub=false,tab='stats';

function save(){SV('b_state',S);SV('b_out',outbox)}
function setLocal(path,val){
 const p=path.split('/');let o=S;
 for(let i=0;i<p.length-1;i++)o=o[p[i]]=o[p[i]]||{};
 const k=p[p.length-1];
 if(val===null)delete o[k];else o[k]=val;
}
function write(path,val){setLocal(path,val);outbox.push({path,val});save();renderAll();flush()}
async function flush(){
 if(!fb||!online||flushing)return;flushing=true;
 try{
  while(outbox.length){
   const o=outbox[0];
   try{const r=fb.D.ref(fb.db,o.path);
    if(o.val===null)await fb.D.remove(r);else await fb.D.set(r,o.val);
   }catch(e){if(!/permission/i.test(String(e.code)+String(e.message)))throw e}
   outbox.shift();save();setNet();
  }
 }catch(e){console.log('flush',e)}
 flushing=false;setNet();
}
async function initFB(){
 try{
  const B="https://www.gstatic.com/firebasejs/12.19.0/";
  const A=await import(B+"firebase-app.js"),D=await import(B+"firebase-database.js"),AU=await import(B+"firebase-auth.js");
  const app=A.initializeApp(FB_CFG);
  fb={db:D.getDatabase(app),D,AU,auth:AU.getAuth(app)};
  D.onValue(D.ref(fb.db,'.info/connected'),s=>{online=!!s.val();setNet();if(online)flush()});
  sub('info');sub('products');
  AU.onAuthStateChanged(fb.auth,u=>{
   isAdmin=!!u&&u.uid===ADMIN_UID;
   $('adminLogin').style.display=isAdmin?'none':'block';
   $('adminPanel').style.display=isAdmin?'block':'none';
   if(isAdmin)subAdmin();
   renderAll();
  });
 }catch(e){console.log('Mode local',e);setNet()}
}
function sub(root){
 fb.D.onValue(fb.D.ref(fb.db,root),s=>{
  S[root]=s.val()||{};
  outbox.filter(o=>o.path.split('/')[0]===root).forEach(o=>setLocal(o.path,o.val));
  save();renderAll();
 },err=>console.log('sub',root,err));
}
function subAdmin(){if(!fb||adminSub)return;adminSub=true;sub('users');sub('orders')}
function setNet(){
 const n=outbox.length;
 $('net').innerHTML=online?'<span style="color:#25D366">🟢 EN DIRECT</span>'+(n?' • envoi de '+n+'…':''):'<span style="color:orange">🟠 HORS LIGNE</span>'+(n?' • '+n+' en attente':'');
}
window.addEventListener('online',()=>setTimeout(flush,1500));
window.addEventListener('offline',()=>{online=false;setNet()});

function compress(file,max,cb){
 if(!file)return;const r=new FileReader();
 r.onload=e=>{const i=new Image();i.onload=()=>{
  const k=Math.min(1,max/Math.max(i.width,i.height));
  const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.6));
 };i.src=e.target.result};r.readAsDataURL(file);
}
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(window._tz);window._tz=setTimeout(()=>e.style.display='none',4000)}
function openPage(id){closeAll();$(id).classList.add('active')}
function closeAll(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))}

/* ----- boutique ----- */
const prods=()=>Object.values(S.products||{}).filter(p=>p&&p.id).sort((a,b)=>(b.date||0)-(a.date||0));
function renderStore(){
 const info=S.info||{};
 $('shopName').textContent=info.name||'BOUBA STORE';
 if(info.banner)$('bannerText').textContent=info.banner;
 if(info.logo)$('logo').src=info.logo;
 const cs=['all',...new Set(prods().map(p=>p.cat).filter(Boolean))];
 $('cats').innerHTML=cs.map(c=>'<button class="cat'+(c===cat?' active':'')+'" onclick="cat=\''+esc(c)+'\';renderStore()">'+(c==='all'?'Tout':esc(c))+'</button>').join('');
 const t=q.toLowerCase();
 const l=prods().filter(p=>(cat==='all'||p.cat===cat)&&(p.name||'').toLowerCase().includes(t));
 $('grid').innerHTML=l.length?l.map(p=>'<div class="card">'+(p.stock===false?'<span class="badge">ÉPUISÉ</span>':'')+'<img src="'+safeImg(p.img)+'"><div class="info"><b>'+esc(p.name)+'</b><br><span style="color:gold">'+fmt(p.price)+' F</span><button class="btn" '+(p.stock===false?'disabled':'')+' onclick="addCart(\''+p.id+'\')">🛒 Ajouter</button></div></div>').join(''):'<p style="grid-column:1/3;text-align:center;color:#888;padding:30px">Aucun article</p>';
}
function addCart(id){
 const c=cart.find(x=>x.id===id);if(c)c.qty++;else cart.push({id,qty:1});
 SV('b_cart',cart);renderCart();toast('✅ Ajouté au panier');
}
function qty(id,d){
 const c=cart.find(x=>x.id===id);if(!c)return;c.qty+=d;
 if(c.qty<=0)cart=cart.filter(x=>x.id!==id);
 SV('b_cart',cart);renderCart();
}
function cartItems(){return cart.map(c=>({p:(S.products||{})[c.id],qty:c.qty})).filter(x=>x.p)}
function cartSum(){return cartItems().reduce((s,x)=>s+x.p.price*x.qty,0)}
function renderCart(){
 const l=cartItems();
 $('cartN').textContent=cart.length?'('+cart.length+')':'';
 $('cartList').innerHTML=l.length?l.map(x=>'<div class="row"><img src="'+safeImg(x.p.img)+'"><div class="g"><b>'+esc(x.p.name)+'</b><br><span style="color:gold">'+fmt(x.p.price)+' F</span></div><button class="mini" onclick="qty(\''+x.p.id+'\',-1)">−</button><b>'+x.qty+'</b><button class="mini" onclick="qty(\''+x.p.id+'\',1)">+</button></div>').join(''):'<p style="color:#888">Panier vide</p>';
 $('cartTotal').textContent=l.length?'Total : '+fmt(cartSum())+' F':'';
}
function commander(){
 const l=cartItems();if(!l.length){alert('Panier vide');return}
 const id=uid();
 const o={id,date:Date.now(),status:'en attente',total:cartSum(),name:me.name,phone:me.phone,city:me.city,
  items:l.map(x=>({name:x.p.name,price:x.p.price,qty:x.qty}))};
 write('orders/'+id,o);
 const wa=((S.info||{}).whatsapp||DEFAULT_WA).replace(/\D/g,'');
 const msg='Commande #'+id+'\n'+l.map(x=>'• '+x.p.name+' x'+x.qty+' = '+fmt(x.p.price*x.qty)+' F').join('\n')+'\nTotal : '+fmt(o.total)+' F\nClient : '+me.name+' / '+me.phone+' / '+me.city;
 cart=[];SV('b_cart',cart);renderCart();closeAll();
 window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank');
}

/* ----- compte client ----- */
function checkGate(){if(me){$('gate').style.display='none';loadProfile()}else $('gate').style.display='flex'}
function register(){
 const n=$('uName').value.trim(),ph=$('uPhone').value.trim(),city=$('uCity').value.trim();
 const key=ph.replace(/\D/g,'');
 if(!n||!ph||!city){alert('Remplis tout BOSS !');return}
 if(key.length<8){alert('Numéro invalide');return}
 me={key,name:n,phone:ph,city,date:Date.now()};SV('b_me',me);
 write('users/'+key,me);checkGate();
}
function loadProfile(){$('eName').value=me.name;$('ePhone').value=me.phone;$('eCity').value=me.city}
function saveProfile(){
 me.name=$('eName').value.trim()||me.name;me.phone=$('ePhone').value.trim()||me.phone;me.city=$('eCity').value.trim()||me.city;
 SV('b_me',me);write('users/'+me.key,me);toast('✅ Profil sauvé');
}
function logout(){me=null;localStorage.removeItem('b_me');closeAll();checkGate()}
</script><script>
/* ----- ADMIN ----- */
let tmpImg='',editId='';
async function adminLogin(){
 if(!fb){alert('Hors ligne : connexion impossible');return}
 try{await fb.AU.signInWithEmailAndPassword(fb.auth,$('aMail').value.trim(),$('aPass').value)}
 catch(e){alert('Email ou mot de passe incorrect')}
}
function adminLogout(){fb.AU.signOut(fb.auth);closeAll()}
function setTab(t){tab=t;renderAdmin()}
const TABS=[['stats','📊 Stats'],['orders','🧾 Commandes'],['prods','🛍️ Produits'],['clients','👥 Clients'],['set','⚙️ Réglages']];
const STAT=['en attente','confirmée','livrée','annulée'];
const orders=()=>Object.values(S.orders||{}).filter(o=>o&&o.id).sort((a,b)=>b.date-a.date);

function renderAdmin(){
 if(!isAdmin)return;
 $('tabs').innerHTML=TABS.map(t=>'<button class="'+(t[0]===tab?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>').join('');
 const b=$('adminBody');
 if(tab==='stats'){
  const os=orders(),ok=os.filter(o=>o.status!=='annulée'),ca=ok.reduce((s,o)=>s+o.total,0);
  const liv=os.filter(o=>o.status==='livrée').reduce((s,o)=>s+o.total,0);
  b.innerHTML='<div class="stat"><div><b>'+fmt(ca)+' F</b>Chiffre d\'affaires</div><div><b>'+fmt(liv)+' F</b>Encaissé (livré)</div><div><b>'+os.length+'</b>Commandes</div><div><b>'+os.filter(o=>o.status==='en attente').length+'</b>À traiter</div><div><b>'+Object.keys(S.users||{}).length+'</b>Clients</div><div><b>'+prods().length+'</b>Produits</div></div>';
 }
 else if(tab==='orders'){
  b.innerHTML=orders().map(o=>'<div class="ctrl"><b style="color:gold">#'+esc(o.id)+'</b> • '+new Date(o.date).toLocaleString('fr-FR')+'<br>'+esc(o.name)+' • '+esc(o.phone)+' • '+esc(o.city)+'<br>'+(o.items||[]).map(i=>'• '+esc(i.name)+' x'+i.qty).join('<br>')+'<br><b>'+fmt(o.total)+' F</b><br><select class="input" style="margin:6px 0" onchange="setStatus(\''+o.id+'\',this.value)">'+STAT.map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select><a class="mini" style="text-decoration:none" href="https://wa.me/'+String(o.phone).replace(/\D/g,'')+'" target="_blank">💬 WhatsApp</a> <button class="mini" style="color:#f44;border-color:#f44" onclick="delOrder(\''+o.id+'\')">🗑️</button></div>').join('')||'<p style="color:#888">Aucune commande</p>';
 }
 else if(tab==='prods'){
  const e=(S.products||{})[editId]||{};
  b.innerHTML='<div class="ctrl"><h4 style="color:gold;margin-bottom:8px">'+(editId?'✏️ Modifier':'➕ Nouveau produit')+'</h4><input id="pName" class="input" placeholder="Nom" value="'+esc(e.name)+'"><input id="pPrice" class="input" type="number" placeholder="Prix (F)" value="'+esc(e.price)+'"><input id="pCat" class="input" placeholder="Catégorie (ex: Homme)" value="'+esc(e.cat)+'"><input type="file" accept="image/*" class="input" onchange="compress(this.files[0],600,d=>{tmpImg=d;$(\'pPrev\').src=d})"><img id="pPrev" src="'+safeImg(tmpImg||e.img)+'" style="width:80px;border-radius:8px;margin-bottom:8px"><button class="gold" onclick="saveProd()">✅ Enregistrer</button>'+(editId?'<button class="ghost" onclick="editId=\'\';tmpImg=\'\';renderAdmin()">Annuler</button>':'')+'</div>'+
  prods().map(p=>'<div class="row"><img src="'+safeImg(p.img)+'"><div class="g"><b>'+esc(p.name)+'</b><br>'+fmt(p.price)+' F • '+esc(p.cat)+'</div><button class="mini" onclick="toggleStock(\''+p.id+'\')">'+(p.stock===false?'❌':'✅')+'</button><button class="mini" onclick="editId=\''+p.id+'\';tmpImg=\'\';renderAdmin()">✏️</button><button class="mini" style="color:#f44;border-color:#f44" onclick="delProd(\''+p.id+'\')">🗑️</button></div>').join('');
 }
 else if(tab==='clients'){
  const t=(window._cq||'').toLowerCase();
  const l=Object.values(S.users||{}).filter(u=>u&&(u.name+u.phone+u.city).toLowerCase().includes(t));
  b.innerHTML='<div style="color:gold;font-weight:900;margin-bottom:6px">'+l.length+' client(s)</div><input class="input" placeholder="🔍 Chercher..." value="'+esc(window._cq||'')+'" oninput="window._cq=this.value;renderAdmin();this.focus()">'+l.map(u=>'<div class="row"><div class="g"><b>'+esc(u.name)+'</b><br>'+esc(u.phone)+' • '+esc(u.city)+'</div><a class="mini" style="text-decoration:none" href="https://wa.me/'+String(u.phone).replace(/\D/g,'')+'" target="_blank">💬</a><button class="mini" style="color:#f44;border-color:#f44" onclick="delClient(\''+u.key+'\')">🗑️</button></div>').join('');
 }
 else if(tab==='set'){
  const i=S.info||{};
  b.innerHTML='<div class="ctrl"><input id="sName" class="input" placeholder="Nom boutique" value="'+esc(i.name)+'"><input id="sWa" class="input" placeholder="WhatsApp (225...)" value="'+esc(i.whatsapp||DEFAULT_WA)+'"><input id="sBan" class="input" placeholder="Texte bannière" value="'+esc(i.banner)+'"><p style="font-size:12px;color:#aaa;margin-bottom:6px">🏆 Logo</p><input type="file" accept="image/*" class="input" onchange="compress(this.files[0],200,d=>{tmpImg=d;$(\'lPrev\').src=d})"><img id="lPrev" src="'+safeImg(i.logo)+'" style="width:60px;border-radius:50%"><button class="gold" onclick="saveInfo()">✅ Sauver</button></div>';
 }
}
function setStatus(id,s){write('orders/'+id+'/status',s);toast('Statut : '+s)}
function delOrder(id){if(confirm('Supprimer la commande ?'))write('orders/'+id,null)}
function delClient(k){if(confirm('Supprimer ce client ?'))write('users/'+k,null)}
function delProd(id){if(confirm('Supprimer ce produit ?'))write('products/'+id,null)}
function toggleStock(id){const p=S.products[id];write('products/'+id+'/stock',p.stock===false)}
function saveProd(){
 const n=$('pName').value.trim(),pr=+$('pPrice').value,c=$('pCat').value.trim();
 const old=(S.products||{})[editId]||{};
 const img=tmpImg||old.img||'';
 if(!n||!pr||!img){alert('Nom, prix et photo obligatoires');return}
 const id=editId||uid();
 write('products/'+id,{id,name:n,price:pr,cat:c,img,stock:old.stock!==false,date:old.date||Date.now()});
 editId='';tmpImg='';toast('✅ Produit enregistré');
}
function saveInfo(){
 const i=S.info||{};
 write('info',{name:$('sName').value.trim(),whatsapp:$('sWa').value.trim(),banner:$('sBan').value.trim(),logo:tmpImg||i.logo||''});
 tmpImg='';toast('✅ Réglages sauvés');
}

/* ----- démarrage ----- */
function renderAll(){
 renderStore();renderCart();
 if($('adminPage').classList.contains('active')&&!/INPUT|SELECT/.test((document.activeElement||{}).tagName))renderAdmin();
}
checkGate();renderAll();setNet();initFB();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
