<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appel</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Roboto,Arial,sans-serif;overflow:hidden}
  #remoteVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
  #localVideo{position:absolute;top:16px;right:16px;width:96px;height:140px;object-fit:cover;border-radius:12px;border:2px solid #ffd700;background:#222;z-index:2}
  #status{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:20px;font-weight:700;color:#ffd700;text-shadow:0 2px 8px #000;z-index:2;padding:0 20px}
  .bar{position:absolute;bottom:40px;left:0;right:0;display:flex;justify-content:center;gap:22px;z-index:3}
  .bar button{width:64px;height:64px;border-radius:50%;border:0;font-size:26px;background:#2a2a2a;color:#ffd700}
  #hangupBtn{background:#e53935;color:#fff}
  .off{opacity:.45}
</style>
</head>
<body>
<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" autoplay playsinline muted></video>
<div id="status">Initialisation…</div>
<div class="bar">
  <button id="muteBtn" title="Micro">🎤</button>
  <button id="hangupBtn" title="Raccrocher">📞</button>
</div>

<script type="module">
import { db, auth } from "./firebase-config.js";
import { getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, setDoc, getDoc, updateDoc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const authInstance = auth || getAuth(getApp());

const user = await new Promise(resolve => {
  const unsub = onAuthStateChanged(authInstance, (u) => {
    unsub();
    resolve(u);
  });
});

if (!user) location.replace('compte.html');
const MON_ID = user.uid;

// ---------- WebRTC ----------
const rtcConfig = { iceServers: [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
  // TURN public de test (nécessaire sur beaucoup de réseaux 4G). Pour la prod, prenez votre propre TURN.
  { urls: "turn:openrelay.metered.ca:80",  username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
]};
const pc = new RTCPeerConnection(rtcConfig);
const remoteStream = new MediaStream();
let localStream, callRef, ended = false, queue = [];

const $ = id => document.getElementById(id);
const setStatus = t => { $('status').textContent = t; console.log(t); };

$('remoteVideo').srcObject = remoteStream;
pc.ontrack = e => e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
pc.onconnectionstatechange = () => {
  if (pc.connectionState === 'connected') $('status').style.display = 'none';
  if (['failed', 'disconnected'].includes(pc.connectionState)) hangup('Connexion perdue');
};

async function getMedia(video) {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { facingMode: 'user' } : false });
  } catch (e) {
    setStatus("Accès micro/caméra refusé. Autorisez-les dans le navigateur.");
    throw e;
  }
  $('localVideo').srcObject = localStream;
  $('localVideo').style.display = video ? 'block' : 'none';
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
}

// Les candidats ICE sont mis en file tant que la description distante n'est pas posée
async function addCand(c) {
  if (pc.remoteDescription) { try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {} }
  else queue.push(c);
}
async function flushCands() { for (const c of queue) await addCand(c); queue = []; }

function listenCandidates(colRef) {
  onSnapshot(colRef, snap => snap.docChanges().forEach(ch => { if (ch.type === 'added') addCand(ch.doc.data()); }));
}

// ---------- APPELANT ----------
async function startCall(friendId, video) {
  setStatus("Appel en cours…");
  await getMedia(video);
  callRef = doc(collection(db, 'calls'));
  const offerCands = collection(callRef, 'offerCandidates');
  const answerCands = collection(callRef, 'answerCandidates');

  pc.onicecandidate = e => e.candidate && addDoc(offerCands, e.candidate.toJSON());
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await setDoc(callRef, {
    from: MON_ID, to: friendId, video, status: 'ringing', createdAt: Date.now(),
    offer: { type: offer.type, sdp: offer.sdp }
  });

  setStatus("Ça sonne…");
  onSnapshot(callRef, async snap => {
    const d = snap.data(); if (!d) return;
    if (d.answer && !pc.remoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
      await flushCands();
      setStatus("Connexion…");
    }
    if (d.status === 'declined') end("Appel refusé");
    if (d.status === 'ended') end("Appel terminé");
  });
  listenCandidates(answerCands);

  setTimeout(() => { if (!pc.remoteDescription) hangup("Pas de réponse"); }, 45000);
}

// ---------- RÉCEPTEUR ----------
async function answerCall(callId) {
  setStatus("Connexion…");
  callRef = doc(db, 'calls', callId);
  const snap = await getDoc(callRef);
  if (!snap.exists()) return end("Appel introuvable");
  const d = snap.data();
  await getMedia(d.video);

  const offerCands = collection(callRef, 'offerCandidates');
  const answerCands = collection(callRef, 'answerCandidates');
  pc.onicecandidate = e => e.candidate && addDoc(answerCands, e.candidate.toJSON());

  await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await updateDoc(callRef, { answer: { type: answer.type, sdp: answer.sdp }, status: 'active' });

  listenCandidates(offerCands);
  await flushCands();
  onSnapshot(callRef, s => { if (s.data()?.status === 'ended') end("Appel terminé"); });
}

// ---------- FIN D'APPEL ----------
function end(msg) {
  if (ended) return; ended = true;
  $('status').style.display = 'block';
  setStatus(msg || "Appel terminé");
  localStream?.getTracks().forEach(t => t.stop());
  pc.close();
  setTimeout(() => location.href = 'amis.html', 1500);
}
async function hangup(msg) {
  try { if (callRef) await updateDoc(callRef, { status: 'ended' }); } catch (e) {}
  end(msg);
}
$('hangupBtn').onclick = () => hangup();
$('muteBtn').onclick = e => {
  const t = localStream?.getAudioTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; e.currentTarget.classList.toggle('off', !t.enabled);
};

// ---------- DÉMARRAGE ----------
const p = new URLSearchParams(location.search);
(async () => {
  try {
    if (!MON_ID) return setStatus("Vous n'êtes pas connecté (uid manquant).");
    if (p.get('call'))        await startCall(p.get('call'), p.get('video') === 'true');
    else if (p.get('answer')) await answerCall(p.get('answer'));
    else setStatus("Aucun appel à afficher.");
  } catch (e) { console.error(e); }
})();
</script>
</body>
</html>
