<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ajouter Produit - FIX DELETE & PUBLIE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#000;color:#fff;padding:12px;padding-bottom:80px}
.header{background:#111;border:2px solid gold;border-radius:12px;padding:12px;text-align:center;margin-bottom:12px}
h1{color:gold;font-size:18px}
.card-form{background:#111;border:1px solid gold;border-radius:14px;padding:16px;margin-bottom:16px}
.input{width:100%;background:#000;border:1.5px solid gold;border-radius:10px;padding:12px;color:#fff;margin:8px 0;font-size:14px}
.btn{width:100%;background:linear-gradient(gold,#b8860b);border:0;padding:14px;border-radius:12px;font-weight:900;color:#000;font-size:14px;margin-top:10px;cursor:pointer}
.btn:active{transform:scale(0.97)}
.prod-list{display:flex;flex-direction:column;gap:10px}
.prod-item{background:#111;border:1px solid #222;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.prod-item img{width:60px;height:60px;border-radius:10px;object-fit:cover;background:#222}
.prod-info{flex:1}
.prod-info b{display:block;color:#fff;font-size:13px}
.prod-info span{color:gold;font-size:12px}
.prod-info small{color:#888;font-size:11px}
.prod-actions{display:flex;gap:6px}
.act{width:36px;height:36px;border-radius:10px;border:1.5px solid gold;background:#000;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.act.del{border-color:#ff4444}
.act.pub{border-color:#25D366}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:gold;color:#000;padding:14px 20px;border-radius:12px;font-weight:900;z-index:9999;display:none;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:90%;text-align:center}
.status{font-size:10px;padding:3px 8px;border-radius:10px;display:inline-block;margin-top:4px}
.status.pub{background:#0a2a0a;color:#25D366;border:1px solid #25D366}
.status.npub{background:#2a0a0a;color:#ff6666;border:1px solid #ff4444}
</style>
</head>
<body>

<div class="header">
<h1>➕ Nouveau produit - FIX</h1>
<p style="font-size:11px;color:#888;margin-top:4px">Suppression et publication corrigées</p>
</div>

<div class="card-form">
<input id="pName" class="input" placeholder="Nom (ex: Djine styline / xxl / bleu)">
<input id="pPrice" class="input" type="number" placeholder="Prix (F) ex: 8000">
<input id="pCat" class="input" placeholder="Catégorie (ex: Homme)">
<input id="pFile" type="file" accept="image/*" class="input">
<img id="pPrev" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;display:none;margin-top:8px">
<button class="btn" onclick="saveProdFix()">✅ Enregistrer</button>
<div id="msg" style="text-align:center;margin-top:10px;font-size:12px;min-height:16px"></div>
</div>

<div style="margin:12px 0">
<h3 style="color:gold;font-size:14px">📦 Mes articles (<span id="count">0</span>)</h3>
<p style="font-size:10px;color:#666">✅ = Publié visible en haut | ❌ = Non publié</p>
</div>

<div class="prod-list" id="list"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getDatabase, ref, set, onValue, remove, update } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js';

const firebaseConfig={
  apiKey:"AIzaSyB...", // ton apiKey
  authDomain:"project-f4477c80-7c55-4db7-b2e-default-rtdb.europe-west1.firebasedatabase.app",
  databaseURL:"https://project-f4477c80-7c55-4db7-b2e-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"project-f4477c80-7c55-4db7-b2e",
  storageBucket:"project-f4477c80-7c55-4db7-b2e.firebasestorage.app",
  messagingSenderId:"697604298457",
  appId:"1:697604298457:web:4f9a6d66ec6fde9c1990c8"
};
let db; let products={};
try{ const app=initializeApp(firebaseConfig); db=getDatabase(app); }catch(e){ console.log('Firebase local mode'); }

const $=id=>document.getElementById(id);
function toast(m){
  const e=$('toast'); e.textContent=m; e.style.display='block';
  setTimeout(()=>e.style.display='none',3500);
  if(navigator.vibrate) navigator.vibrate(40);
}

let tmpImg='';
$('pFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const k=Math.min(1,800/Math.max(img.width,img.height));
      c.width=img.width*k; c.height=img.height*k;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      tmpImg=c.toDataURL('image/jpeg',0.7);
      $('pPrev').src=tmpImg; $('pPrev').style.display='block';
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
};

function uid(){ return 'prod_'+Date.now()+'_'+Math.random().toString(36).slice(2,6); }

window.saveProdFix=async()=>{
  const name=$('pName').value.trim();
  const price=Number($('pPrice').value);
  const cat=$('pCat').value.trim()||'Homme';
  if(!name||!price){ $('msg').textContent='❌ Nom et prix obligatoires'; $('msg').style.color='#ff6666'; return; }
  if(!tmpImg && !window.editId){ $('msg').textContent='❌ Photo obligatoire'; $('msg').style.color='#ff6666'; return; }
  const id=window.editId||uid();
  const old=products[id]||{};
  const data={id,name,price,cat,img:tmpImg||old.img||'',date:old.date||Date.now(),publie:true,stock:true};
  $('msg').textContent='⏳ Enregistrement...'; $('msg').style.color='#aaa';
  try{
    if(db){
      await set(ref(db,'products/'+id),data);
    }else{
      let local=JSON.parse(localStorage.getItem('b_products')||'{}');
      local[id]=data; localStorage.setItem('b_products',JSON.stringify(local));
    }
    $('msg').textContent='✅ Article PUBLIÉ ! Visible en haut page d\'accueil'; $('msg').style.color='#25D366';
    toast('✅ Article publié en haut de l\'accueil');
    $('pName').value=''; $('pPrice').value=''; $('pCat').value=''; $('pFile').value=''; $('pPrev').style.display='none'; tmpImg=''; window.editId=null;
    // Notif push
    fetch('/api/push',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({act:'new',title:'🆕 '+name,body:name+' - '+price+' F'})}).catch(()=>{});
  }catch(e){
    $('msg').textContent='❌ Erreur: '+e.message; $('msg').style.color='#ff6666';
    toast('❌ Erreur enregistrement');
  }
};

window.delProdFix=async(id)=>{
  if(!confirm('🗑️ Supprimer définitivement cet article ?\nCette action est irréversible')) return;
  try{
    if(db){
      await remove(ref(db,'products/'+id));
      await remove(ref(db,'articles/'+id));
    }
    let local=JSON.parse(localStorage.getItem('b_products')||'{}');
    if(local[id]){ delete local[id]; localStorage.setItem('b_products',JSON.stringify(local)); }
    toast('🗑️ Article supprimé avec succès');
    // Animation suppression
    const el=document.querySelector(`[data-id="${id}"]`);
    if(el){ el.style.transform='scale(0)'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }
  }catch(e){
    toast('❌ Erreur suppression: '+e.message);
  }
};

window.editProdFix=(id)=>{
  const p=products[id]; if(!p) return;
  $('pName').value=p.name; $('pPrice').value=p.price; $('pCat').value=p.cat;
  $('pPrev').src=p.img; $('pPrev').style.display='block';
  tmpImg=''; window.editId=id;
  toast('✏️ Modifie et ré-enregistre');
  window.scrollTo({top:0,behavior:'smooth'});
};

window.togglePublie=async(id)=>{
  const p=products[id]; if(!p) return;
  const newState=!p.publie;
  try{
    if(db) await update(ref(db,'products/'+id),{publie:newState});
    else{
      let local=JSON.parse(localStorage.getItem('b_products')||'{}');
      if(local[id]){ local[id].publie=newState; localStorage.setItem('b_products',JSON.stringify(local)); }
    }
    toast(newState ? '✅ Article PUBLIÉ - Visible en haut' : '❌ Article DÉPUBLIÉ - Caché de l\'accueil');
  }catch(e){ toast('Erreur: '+e.message); }
};

function render(list){
  products=list; $('count').textContent=Object.keys(list).length;
  $('list').innerHTML=Object.values(list).sort((a,b)=>b.date-a.date).map(p=>`
    <div class="prod-item" data-id="${p.id}">
      <img src="${p.img||''}" onerror="this.src='https://via.placeholder.com/60'">
      <div class="prod-info">
        <b>${p.name}</b>
        <span>${p.price} F • ${p.cat}</span>
        <span class="status ${p.publie!==false?'pub':'npub'}">${p.publie!==false?'✅ PUBLIÉ en haut':'❌ NON PUBLIÉ'}</span>
      </div>
      <div class="prod-actions">
        <div class="act pub" onclick="togglePublie('${p.id}')" title="${p.publie!==false?'Dépublier':'Publier'}">${p.publie!==false?'✅':'❌'}</div>
        <div class="act" onclick="editProdFix('${p.id}')" title="Modifier">✏️</div>
        <div class="act del" onclick="delProdFix('${p.id}')" title="Supprimer">🗑️</div>
      </div>
    </div>
  `).join('') || '<p style="text-align:center;color:#666;padding:20px">Aucun article</p>';
}

function init(){
  if(db){
    onValue(ref(db,'products'),snap=>{
      render(snap.val()||{});
    });
  }else{
    const local=JSON.parse(localStorage.getItem('b_products')||'{}');
    render(local);
  }
}
init();
</script>
</body>
</html>
