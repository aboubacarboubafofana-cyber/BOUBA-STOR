<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BOUBA STOR - Admin Produits FIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#000;color:#fff;padding:12px;padding-bottom:80px}
.header{background:#111;border:2px solid gold;border-radius:12px;padding:12px;text-align:center;margin-bottom:12px}
h1{color:gold;font-size:18px}
.card-form{background:#111;border:1px solid gold;border-radius:14px;padding:16px;margin-bottom:16px}
.input{width:100%;background:#000;border:1.5px solid gold;border-radius:10px;padding:12px;color:#fff;margin:8px 0;font-size:14px}
.btn{width:100%;background:linear-gradient(gold,#b8860b);border:0;padding:14px;border-radius:12px;font-weight:900;color:#000;font-size:14px;margin-top:10px;cursor:pointer}
.prod-list{display:flex;flex-direction:column;gap:10px}
.prod-item{background:#111;border:1px solid #333;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.prod-item img{width:60px;height:60px;border-radius:10px;object-fit:cover;background:#222}
.prod-info{flex:1}
.prod-info b{display:block;color:#fff;font-size:13px}
.prod-info span{color:gold;font-size:12px}
.prod-actions{display:flex;gap:6px}
.act{width:38px;height:38px;border-radius:10px;border:1.5px solid gold;background:#000;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.act.del{border-color:#ff4444;background:#1a0a0a}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:gold;color:#000;padding:14px 20px;border-radius:12px;font-weight:900;z-index:9999;display:none;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:90%;text-align:center}
.status{font-size:10px;padding:3px 8px;border-radius:10px;display:inline-block;margin-top:4px}
.status.pub{background:#0a2a0a;color:#25D366;border:1px solid #25D366}
.status.npub{background:#2a0a0a;color:#ff6666;border:1px solid #ff4444}
</style>
</head>
<body>
<div class="header">
<h1>➕ Nouveau produit</h1>
<p style="font-size:11px;color:#888">Suppression corrigée - plus d'erreur length</p>
</div>
<div class="card-form">
<input id="pName" class="input" placeholder="Nom (ex: Djine styline / xxl / bleu)">
<input id="pPrice" class="input" type="number" placeholder="Prix (F) ex: 8000">
<input id="pCat" class="input" placeholder="Catégorie (ex: Homme)">
<input id="pFile" type="file" accept="image/*" class="input">
<img id="pPrev" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;display:none;margin-top:8px">
<button class="btn" onclick="saveProd()">✅ Enregistrer</button>
<div id="msg" style="text-align:center;margin-top:10px;font-size:12px;min-height:16px"></div>
</div>
<div style="margin:12px 0">
<h3 style="color:gold;font-size:14px">📦 Mes articles (<span id="count">0</span>)</h3>
</div>
<div class="prod-list" id="list"></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
function toast(m){
  const e=$('toast'); e.textContent=m; e.style.display='block';
  setTimeout(()=>e.style.display='none',3500);
  if(navigator.vibrate) navigator.vibrate(40);
}
let tmpImg=''; let editId=null;
$('pFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const k=Math.min(1,800/Math.max(img.width,img.height));
      c.width=img.width*k; c.height=img.height*k;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      tmpImg=c.toDataURL('image/jpeg',0.7);
      $('pPrev').src=tmpImg; $('pPrev').style.display='block';
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
};
function getProds(){
  try{ return JSON.parse(localStorage.getItem('b_products')||'{}'); }catch{ return {}; }
}
function setProds(o){
  try{ localStorage.setItem('b_products',JSON.stringify(o)); return true; }catch(e){ toast('❌ Mémoire pleine'); return false; }
}
function uid(){ return 'prod_'+Date.now()+'_'+Math.random().toString(36).slice(2,6); }
window.saveProd=()=>{
  const name=$('pName').value.trim();
  const price=Number($('pPrice').value);
  const cat=$('pCat').value.trim()||'Homme';
  if(!name){ toast('❌ Nom obligatoire'); return; }
  if(!price){ toast('❌ Prix obligatoire'); return; }
  if(!tmpImg && !editId){ toast('❌ Photo obligatoire'); return; }
  const prods=getProds();
  const id=editId||uid();
  const old=prods[id]||{};
  const data={id,name,price,cat,img:tmpImg||old.img||'',date:old.date||Date.now(),publie:true};
  prods[id]=data;
  if(setProds(prods)){
    $('msg').textContent='✅ Article PUBLIÉ !'; $('msg').style.color='#25D366';
    toast('✅ Article publié');
    $('pName').value=''; $('pPrice').value=''; $('pCat').value=''; $('pFile').value=''; $('pPrev').style.display='none'; tmpImg=''; editId=null;
    render();
  }
};
window.delProd= (id)=>{
  if(!id){ toast('❌ ID manquant'); return; }
  if(!confirm('🗑️ Supprimer définitivement ?')) return;
  try{
    const prods=getProds();
    if(prods[id]){
      delete prods[id];
      setProds(prods);
      toast('🗑️ Article supprimé');
      render();
    }else{
      toast('❌ Article introuvable');
    }
  }catch(e){
    toast('❌ Erreur: '+e.message);
    console.error(e);
  }
};
window.editProd=(id)=>{
  const prods=getProds();
  const p=prods[id]; if(!p){ toast('❌ Introuvable'); return; }
  $('pName').value=p.name; $('pPrice').value=p.price; $('pCat').value=p.cat;
  $('pPrev').src=p.img; $('pPrev').style.display='block';
  editId=id;
  toast('✏️ Modifie puis Enregistrer');
  window.scrollTo({top:0,behavior:'smooth'});
};
function render(){
  const prods=getProds();
  const list=Object.values(prods);
  $('count').textContent=list.length;
  $('list').innerHTML=list.sort((a,b)=>(b.date||0)-(a.date||0)).map(p=>`
    <div class="prod-item">
      <img src="${p.img||''}" onerror="this.src='https://via.placeholder.com/60'">
      <div class="prod-info">
        <b>${(p.name||'').replace(/</g,'&lt;')}</b>
        <span>${p.price||0} F • ${p.cat||''}</span>
        <span class="status pub">✅ PUBLIÉ</span>
      </div>
      <div class="prod-actions">
        <div class="act" onclick="editProd('${p.id}')">✏️</div>
        <div class="act del" onclick="delProd('${p.id}')">🗑️</div>
      </div>
    </div>
  `).join('') || '<p style="text-align:center;color:#666;padding:20px">Aucun article</p>';
}
render();
</script>
</body>
</html>
