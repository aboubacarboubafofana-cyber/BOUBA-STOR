<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amis - Bouba Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #ffd700;
            --gray-text: #888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 70px; }
        
        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; position: sticky; top: 0; background: var(--bg-color); z-index: 100; }
        .top-bar h2 { color: var(--accent-color); }
        .top-bar .icons i { font-size: 1.3rem; margin-left: 15px; color: var(--accent-color); cursor: pointer; }
        
        /* Search */
        .search-container { padding: 0 15px 15px; }
        .search-box { background: var(--card-bg); border-radius: 20px; padding: 10px 15px; display: flex; align-items: center; border: 1px solid #333; }
        .search-box input { background: transparent; border: none; color: white; margin-left: 10px; width: 100%; outline: none; }
        
        /* Filters */
        .filters { display: flex; padding: 0 15px 15px; gap: 10px; overflow-x: auto; }
        .filter-btn { background: var(--card-bg); border: 1px solid #333; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        .filter-btn.active { background: var(--accent-color); color: black; font-weight: bold; }
        
        /* Friend List */
        .friend-list { padding: 0 15px; }
        .friend-item { display: flex; align-items: center; background: var(--card-bg); margin-bottom: 10px; padding: 10px 15px; border-radius: 12px; border: 1px solid #222; cursor: pointer; }
        .avatar { width: 50px; height: 50px; background: var(--accent-color); color: black; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; }
        .friend-info { flex: 1; }
        .friend-info h4 { font-size: 1rem; }
        .friend-info p { font-size: 0.8rem; color: var(--gray-text); }
        .actions i { font-size: 1.2rem; margin-left: 10px; color: var(--accent-color); background: #252525; padding: 10px; border-radius: 50%; cursor: pointer; }
        
        /* FAB */
        .fab-add { position: fixed; bottom: 80px; right: 20px; background: var(--accent-color); color: black; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4); z-index: 200; cursor: pointer; }
        
        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--gray-text); font-size: 0.8rem; cursor: pointer; }
        .nav-item i { font-size: 1.3rem; margin-bottom: 5px; }
        .nav-item.active { color: var(--accent-color); }

        /* Modal */
        .modal { display: none; position: fixed; bottom: 0; width: 100%; background: var(--card-bg); border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; z-index: 300; border-top: 2px solid var(--accent-color); }
        .modal h3 { margin-bottom: 15px; color: var(--accent-color); }
        .modal-option { display: flex; align-items: center; background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
        .modal-option i { font-size: 1.5rem; margin-right: 15px; width: 30px; text-align: center; }
        .modal-option.whatsapp i { color: #25D366; }
        .modal-option.contact i { color: #4285F4; }
        .modal-option.sms i { color: #FFA500; }
        .modal-option.email i { color: #EA4335; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 250; }

        /* Chat Modal (Simulé) */
        .chat-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 400; flex-direction: column; }
        .chat-header { padding: 15px; background: var(--card-bg); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; }
        .chat-header .back-btn { color: var(--accent-color); font-size: 1.5rem; cursor: pointer; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 0.9rem; }
        .msg.received { background: #333; align-self: flex-start; border-bottom-left-radius: 0; }
        .msg.sent { background: var(--accent-color); color: black; align-self: flex-end; border-bottom-right-radius: 0; }
        .chat-input-area { padding: 15px; background: var(--card-bg); display: flex; gap: 10px; border-top: 1px solid #333; }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #444; background: #222; color: white; outline: none; }
        .chat-input-area button { background: var(--accent-color); border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-home" style="color: var(--accent-color);"></i>
            <h2>Amis</h2>
        </div>
        <div class="icons">
            <i class="fas fa-crown" style="color: #b8860b;"></i>
            <i class="fas fa-plus-circle" onclick="openInviteModal()"></i>
        </div>
    </div>

    <!-- Search -->
    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search" style="color: var(--gray-text);"></i>
            <input type="text" id="searchInput" placeholder="Rechercher un ami...">
        </div>
    </div>

    <!-- Filters -->
    <div class="filters">
        <button class="filter-btn active">Tous</button>
        <button class="filter-btn">En ligne</button>
        <button class="filter-btn">Favoris</button>
    </div>

    <!-- Liste des amis (Générée dynamiquement par Firebase) -->
    <div class="friend-list" id="friendList">
        <!-- Exemple statique pour l'instant, Firebase le remplacera -->
        <div class="friend-item" onclick="openChat('Aboubacar Bouba', 'AB')">
            <div class="avatar">AB</div>
            <div class="friend-info">
                <h4>Aboubacar Bouba</h4>
                <p>Hors ligne</p>
            </div>
            <div class="actions">
                <i class="fas fa-star"></i>
                <i class="fas fa-phone" onclick="window.location.href='Call.html?call=ID_AMI&video=false'"></i>
<i class="fas fa-video" onclick="window.location.href='Call.html?call=ID_AMI&video=true'"></i>
            </div>
        </div>
    </div>

    <!-- FAB -->
    <div class="fab-add" onclick="openInviteModal()">
        <i class="fas fa-plus"></i>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item">
            <i class="fas fa-comment-dots"></i>
            <span>Discussions</span>
        </div>
        <div class="nav-item active">
            <i class="fas fa-user-friends"></i>
            <span>Amis</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-circle-notch"></i>
            <span>Actus</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-phone-alt"></i>
            <span>Appels</span>
        </div>
    </div>

    <!-- Modal Invitation -->
    <div class="overlay" id="overlay" onclick="closeInviteModal()"></div>
    <div class="modal" id="inviteModal">
        <h3>Inviter des amis</h3>
        <div class="modal-option whatsapp" onclick="shareWhatsApp()">
            <i class="fab fa-whatsapp"></i>
            <span>WhatsApp</span>
        </div>
        <div class="modal-option contact" onclick="inviteFromContacts()">
            <i class="fas fa-address-book"></i>
            <span>Depuis le répertoire</span>
        </div>
        <div class="modal-option sms" onclick="shareSMS()">
            <i class="fas fa-comment-sms"></i>
            <span>SMS</span>
        </div>
        <div class="modal-option email" onclick="shareEmail()">
            <i class="fas fa-envelope"></i>
            <span>E-mail</span>
        </div>
        <div class="modal-option link" onclick="copyLink()">
            <i class="fas fa-link"></i>
            <span>Partager / copier le lien</span>
        </div>
    </div>

    <!-- Chat Modal -->
    <div class="chat-modal" id="chatModal">
        <div class="chat-header">
            <i class="fas fa-arrow-left back-btn" onclick="closeChat()"></i>
            <h3 id="chatName">Nom de l'ami</h3>
            <div>
                <i class="fas fa-phone" style="color: var(--accent-color); margin-right: 15px;" onclick="startCall()"></i>
                <i class="fas fa-video" style="color: var(--accent-color);" onclick="startVideoCall()"></i>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <!-- Les messages s'afficheront ici -->
        </div>
        <div class="chat-input-area">
            <i class="fas fa-microphone" style="color: var(--accent-color); font-size: 1.5rem; cursor: pointer;" onclick="recordVoice()"></i>
            <input type="text" id="messageInput" placeholder="Écrire un message...">
            <button onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

    <!-- Scripts Firebase (Version Modulaire) -->
    <script type="module">
        // 1. IMPORTATION DES MODULES FIREBASE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 2. CONFIGURATION FIREBASE (REMPLACE PAR TES PROPRES CLÉS)
        const firebaseConfig = {
            apiKey: "TON_API_KEY",
            authDomain: "TON_PROJET.firebaseapp.com",
            projectId: "TON_PROJET_ID",
            storageBucket: "TON_PROJET.appspot.com",
            messagingSenderId: "TON_SENDER_ID",
            appId: "TON_APP_ID"
        };

        // Initialisation
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 3. VARIABLES GLOBALES
        let currentUser = null;
        let currentChatId = null;

        // 4. SURVEILLER L'ÉTAT DE CONNEXION
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                console.log("Utilisateur connecté :", user.email);
                // Charger la liste des amis ici
            } else {
                console.log("Aucun utilisateur connecté");
                // Rediriger vers login.html si nécessaire
            }
        });

        // 5. FONCTIONS DE L'INTERFACE
        window.openInviteModal = () => {
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('inviteModal').style.display = 'block';
        };

        window.closeInviteModal = () => {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('inviteModal').style.display = 'none';
        };

        // 6. FONCTIONS DE PARTAGE (INVITATIONS)
        const appLink = "https://bouba-store.vercel.app"; // Ton lien Vercel

        window.shareWhatsApp = () => {
            window.open(`https://wa.me/?text=Rejoins-moi sur Bouba Store ! ${appLink}`, '_blank');
        };

        window.shareSMS = () => {
            window.open(`sms:?body=Rejoins-moi sur Bouba Store ! ${appLink}`, '_blank');
        };

        window.shareEmail = () => {
            window.open(`mailto:?subject=Invitation Bouba Store&body=Rejoins-moi ici : ${appLink}`, '_blank');
        };

        window.copyLink = () => {
            navigator.clipboard.writeText(appLink).then(() => {
                alert("Lien copié dans le presse-papiers !");
            });
        };

        window.inviteFromContacts = async () => {
            // L'API Contacts n'est pas accessible directement en HTML pur.
            // On utilise l'API de partage native du téléphone.
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Bouba Store',
                        text: 'Rejoins-moi sur Bouba Store !',
                        url: appLink,
                    });
                } catch (err) {
                    console.log('Partage annulé');
                }
            } else {
                alert("Ton navigateur ne supporte pas le partage direct. Copie le lien manuellement.");
            }
        };

        // 7. FONCTIONS DE CHAT (TEMPS RÉEL)
        window.openChat = (name, initials) => {
            document.getElementById('chatModal').style.display = 'flex';
            document.getElementById('chatName').innerText = name;
            // Générer un ID de chat unique (ex: user1_user2)
            // Pour l'exemple, on utilise un ID fixe. Dans la vraie vie, il faut trier les UIDs.
            currentChatId = "chat_room_1"; 
            loadMessages();
        };

        window.closeChat = () => {
            document.getElementById('chatModal').style.display = 'none';
            currentChatId = null;
        };

        // Envoyer un message
        window.sendMessage = async () => {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text === "" || !currentChatId) return;

            try {
                await addDoc(collection(db, "chats", currentChatId, "messages"), {
                    text: text,
                    senderId: currentUser ? currentUser.uid : "anonyme",
                    timestamp: serverTimestamp()
                });
                input.value = "";
            } catch (e) {
                console.error("Erreur d'envoi : ", e);
                alert("Erreur lors de l'envoi du message.");
            }
        };

        // Charger les messages en temps réel
        function loadMessages() {
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.innerHTML = ""; // Vider

            const q = query(
                collection(db, "chats", currentChatId, "messages"),
                orderBy("timestamp", "asc")
            );

            onSnapshot(q, (snapshot) => {
                messagesContainer.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const msgDiv = document.createElement('div');
                    msgDiv.classList.add('msg');
                    
                    // Vérifier si c'est mon message ou celui de l'autre
                    if (currentUser && data.senderId === currentUser.uid) {
                        msgDiv.classList.add('sent');
                    } else {
                        msgDiv.classList.add('received');
                    }
                    
                    msgDiv.innerText = data.text;
                    messagesContainer.appendChild(msgDiv);
                });
                // Scroll vers le bas
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        // 8. FONCTIONS APPELS (SIMULATION)
        // Pour du vrai WebRTC, il faut un serveur de signalisation (Socket.io)
        window.startCall = () => {
            alert("📞 Appel vocal vers " + (currentChatId ? "cet ami" : "l'ami") + "...\n(Fonctionnalité WebRTC à connecter)");
        };

        window.startVideoCall = () => {
            alert("📹 Appel vidéo vers " + (currentChatId ? "cet ami" : "l'ami") + "...\n(Fonctionnalité WebRTC à connecter)");
        };

        // 9. MESSAGE VOCAL (SIMULATION)
        window.recordVoice = () => {
            alert("🎤 Enregistrement vocal...\n(Fonctionnalité MediaRecorder à connecter)");
        };

    </script>
</body>
</html>
