<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amis - Bouba Store</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#0f0f0f;--card:#1a1a1a;--acc:#ffd700;--gray:#888}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:#fff;padding-bottom:70px}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:15px;position:sticky;top:0;background:var(--bg);z-index:5}
h2{color:var(--acc)}
.icons i{font-size:1.3rem;margin-left:15px;color:var(--acc);cursor:pointer}
.search{margin:0 15px 15px;background:var(--card);border-radius:20px;padding:10px 15px;display:flex;align-items:center}
.search input{flex:1;background:transparent;border:0;color:#fff;margin-left:10px;outline:0;font-size:1rem}
.filters{display:flex;padding:0 15px 15px;gap:10px;overflow-x:auto}
.filters button{background:var(--card);border:1px solid #333;color:#fff;padding:8px 15px;border-radius:20px;cursor:pointer}
.filters .on{background:var(--acc);color:#000;font-weight:bold}
#friendList{padding:0 15px}
.friend-item{display:flex;align-items:center;background:var(--card);margin-bottom:10px;padding:10px;border-radius:15px;cursor:pointer}
.avatar{width:50px;height:50px;background:var(--acc);color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;margin-right:12px;flex-shrink:0;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.online-dot{position:absolute;bottom:2px;right:2px;width:12px;height:12px;background:#25D366;border-radius:50%;border:2px solid var(--card);display:none;}
.friend-info{flex:1;min-width:0}
.friend-info h4{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend-info p{font-size:.8rem;color:var(--gray)}
.actions{display:flex; gap:5px;}
.actions button{border:0;border-radius:18px;padding:9px 11px;background:var(--acc);color:#000;font-weight:bold;font-size:13px;}
.actions .del-btn{background:#ff4444;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;}
.note{padding:10px;color:var(--gray)}
.fab{position:fixed;bottom:80px;right:20px;background:var(--acc);color:#000;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;z-index:6;border:none}
.bottom-nav{position:fixed;bottom:0;width:100%;background:#111;display:flex;justify-content:space-around;padding:10px 0;z-index:8}
.nav-item{display:flex;flex-direction:column;align-items:center;color:var(--gray);font-size:.8rem;cursor:pointer}
.nav-item i{font-size:1.3rem;margin-bottom:5px}
.nav-item.active{color:var(--acc)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:15}
.modal{display:none;position:fixed;bottom:0;width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:20px;z-index:20}
.modal h3{margin-bottom:15px;color:var(--acc)}
.opt{display:flex;align-items:center;background:#252525;padding:15px;border-radius:10px;margin-bottom:10px;cursor:pointer}
.opt i{font-size:1.5rem;margin-right:15px;width:30px;text-align:center}
.opt.wa i{color:#25D366}.opt.ct i{color:#4285F4}.opt.sm i{color:#FFA500}.opt.em i{color:#EA4335}
.chat-modal{display:none;position:fixed;inset:0;background:var(--bg);flex-direction:column;z-index:30}
.chat-header{padding:15px;background:var(--card);display:flex;align-items:center;justify-content:space-between}
.chat-header i{color:var(--acc);font-size:1.4rem;cursor:pointer;margin-left:14px}
.chat-messages{flex:1;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 15px;border-radius:15px;font-size:.9rem;word-wrap:break-word; position:relative;}
.msg.received{background:#333;align-self:flex-start;border-bottom-left-radius:0}
.msg.sent{background:var(--acc);color:#000;align-self:flex-end;border-bottom-right-radius:0}
.chat-input{padding:15px;background:var(--card);display:flex;gap:10px;border-top:1px solid #333}
.chat-input input{flex:1;min-width:0;padding:12px;border-radius:20px;border:1px solid #444;background:#222;color:#fff;font-size:1rem}
.chat-input button{flex-shrink:0;background:var(--acc);border:0;padding:0 20px;border-radius:20px;font-weight:bold}
body{user-select:none;-webkit-user-select:none}input,textarea{user-select:text;-webkit-user-select:text}

/* BARRE DE STATUTS */
#statusBar { display: flex; overflow-x: auto; gap: 12px; padding: 10px 15px; border-bottom: 1px solid #222; }
.status-circle { display: flex; flex-direction: column; align-items: center; cursor: pointer; flex-shrink: 0; width: 70px; }
.status-img-box { width: 60px; height: 60px; border-radius: 50%; padding: 3px; border: 3px solid var(--gray); }
.status-img-box.new { border-color: var(--acc); }
.status-img-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.status-name { font-size: 11px; color: #ccc; margin-top: 5px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

/* VISIONNEUSE DE STATUT */
#statusViewer { display: none; position: fixed; inset: 0; background: #000; z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
#statusViewer img { max-width: 100%; max-height: 85%; object-fit: contain; }
#statusViewer .header { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; }
#statusViewer .header span { font-size: 18px; font-weight: bold; color: #fff; }
#statusViewer .delete-btn { background: #ff4444; color: #fff; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div class="top-bar">
  <div style="display:flex;align-items:center;gap:10px"><i class="fas fa-home" style="color:var(--acc)"></i><h2>Amis</h2></div>
  <div class="icons"><i class="fas fa-camera" onclick="document.getElementById('photoFile').click()"></i></div>
</div>

<!-- La barre de statuts sera insérée ici -->

<div id="myAvatar" class="avatar" style="overflow:hidden;margin:0 15px 15px;cursor:pointer" onclick="document.getElementById('photoFile').click()"></div>
<div class="search"><i class="fas fa-search" style="color:var(--gray)"></i>
  <input type="text" id="searchInput" placeholder="Rechercher un ami...">
</div>

<div class="filters">
  <button class="on" onclick="setFilter('all', this)">Tous</button>
  <button onclick="setFilter('fav', this)">Favoris</button>
</div>

<div id="friendList"><p class="note">Chargement...</p></div>
<input type="file" id="photoFile" accept="image/*" hidden>

<button class="fab" onclick="openInvite()"><i class="fas fa-plus"></i></button>

<div class="bottom-nav">
  <div class="nav-item" onclick="location.href='index.html'"><i class="fas fa-comment-dots"></i><span>Chats</span></div>
  <div class="nav-item active"><i class="fas fa-user-friends"></i><span>Amis</span></div>
  <div class="nav-item" onclick="openActus()"><i class="fas fa-circle-notch"></i><span>Actus</span></div>
  <div class="nav-item" onclick="alert('Appels bientôt disponible !')"><i class="fas fa-phone-alt"></i><span>Appels</span></div>
  <div class="nav-item" onclick="location.href='index.html'"><i class="fas fa-arrow-left"></i><span>Retour</span></div>
</div>

<div class="overlay" id="overlay" onclick="closeInvite()"></div>
<div class="modal" id="inviteModal">
  <h3>Inviter des amis</h3>
  <div class="opt wa" onclick="shareApp('wa')"><i class="fab fa-whatsapp"></i><span>WhatsApp</span></div>
  <div class="opt ct" onclick="syncContacts()"><i class="fas fa-address-book"></i><span>Chercher dans mon répertoire</span></div>
  <div class="opt sm" onclick="shareApp('sms')"><i class="fas fa-comment-sms"></i><span>SMS</span></div>
  <div class="opt em" onclick="shareApp('mail')"><i class="fas fa-envelope"></i><span>E-mail</span></div>
  <div class="opt" onclick="shareApp('copy')"><i class="fas fa-link" style="color:var(--acc)"></i><span>Partager / copier le lien</span></div>
</div>

<!-- Modal Ajouter Statut -->
<div id="statusModal" class="modal" style="height: 40vh; border-radius: 20px 20px 0 0;">
  <h3>Publier un statut</h3>
  <div style="margin-bottom: 15px;">
    <button onclick="document.getElementById('statusFile').click()" style="background:var(--acc); color:#000; padding:10px; border-radius:8px; font-weight:bold; border:none; width:100%;">
      ➕ Ajouter une photo
    </button>
    <input type="file" id="statusFile" accept="image/*" hidden>
  </div>
</div>

<!-- Visionneuse de Statut -->
<div id="statusViewer">
    <div class="header">
        <span id="viewerName"></span>
        <button class="delete-btn" id="deleteStatusBtn" onclick="deleteStatus()">🗑️</button>
    </div>
    <img id="viewerImg" src="" alt="">
</div>

<div class="chat-modal" id="chatModal">
  <div class="chat-header">
    <div style="display:flex;align-items:center"><i class="fas fa-arrow-left back" onclick="closeChat()"></i><div><h3 id="chatName"></h3><span id="chatStatus" style="font-size:12px;color:var(--gray);"></span></div></div>
    <div><i class="fas fa-phone" onclick="startCall(false)"></i><i class="fas fa-video" onclick="startCall(true)"></i></div>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div style="display:flex;gap:14px;padding:9px 14px;background:#1a1a1a">
    <button id="micBtn" style="background:none;border:0;color:#ffd700;font-size:1.3rem">🎤</button>
  </div>
  <div class="chat-input">
    <input type="text" id="messageInput" placeholder="Écrire un message..." maxlength="2000">
    <button onclick="sendMessage()">Envoyer</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, serverTimestamp, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyAnLLXpUC35OleB0hCLUXnLU0lMiesY7j4",
  authDomain: "project-f4477c80-7c55-4db7-b2e.firebaseapp.com",
  databaseURL: "https://project-f4477c80-7c55-4db7-b2e-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "project-f4477c80-7c55-4db7-b2e",
  storageBucket: "project-f4477c80-7c55-4db7-b2e.firebasestorage.app",
  messagingSenderId: "697604298457",
  appId: "1:697604298457:web:4f9a6d66ec6fde9c1990c8"
});
const db = getDatabase(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg = s => (typeof s === 'string' && (s.startsWith('data:image') || s.startsWith('http'))) ? s : '';
const ini = n => String(n || '?').slice(0, 2).toUpperCase();
const inviteText = 'Rejoins-moi sur Bouba Store ! ' + location.origin;

let me = null, allUsers = [], prefs = { hidden: [], favs: [] };
let currentFilter = "all", chatId = null, friendId = null, unsub = null, unsubStatus = null;
let currentStatusData = null, viewingStatusKey = null;

// 1. CONNEXION VIA LE TELEPHONE
const storedMe = localStorage.getItem('b_me');
if (storedMe) {
    const parsedMe = JSON.parse(storedMe);
    me = { uid: parsedMe.key, name: parsedMe.name, phone: parsedMe.phone, photo: parsedMe.photo || '' };
    prefs = JSON.parse(localStorage.getItem('chat_prefs_' + me.uid)) || { hidden: [], favs: [] };
    loadFriends();
    loadStatuses();
    setPresence();
    setInterval(setPresence, 30000); // Met à jour le statut en ligne toutes les 30s
} else { location.replace('index.html'); }

// Met à jour la présence en ligne
function setPresence() {
    if(me) set(ref(db, 'users/' + me.uid + '/lastSeen'), Date.now());
}

// 2. CHARGEMENT DES INSCRITS ET STATUTS
function loadFriends() {
    onValue(ref(db, 'users'), (snapshot) => {
        allUsers = [];
        const data = snapshot.val() || {};
        const myPhone = String(me.uid).replace(/\D/g, ''); 

        Object.keys(data).forEach(key => {
            const userPhone = String(key).replace(/\D/g, '');
            if (userPhone === myPhone) return; 
            
            const u = data[key];
            if (u && u.name) {
                const isOnline = u.lastSeen && (Date.now() - u.lastSeen < 60000); // En ligne si vu il y a moins d'1 min
                allUsers.push({ id: key, name: u.name, tel: String(u.phone || key), photo: safeImg(u.photo), online: isOnline });
            }
        });
        render(); 
        
        const myData = data[me.uid] || {};
        $('myAvatar').innerHTML = safeImg(myData.photo) ? `<img src="${safeImg(myData.photo)}" style="width:100%;height:100%;object-fit:cover">` : esc(ini(myData.name || me.name));
    });
}

// 3. AFFICHAGE
window.setFilter = function(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    render();
}

function render() {
    const q = $('searchInput').value.trim().toLowerCase();
    let arr = allUsers.filter(u => !prefs.hidden.includes(u.id)); 
    if (currentFilter === 'fav') arr = arr.filter(u => prefs.favs.includes(u.id));
    if (q) arr = arr.filter(u => u.name.toLowerCase().includes(q) || u.tel.includes(q));

    if (arr.length === 0) {
        $('friendList').innerHTML = '<p class="note">Aucun contact à afficher.</p>';
        return;
    }

    $('friendList').innerHTML = arr.map(u => `
        <div class="friend-item">
            <div class="avatar">
                ${u.photo ? `<img src="${u.photo}" style="width:100%;height:100%;object-fit:cover">` : esc(ini(u.name))}
                <div class="online-dot" style="display: ${u.online ? 'block' : 'none'};"></div>
            </div>
            <div class="friend-info">
                <h4>${esc(u.name)}</h4>
                <p style="color: ${u.online ? '#25D366' : 'var(--gray)'}">${u.online ? 'En ligne' : esc(u.tel)}</p>
            </div>
            <div class="actions">
                <button onclick="openChat('${esc(u.id)}', '${esc(u.name)}')">Discuter</button>
                <button class="del-btn" onclick="deleteFriend('${esc(u.id)}')">🗑️</button>
            </div>
        </div>`).join('');
}

$('searchInput').addEventListener('input', render);

// 4. CHAT ET NOTIFICATIONS
window.openChat = function(id, name) {
    friendId = id;
    chatId = [me.uid, id].sort().join('_');
    $('chatName').textContent = name;
    $('chatStatus').textContent = ''; 
    $('chatModal').style.display = 'flex';
    
    // Afficher si l'autre est en ligne
    onValue(ref(db, 'users/' + id + '/lastSeen'), (snap) => {
        const ls = snap.val();
        if (ls && (Date.now() - ls < 60000)) $('chatStatus').textContent = 'En ligne';
        else if (ls) $('chatStatus').textContent = 'Vu récemment';
    });

    loadMessages();
}

window.closeChat = function() {
    if (unsub) { unsub(); unsub = null; }
    $('chatModal').style.display = 'none';
    chatId = null; friendId = null;
}

function loadMessages() {
    if (unsub) unsub();
    const box = $('chatMessages');
    box.innerHTML = '<p style="color:#888;text-align:center">Chargement...</p>';
    const q = query(ref(db, 'chats/' + chatId + '/messages'), orderByChild('timestamp'), limitToLast(200));
    
    let otherReadTime = 0;
    onValue(ref(db, 'chats/' + chatId + '/read/' + friendId), (snap) => {
        otherReadTime = snap.val() || 0;
        document.querySelectorAll('.msg.sent').forEach(el => {
            const ts = parseInt(el.getAttribute('data-ts'));
            const tick = el.querySelector('.ticks');
            if (tick && ts && ts <= otherReadTime) {
                tick.textContent = '✓✓';
                tick.style.color = '#4fc3f7';
            }
        });
    });

    unsub = onValue(q, (snapshot) => {
        box.textContent = '';
        snapshot.forEach(child => {
            const m = child.val();
            const msgId = child.key;
            const div = document.createElement('div');
            div.className = 'msg ' + (m.senderId === me.uid ? 'sent' : 'received');
            
            const ts = m.timestamp || 0;
            if (m.senderId === me.uid) {
                div.setAttribute('data-ts', ts);
            }

            if (m.audio) {
                div.innerHTML = '<audio controls src="' + m.audio + '" style="max-width:100%"></audio>';
            } else {
                div.innerHTML = '<span>' + (m.text || '') + '</span>';
            }

            if (m.senderId === me.uid) {
                const footer = document.createElement('div');
                footer.style.cssText = 'display:flex; justify-content:flex-end; align-items:center; gap:6px; margin-top:4px; font-size:12px;';
                
                const tick = document.createElement('span');
                tick.className = 'ticks';
                if (ts && ts <= otherReadTime) {
                    tick.textContent = '✓✓';
                    tick.style.color = '#4fc3f7';
                } else {
                    tick.textContent = '✓';
                    tick.style.color = '#aaa';
                }

                const delBtn = document.createElement('span');
                delBtn.innerHTML = '🗑️';
                delBtn.style.cursor = 'pointer';
                delBtn.onclick = () => deleteMessage(msgId);

                footer.appendChild(tick);
                footer.appendChild(delBtn);
                div.appendChild(footer);
            }

            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    });
}

window.sendMessage = async function() {
    const input = $('messageInput');
    const text = input.value.trim();
    if (!text || !chatId) return;
    input.value = '';
    try { 
        await set(push(ref(db, 'chats/' + chatId + '/messages')), { text: text, senderId: me.uid, timestamp: serverTimestamp() }); 
    } catch (e) { alert("Erreur."); }
}

window.deleteMessage = async function(msgId) {
    if (!confirm("Supprimer ce message ?")) return;
    try { await remove(ref(db, 'chats/' + chatId + '/messages/' + msgId)); } catch (e) { alert("Erreur."); }
}

window.deleteFriend = function(id) {
    if (!confirm("Masquer ce contact de votre liste ?")) return;
    prefs.hidden.push(id);
    localStorage.setItem('chat_prefs_' + me.uid, JSON.stringify(prefs));
    render();
}

window.startCall = function(video) {
    if (friendId) location.href = 'call.html?call=' + encodeURIComponent(friendId) + '&video=' + video;
}

// 5. PHOTO DE PROFIL
async function setMyPhoto(f) {
    const url = URL.createObjectURL(f);
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    URL.revokeObjectURL(url);
    const c = document.createElement('canvas'); c.width = c.height = 200;
    const s = Math.max(200 / img.width, 200 / img.height);
    c.getContext('2d').drawImage(img, (200 - img.width * s) / 2, (200 - img.height * s) / 2, img.width * s, img.height * s);
    const photoData = c.toDataURL('image/jpeg', 0.7);
    
    await set(ref(db, 'users/' + me.uid + '/photo'), photoData);
    $('myAvatar').innerHTML = `<img src="${photoData}" style="width:100%;height:100%;object-fit:cover">`;
    
    const parsedMe = JSON.parse(localStorage.getItem('b_me'));
    parsedMe.photo = photoData;
    localStorage.setItem('b_me', JSON.stringify(parsedMe));
}
$('photoFile').onchange = e => { const f = e.target.files[0]; if (f) setMyPhoto(f); };

// 6. SYNCHRONISATION RÉPERTOIRE
window.syncContacts = async function() {
    closeInvite();
    if (!('contacts' in navigator && 'ContactsManager' in window)) return alert("Votre téléphone ne supporte pas l'accès au répertoire.");
    try {
        const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
        if (!contacts.length) return;
        let found = 0;
        contacts.forEach(c => {
            const tel = (c.tel || [])[0] || '';
            const cleanTel = tel.replace(/\D/g, '').slice(-9);
            if (allUsers.find(u => u.tel.replace(/\D/g, '').endsWith(cleanTel))) found++;
        });
        alert(`✅ ${found} contact(s) de votre répertoire sont déjà inscrits sur BOuba STOR.`);
    } catch (e) { alert("Autorisation refusée."); }
}

// 7. INVITATIONS
window.openInvite = function() { $('overlay').style.display='block'; $('inviteModal').style.display='block'; }
window.closeInvite = function() { $('overlay').style.display='none'; $('inviteModal').style.display='none'; }
window.shareApp = function(type) {
    if (type === 'wa') window.open('https://wa.me/?text=' + encodeURIComponent(inviteText), '_blank');
    else if (type === 'sms') window.open('sms:?body=' + encodeURIComponent(inviteText));
    else if (type === 'mail') window.open('mailto:?subject=Bouba Store&body=' + encodeURIComponent(inviteText));
    else if (type === 'copy') { navigator.clipboard.writeText(inviteText); alert('Lien copié !'); }
    closeInvite();
}

// 8. STATUTS (STORIES)
window.openActus = function() {
            $('overlay').style.display = 'block';
}

// Publier un statut
document.getElementById('statusFile').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = async function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            const base64 = canvas.toDataURL('image/jpeg', 0.6);
            await set(push(ref(db, 'status')), { name: me.name, photo: base64, date: Date.now(), uid: me.uid });
            alert('✅ Statut publié !');
            $('statusModal').style.display = 'none';
            $('overlay').style.display = 'none';
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
});

// Charger et afficher les statuts en haut
function loadStatuses() {
    const topBar = document.querySelector('.top-bar');
    let container = document.getElementById('storiesBar');
    
    if (!container) {
        container = document.createElement('div');
        container.id = 'storiesBar';
        container.className = 'statusBar';
        container.style.cssText = 'display:flex; overflow-x:auto; gap:12px; padding:10px 15px; border-bottom:1px solid #222;';
        topBar.parentNode.insertBefore(container, topBar.nextSibling);
    }

    const yesterday = Date.now() - (24 * 60 * 60 * 1000);
    const viewed = JSON.parse(localStorage.getItem('viewed_statuses')) || [];

    onValue(ref(db, 'status'), (snapshot) => {
        container.innerHTML = '';
        const data = snapshot.val();
        
        // Ajouter le bouton "Ma story"
        const myStory = document.createElement('div');
        myStory.className = 'status-circle';
        myStory.innerHTML = `<div class="status-img-box" style="border-color:var(--acc);background:#333;display:flex;align-items:center;justify-content:center;font-size:24px;color:#ffd700;">+</div><div class="status-name">Ajouter</div>`;
        myStory.onclick = () => { $('statusModal').style.display = 'block'; $('overlay').style.display = 'block'; };
        container.appendChild(myStory);

        if (!data) return;

        Object.keys(data).forEach(key => {
            const s = data[key];
            if (s.date > yesterday) {
                const isViewed = viewed.includes(key);
                const div = document.createElement('div');
                div.className = 'status-circle';
                div.innerHTML = `
                    <div class="status-img-box ${isViewed ? '' : 'new'}">
                        <img src="${s.photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">
                    </div>
                    <div class="status-name">${s.name}</div>
                `;
                div.onclick = () => openStatusViewer(key, s);
                container.appendChild(div);
            }
        });
    });
}

function openStatusViewer(key, statusObj) {
    let viewed = JSON.parse(localStorage.getItem('viewed_statuses')) || [];
    if (!viewed.includes(key)) {
        viewed.push(key);
        localStorage.setItem('viewed_statuses', JSON.stringify(viewed));
        loadStatuses(); 
    }

    currentStatusData = statusObj;
    viewingStatusKey = key;
    
    $('viewerName').textContent = statusObj.name;
    $('viewerImg').src = statusObj.photo;
    $('statusViewer').style.display = 'flex';

    $('deleteStatusBtn').style.display = (statusObj.uid === me.uid) ? 'block' : 'none';
}

window.deleteStatus = async function() {
    if (!confirm("Supprimer ce statut ?")) return;
    if (viewingStatusKey) {
        await remove(ref(db, 'status/' + viewingStatusKey));
        $('statusViewer').style.display = 'none';
    }
}

// 9. MICRO
let rec = null, chunks = [];
$('micBtn').addEventListener('click', async () => {
    if (!chatId) return;
    if (rec) { rec.stop(); return; }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        rec = new MediaRecorder(stream);
        chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            $('micBtn').textContent = '🎤';
            const blob = new Blob(chunks, { type: rec.mimeType });
            rec = null;
            const audio = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
            await set(push(ref(db, 'chats/' + chatId + '/messages')), { audio: audio, senderId: me.uid, timestamp: serverTimestamp() });
        };
        rec.start();
        $('micBtn').textContent = '⏹️';
        setTimeout(() => rec && rec.stop(), 60000);
    } catch (e) { alert('Autorisez le micro.'); }
});
</script>
