<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BOUBA STORE - Amis</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.top h1{color:#FFD400;font-weight:900;font-size:22px}.searchBox{margin:0 14px 10px;background:#111;border:1px solid #222;border-radius:24px;padding:11px 14px;display:flex;gap:10px}.searchBox input{flex:1;background:transparent;border:none;outline:none;color:#fff}.filters{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto}.chip{padding:7px 14px;border-radius:18px;border:1.5px solid #333;background:#111;color:#777;font-size:12px;font-weight:800;white-space:nowrap}.chip.on{background:#FFD400;color:#000}.view{flex:1;overflow:auto;padding-bottom:90px}.row{display:flex;gap:12px;padding:11px 16px;align-items:center}.av{width:52px;height:52px;border-radius:50%;background:#FFD400;color:#000;display:grid;place-items:center;font-weight:900;flex-shrink:0}.txt{flex:1;min-width:0;border-bottom:1px solid #111;padding-bottom:2px}.nm{font-weight:800;font-size:15px;display:flex;justify-content:space-between}.tm{font-size:11px;color:#FFD400}.sb{font-size:13px;color:#9aa0a6;margin-top:2px}.sec{padding:16px 16px 6px;color:#FFD400;font-size:11px;font-weight:900}.meta{display:flex;gap:12px;padding:12px 16px;overflow-x:auto}.mb{width:70px;text-align:center;flex-shrink:0}.circle{width:62px;height:62px;border-radius:50%;background:#111;border:2px solid #FFD400;display:grid;place-items:center;font-size:26px;color:#FFD400;margin:0 auto 6px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:6px 0}.bn{display:flex;flex-direction:column;align-items:center;gap:3px;color:#666;font-size:10px;padding:6px 16px}.bn.on{color:#FFD400}.fab{position:fixed;right:16px;bottom:92px;width:56px;height:56px;border-radius:18px;background:#FFD400;color:#000;display:grid;place-items:center;font-size:26px;font-weight:900}</style></head><body><div class="top"><h1 id="ht">Discussions</h1><div style="color:#FFD400;font-size:20px">🔍 📷 +</div></div><div id="vd"><div class="searchBox">🔍<input id="q" placeholder="Demander à Meta AI"></div><div class="filters"><div class="chip on">Toutes</div><div class="chip">Non lues</div><div class="chip">Favoris</div><div class="chip">Groupes</div></div><div class="view" id="ld"></div><div class="fab" onclick="newChat()">+</div></div><div id="va" style="display:none"><div class="view"><div class="sec">Statut</div><div class="row"><div class="av" style="background:#111;color:#FFD400;border:2px dashed #FFD400">B+</div><div class="txt"><div class="nm">Mon statut</div><div class="sb">13:43</div></div></div><div class="sec">Mises à jour récentes</div><div id="ls"></div></div></div><div id="vp" style="display:none"><div class="view"><div class="meta"><div class="mb"><div class="circle">📞</div>Appeler</div><div class="mb"><div class="circle">📅</div>Planifier</div><div class="mb"><div class="circle">⌨️</div>Clavier</div></div><div class="sec">Récents</div><div id="lp"></div></div></div><div id="vc" style="display:none"><div class="view" style="display:grid;place-items:center;height:60vh;text-align:center;padding:24px"><div><div style="width:88px;height:88px;border-radius:50%;background:#FFD400;color:#000;display:grid;place-items:center;font-size:40px;margin:0 auto">👥</div><h2 style="color:#FFD400;margin-top:14px">Communautés BOUBA</h2></div></div></div><div class="bottom"><div class="bn on" id="bd" onclick="go('d')"><div>💬</div>Discussions</div><div class="bn" id="ba" onclick="go('a')"><div>◎</div>Actus</div><div class="bn" id="bc" onclick="go('c')"><div>👥</div>Communaut...</div><div class="bn" id="bp" onclick="go('p')"><div>📞</div>Appels</div></div><script>let users=[{id:"1",name:"Dachenko",last:"On se voit demain ?",time:"13:42"},{id:"2",name:"BOUBA STORE ✓",last:"Nouveau catalogue",time:"13:10",badge:"2"},{id:"3",name:"Awa Touré",last:"Ok parfait !",time:"12:45"},{id:"4",name:"Ayouba",last:"Vocal • 0:24",time:"11:22"},{id:"5",name:"Gaspy",last:"Vocal • 1:05",time:"Hier"}];function load(){let ld=document.getElementById('ld');ld.innerHTML='';users.forEach(u=>{ld.innerHTML+=`<div class="row"><div class="av">${u.name[0]}</div><div class="txt"><div class="nm">${u.name}<span class="tm">${u.time}</span></div><div class="sb">${u.last} ${u.badge?`<span style="background:#FFD400;color:#000;padding:2px 7px;border-radius:10px;font-weight:900">${u.badge}</span>`:''}</div></div></div>`;});let ls=document.getElementById('ls');ls.innerHTML='';users.forEach(u=>{ls.innerHTML+=`<div class="row"><div class="av" style="border:2px solid #FFD400">${u.name[0]}</div><div class="txt"><div class="nm">${u.name}</div><div class="sb">il y a 12 min</div></div></div>`;});let lp=document.getElementById('lp');lp.innerHTML='';users.forEach(u=>{lp.innerHTML+=`<div class="row"><div class="av">${u.name[0]}</div><div class="txt"><div class="nm">${u.name}</div><div class="sb">↙ Aujourd'hui</div></div><div style="color:#FFD400">📞</div></div>`;});}function go(v){document.getElementById('vd').style.display=v=='d'?'block':'none';document.getElementById('va').style.display=v=='a'?'block':'none';document.getElementById('vp').style.display=v=='p'?'block':'none';document.getElementById('vc').style.display=v=='c'?'block':'none';document.querySelectorAll('.bn').forEach(b=>b.classList.remove('on'));document.getElementById(v=='d'?'bd':v=='a'?'ba':v=='p'?'bp':'bc').classList.add('on');document.getElementById('ht').innerText=v=='d'?'Discussions':v=='a'?'Actus':v=='p'?'Appels':'Communautés';}function newChat(){let n=prompt('Nom client?');if(n){users.unshift({id:Date.now(),name:n,last:'Nouveau BOUBA 📦',time:'Maintenant'});load();}}load();</script></body></html>
