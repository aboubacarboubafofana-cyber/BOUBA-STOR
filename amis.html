<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amis - BOUBA STORE</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;justify-content:space-between;padding:14px 16px}
.header h1{font-size:22px;font-weight:900;color:#FFD400}
.searchWrap{padding:0 14px 10px}.search{background:#111;border:1.5px solid #333;border-radius:24px;padding:12px 14px;display:flex;gap:10px}
.search input{background:transparent;border:none;outline:none;color:#fff;width:100%}
.filters{display:flex;gap:8px;padding:0 14px 12px;overflow:auto}.chip{padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid #FFD400;color:#FFD400;background:transparent}
.chip.active{background:#FFD400;color:#000}.content{flex:1;overflow:auto;padding-bottom:85px}
.item{display:flex;gap:12px;padding:11px 16px}.avatar{width:50px;height:50px;border-radius:50%;background:#FFD400;color:#000;display:grid;place-items:center;font-weight:900;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}.info{flex:1;border-bottom:1px solid #111;padding-bottom:12px}
.name{font-weight:800;font-size:15px}.time{font-size:11px;color:#9aa0a6}.last{font-size:13px;color:#9aa0a6}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}
.bnav{display:flex;flex-direction:column;align-items:center;color:#9aa0a6;font-size:10px;cursor:pointer}
.bnav.active{color:#FFD400}.fab{position:fixed;right:16px;bottom:90px;width:56px;height:56px;border-radius:16px;background:#FFD400;display:grid;place-items:center;font-size:26px;color:#000}
</style>
</head>

</html>
