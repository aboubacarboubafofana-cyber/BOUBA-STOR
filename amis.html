<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amis</title>
<style>
:root{--bg:#000;--card:#121212;--line:#2a2a2a;--y:#ffd600;--t:#fff;--m:#9a9a9a;--bub:#1d1d1d;--r:#e5532d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--card:#f6f6f6;--line:#e2e2e2;--t:#111;--m:#666;--bub:#eee}}
:root[data-theme="light"]{--bg:#fff;--card:#f6f6f6;--line:#e2e2e2;--t:#111;--m:#666;--bub:#eee}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t);font-family:Roboto,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.top h1{font-size:26px;font-weight:800;color:var(--y);flex:1}
.turbo{font-size:12px;font-weight:700;color:#000;background:var(--y);border-radius:20px;padding:6px 10px;display:flex;gap:6px;align-items:center}
.turbo i{width:8px;height:8px;border-radius:50%;background:#000;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.turbo i,.dot{animation:none}}
.tabs{display:flex;gap:8px;padding:6px 16px 10px;overflow-x:auto}
.tab{border:1.5px solid var(--y);border-radius:22px;padding:9px 16px;font-weight:700;white-space:nowrap}
.tab.on{background:var(--y);color:#000}
.search{margin:0 16px 8px;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--t);font:inherit;width:calc(100% - 32px)}
.list{flex:1;overflow-y:auto}
.row{display:flex;gap:10px;align-items:center;width:100%;padding:11px 16px;text-align:left}
.row:active{background:var(--card)}
.av{width:48px;height:48px;border-radius:50%;background:var(--y);color:#000;font-weight:800;font-size:19px;display:grid;place-items:center;flex:none;position:relative}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#2ecc71;border:2px solid var(--bg)}
.mid{flex:1;min-width:0}
.mid b{display:block}
.mid span{display:block;color:var(--m);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{text-align:right;font-size:12px;color:var(--m)}
.badge{display:inline-block;margin-top:4px;background:var(--y);color:#000;font-weight:800;border-radius:12px;padding:1px 7px}
.invite{margin:10px 16px 14px;background:var(--y);color:#000;font-weight:800;border-radius:14px;padding:15px;width:calc(100% - 32px)}
.small{padding:7px 11px;font-size:13px}
.empty{padding:30px 20px;color:var(--m);text-align:center}
#chat{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#chat.open{display:flex}
.ch{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.selbar{display:none;position:absolute;inset:0;background:var(--card);align-items:center;gap:12px;padding:0 12px;z-index:5;font-weight:700}
.ch.selmode .selbar{display:flex}
.ic{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--y);display:grid;place-items:center;font-size:18px;flex:none}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:9px 12px;border-radius:16px;background:var(--bub);line-height:1.35;word-wrap:break-word;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.b.me{align-self:flex-end;background:var(--y);color:#000;border-bottom-right-radius:4px}
.b.th{align-self:flex-start;border-bottom-left-radius:4px}
.b.sel{outline:3px solid var(--r);outline-offset:2px}
.b small{display:block;font-size:11px;opacity:.65;margin-top:3px;text-align:right}
.sys{align-self:center;font-size:12px;color:var(--m);background:var(--card);border-radius:12px;padding:5px 10px}
.vo{display:flex;align-items:center;gap:10px;min-width:200px}
.pl{width:36px;height:36px;border-radius:50%;background:#000;color:var(--y);flex:none}
.b.th .pl{background:var(--y);color:#000}
.wv{flex:1;display:flex;align-items:center;gap:2px;height:30px}
.wv i{flex:1;min-width:2px;background:currentColor;opacity:.35;border-radius:2px}
.wv i.on{opacity:1}
.bar{position:relative;padding:8px 12px}
.comp{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:10px 12px 8px}
.comp input[type=text]{width:100%;background:none;border:0;color:var(--t);font:inherit;padding:6px 4px 10px;outline:0}
.crow{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.cb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;border:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none}
#mic{position:relative;z-index:3;touch-action:none;-webkit-touch-callout:none}
.snd{background:var(--r);border-color:var(--r);color:#fff;font-weight:800}
.recbar{position:absolute;left:12px;right:12px;top:8px;bottom:8px;border-radius:26px;background:var(--card);border:1px solid var(--r);display:none;align-items:center;gap:10px;padding:0 112px 0 16px;z-index:2}
.bar.rec .recbar{display:flex}
.bar.rec #mic{background:var(--r);color:#fff;border-color:var(--r);transform:scale(1.3)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--r);animation:p 1s infinite;flex:none}
#wave{flex:1;height:32px;min-width:0}
.rh{font-size:11px;color:var(--m);white-space:nowrap}
#call{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;z-index:50;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color:#fff}
#call.open{display:flex}
#lv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#call.vid #lv{display:block}
.cinfo{position:relative;z-index:2;text-align:center;margin-top:48px;text-shadow:0 1px 6px #000}
.cinfo .av{margin:0 auto 10px;width:88px;height:88px;font-size:32px}
#call.vid .cinfo .av{display:none}
.cbtns{position:relative;z-index:2;margin-top:auto;display:flex;gap:18px;padding:24px}
.cbtns button{width:62px;height:62px;border-radius:50%;background:#2a2a2a;color:#fff;font-size:24px}
.cbtns .end{background:#e53935}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--y);color:#000;padding:10px 16px;border-radius:20px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90%;text-align:center}
#toast.on{opacity:1}
#sx{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:60}
#sx.open{display:flex}
.sheet{width:100%;background:var(--bg);border-top:2px solid var(--y);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
.sheet h3{color:var(--y);margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.share{padding:6px 16px 0}
.share span{display:block;font-size:13px;color:var(--m);margin-bottom:6px}
.share div{display:flex;gap:8px;flex-wrap:wrap}
.tab.wa{border-color:#25D366;color:#25D366}
.hint{color:var(--m);font-size:13px;margin:6px 0 8px}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
</style>
</head>
<body>
<div class="top"><a href="./" class="ic" aria-label="Retour à la boutique" style="text-decoration:none;color:var(--y)">←</a><h1>💬 Amis</h1><div class="turbo"><i></i>Turbo auto</div></div>
<div class="tabs" id="tabs">
<button class="tab on" data-t="amis">👥 Amis</button>
<button class="tab" data-t="rep">📒 Répertoire</button>
<button class="tab" data-t="dem">🔔 Demandes</button>
</div>
<input class="search" id="q" type="search" placeholder="Rechercher un ami">
<div class="list" id="list"></div>
<div class="share"><span>Invite tes proches à nous rejoindre :</span><div><button class="tab small wa" id="q-wa">💬 WhatsApp</button><button class="tab small" id="q-sms">✉️ SMS</button><button class="tab small" id="q-sh">↗ Partager</button></div></div>
<button class="invite" id="inv">📤 Inviter des amis ou clients</button>

<section id="chat" aria-label="Conversation">
<div class="ch" id="hdr">
<button class="ic" id="back" aria-label="Retour">←</button>
<div class="av" id="cav"></div>
<div class="mid"><b id="cn"></b><span>en ligne · Turbo</span></div>
<button class="ic" id="cv" aria-label="Appel vocal">📞</button>
<button class="ic" id="cvid" aria-label="Appel vidéo">🎥</button>
<div class="selbar"><button class="ic" id="unsel" aria-label="Annuler">✕</button><span id="selc" style="flex:1"></span><button class="tab on" id="del">🗑 Supprimer</button></div>
</div>
<div class="msgs" id="msgs" aria-live="polite"></div>
<div class="bar" id="bar">
<div class="comp">
<input type="text" id="txt" placeholder="Message" autocomplete="off">
<div class="crow">
<label class="cb" for="file" aria-label="Photo ou fichier">＋</label>
<input id="file" type="file" hidden>
<span class="sp"></span>
<button class="cb" id="mic" aria-label="Maintiens pour enregistrer un vocal">🎤</button>
<button class="cb snd" id="send" aria-label="Envoyer">↑</button>
</div></div>
<div class="recbar"><span class="dot"></span><b id="rt">0:00</b><canvas id="wave"></canvas><span class="rh">◀ glisse pour annuler</span></div>
</div>
</section>

<div id="call"><video id="lv" autoplay playsinline muted></video>
<div class="cinfo"><div class="av" id="cav2"></div><h2 id="cname"></h2><p id="cst"></p></div>
<div class="cbtns"><button id="mute" aria-label="Micro">🎙</button><button id="flip" aria-label="Changer de caméra">🔄</button><button class="end" id="end" aria-label="Raccrocher">📵</button></div></div>
<div id="sx"><div class="sheet" role="dialog" aria-label="Inviter">
<h3>📤 Inviter des amis ou clients</h3>
<div class="g2"><button class="tab" id="s-wa">💬 WhatsApp</button><button class="tab" id="s-sms">✉️ SMS</button><button class="tab" id="s-cp">🔗 Copier le lien</button><button class="tab" id="s-sh">↗ Autres apps</button></div>
<p class="hint">Ou ajoute un ami avec son numéro. Sans indicatif, +225 est ajouté automatiquement. Pour un autre pays, tape + et l'indicatif.</p>
<input class="search" id="snom" placeholder="Nom (facultatif)" style="width:100%;margin:0 0 8px">
<input class="search" id="snum" type="tel" placeholder="Numéro, ex : 07 87 61 97 17" style="width:100%;margin:0 0 10px">
<button class="invite" id="s-add" style="margin:0;width:100%">➕ Ajouter et inviter sur WhatsApp</button>
<button class="tab" id="sclose" style="margin-top:10px;width:100%">Fermer</button>
</div></div>
<div id="toast" role="status"></div>

<script>
var friends=[
{n:"Aina Rakoto",on:1,last:"Ok, je t'envoie ça tout de suite",h:"12:41",u:2},
{n:"Boutique Mahery",on:1,last:"Client : commande reçue ✅",h:"11:58",u:0},
{n:"Tiana R.",on:0,last:"Salut !",h:"Hier",u:0},
{n:"Fidy Andria",on:0,last:"Salut !",h:"Hier",u:1}];
var reqs=[{n:"Hery Solo"},{n:"Lalao Mina"}];
var phone=[],hist={},cur=null,tab="amis",sel={},mid=0,pl=null,R=null,hold=false,x0=0,lp=0,lpf=false,call=null,tt;
try{phone=JSON.parse(localStorage.getItem("ph")||"[]")}catch(e){}
var $=function(i){return document.getElementById(i)};
function ini(n){return n.split(" ").map(function(w){return w[0]}).join("").slice(0,2).toUpperCase()}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function now(){var d=new Date();return d.getHours()+":"+("0"+d.getMinutes()).slice(-2)}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},2800)}
function base(){return location.href.split("#")[0].split("?")[0].replace(/amis\.html$/,"")}
var INV="Rejoins-moi sur BOUBA STORE :";

/* ---------- liste ---------- */
function render(){
 var q=$("q").value.toLowerCase(),h="";
 if(tab==="dem"){
  reqs.forEach(function(r,i){h+='<div class="row"><div class="av">'+ini(r.n)+'</div><div class="mid"><b>'+esc(r.n)+'</b><span>Veut devenir ton ami</span></div><button class="tab on" data-ok="'+i+'">Accepter</button></div>'});
  if(!reqs.length)h='<div class="empty">Aucune demande en attente.</div>';
 }else{
  if(tab==="rep"){
   h+='<button class="invite" id="pick" style="margin-top:4px">📲 Choisir dans les contacts du téléphone</button>';
   phone.forEach(function(p,i){h+='<div class="row"><div class="av">'+ini(p.n)+'</div><div class="mid"><b>'+esc(p.n)+'</b><span>'+esc(p.t)+'</span></div><button class="tab small" data-wa="'+i+'">WhatsApp</button><button class="tab small" data-sms="'+i+'">SMS</button></div>'});
  }
  var L=friends.filter(function(f){return f.n.toLowerCase().indexOf(q)>-1});
  if(tab==="rep")L=L.slice().sort(function(a,b){return a.n.localeCompare(b.n)});
  L.forEach(function(f){var i=friends.indexOf(f);
   h+='<button class="row" data-i="'+i+'"><div class="av'+(f.on?' on':'')+'">'+ini(f.n)+'</div><div class="mid"><b>'+esc(f.n)+'</b><span>'+esc(f.last)+'</span></div><div class="meta">'+f.h+(f.u?'<br><span class="badge">'+f.u+'</span>':'')+'</div></button>'});
  if(!L.length&&tab==="amis")h='<div class="empty">Aucun ami trouvé. Invite quelqu\'un pour commencer.</div>';
 }
 $("list").innerHTML=h;
}
$("tabs").onclick=function(e){var t=e.target.closest(".tab");if(!t)return;tab=t.dataset.t;
 [].forEach.call(document.querySelectorAll("#tabs .tab"),function(x){x.classList.toggle("on",x===t)});render()};
$("q").oninput=render;
async function pick(){
 if(!(navigator.contacts&&navigator.contacts.select)){toast("Ouvre l'app dans Chrome sur Android pour accéder aux contacts. Sinon utilise « Inviter ».");return}
 try{var r=await navigator.contacts.select(["name","tel"],{multiple:true});
  r.forEach(function(c){var t=(c.tel&&c.tel[0])||"";if(t&&!phone.some(function(p){return p.t===t}))phone.push({n:(c.name&&c.name[0])||t,t:t})});
  try{localStorage.setItem("ph",JSON.stringify(phone))}catch(e){}
  render()}catch(e){}
}
$("list").onclick=function(e){
 var t;
 if(e.target.closest("#pick"))return pick();
 if(t=e.target.closest("[data-wa]")){var n=norm(phone[+t.dataset.wa].t);return void window.open("https://wa.me/"+n+"?text="+encodeURIComponent(INV+" "+base()),"_blank")}
 if(t=e.target.closest("[data-sms]"))return void(location.href="sms:"+phone[+t.dataset.sms].t+"?body="+encodeURIComponent(INV+" "+base()));
 if(t=e.target.closest("[data-ok]")){var r=reqs.splice(+t.dataset.ok,1)[0];friends.unshift({n:r.n,on:1,last:"Vous êtes maintenant amis",h:"Maintenant",u:0});return render()}
 if(t=e.target.closest(".row[data-i]"))openChat(+t.dataset.i);
};
function norm(t){var n=String(t).replace(/\D/g,"");if(n.indexOf("00")===0)n=n.slice(2);if(n.length===10&&n[0]==="0")n="225"+n;return n}
function waLink(n,txt){return"https://wa.me/"+(n?norm(n):"")+"?text="+encodeURIComponent(txt)}
$("inv").onclick=function(){$("sx").classList.add("open")};
$("sx").onclick=function(e){if(e.target===this||e.target.id==="sclose")this.classList.remove("open")};
$("s-wa").onclick=function(){window.open(waLink("",INV+" "+base()),"_blank")};
$("s-sms").onclick=function(){location.href="sms:?body="+encodeURIComponent(INV+" "+base())};
$("s-cp").onclick=function(){try{navigator.clipboard.writeText(INV+" "+base());toast("Lien copié")}catch(e){prompt("Copie ce lien",base())}};
$("s-sh").onclick=function(){if(navigator.share)navigator.share({title:"BOUBA STORE",text:INV,url:base()}).catch(function(){});else toast("Utilise WhatsApp ou Copier le lien")};
$("s-add").onclick=function(){
 var v=$("snum").value.trim(),nm=$("snom").value.trim();
 if(norm(v).length<9)return toast("Entre un numéro valide");
 phone.unshift({n:nm||v,t:v});try{localStorage.setItem("ph",JSON.stringify(phone))}catch(e){}
 window.open(waLink(v,INV+" "+base()),"_blank");
 $("snum").value="";$("snom").value="";$("sx").classList.remove("open");render();toast("Ami ajouté dans Répertoire");
};

/* ---------- chat ---------- */
function add(t,x,a){var m={id:++mid,t:t,x:x,a:a,h:now()};hist[cur].push(m);
 var f=friends[cur];f.last=(t==="me"?"Toi : ":"")+(a?"🎤 Message vocal ("+fmt(a.d)+")":x);f.h=m.h;draw()}
function openChat(i){
 cur=i;var f=friends[i];f.u=0;
 $("cav").textContent=ini(f.n);$("cn").textContent=f.n;
 $("chat").classList.add("open");
 if(!hist[i])hist[i]=[{id:++mid,t:"th",x:f.last,h:f.h}];
 draw();
}
function bub(m){
 var c="b "+m.t+(sel[m.id]?" sel":""),x;
 if(m.a){var on=pl&&pl.id===m.id&&!pl.au.paused;
  x='<div class="vo"><button class="pl" aria-label="Lire">'+(on?"❚❚":"▶")+'</button><div class="wv" data-w="'+m.id+'">'+m.a.p.map(function(v){return'<i style="height:'+Math.round(v*100)+'%"></i>'}).join("")+'</div><span>'+fmt(m.a.d)+'</span></div>'}
 else x=esc(m.x);
 return'<div class="'+c+'" data-id="'+m.id+'">'+x+'<small>'+m.h+(m.t==="me"?" ✓✓":"")+'</small></div>'
}
function draw(){
 $("msgs").innerHTML='<div class="sys">⚡ Turbo auto : qualité et vitesse réglées pour toi</div>'+hist[cur].map(bub).join("");
 $("msgs").scrollTop=1e9;
}
function play(id){
 var m=hist[cur].find(function(x){return x.id===id});
 if(pl&&pl.id!==id){pl.au.pause()}
 if(!pl||pl.id!==id){var au=new Audio(m.a.url);pl={id:id,au:au};
  au.ontimeupdate=function(){var w=document.querySelector('[data-w="'+id+'"]');if(!w)return;var k=Math.floor(au.currentTime/m.a.d*w.children.length);[].forEach.call(w.children,function(c,i){c.classList.toggle("on",i<k)})};
  au.onended=function(){pl=null;draw()}}
 if(pl.au.paused)pl.au.play();else pl.au.pause();
 draw();
}
function updSel(){var n=Object.keys(sel).length;$("selc").textContent=n+" sélectionné(s)";$("hdr").classList.toggle("selmode",n>0)}
function tog(id){if(sel[id])delete sel[id];else sel[id]=1;updSel();draw()}
var M=$("msgs");
M.addEventListener("pointerdown",function(e){var b=e.target.closest(".b");if(!b)return;lp=setTimeout(function(){lpf=true;tog(+b.dataset.id);if(navigator.vibrate)navigator.vibrate(20)},500)});
["pointerup","pointercancel","scroll"].forEach(function(ev){M.addEventListener(ev,function(){clearTimeout(lp)})});
M.addEventListener("contextmenu",function(e){e.preventDefault()});
M.onclick=function(e){
 if(lpf){lpf=false;return}
 var b=e.target.closest(".b");if(!b)return;var id=+b.dataset.id;
 if(Object.keys(sel).length)return tog(id);
 if(e.target.closest(".pl"))play(id);
};
$("del").onclick=function(){
 hist[cur]=hist[cur].filter(function(m){if(sel[m.id]){if(pl&&pl.id===m.id){pl.au.pause();pl=null}return false}return true});
 sel={};updSel();var l=hist[cur][hist[cur].length-1];friends[cur].last=l?(l.a?"🎤 Message vocal":l.x):"";draw();
};
$("unsel").onclick=function(){sel={};updSel();draw()};
$("back").onclick=function(){$("chat").classList.remove("open");sel={};updSel();if(pl){pl.au.pause();pl=null}render()};
function sendTxt(){var v=$("txt").value.trim();if(!v)return;$("txt").value="";add("me",v)}
$("send").onclick=sendTxt;
$("txt").onkeydown=function(e){if(e.key==="Enter")sendTxt()};
$("file").onchange=function(){if(this.files[0])add("me","📎 "+this.files[0].name);this.value=""};

/* ---------- vocal : maintenir pour enregistrer ---------- */
function drawLive(pk){var c=$("wave"),w=c.clientWidth||160,h=32;if(c.width!==w)c.width=w;c.height=h;var x=c.getContext("2d");x.clearRect(0,0,w,h);x.fillStyle="#ffd600";pk.slice(-Math.floor(w/5)).forEach(function(v,i){var bh=Math.max(3,v*h);x.fillRect(i*5,(h-bh)/2,3,bh)})}
async function recStart(e){
 e.preventDefault();hold=true;x0=e.clientX;
 try{$("mic").setPointerCapture(e.pointerId)}catch(_){}
 var st;
 try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(err){hold=false;toast("Autorise le micro pour enregistrer");return}
 if(!hold){st.getTracks().forEach(function(t){t.stop()});return}
 var mt=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(function(m){return window.MediaRecorder&&MediaRecorder.isTypeSupported(m)})||"";
 var mr=new MediaRecorder(st,mt?{mimeType:mt}:{}),ch=[],pk=[];
 mr.ondataavailable=function(ev){if(ev.data.size)ch.push(ev.data)};
 var AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),an=ac.createAnalyser();an.fftSize=256;ac.createMediaStreamSource(st).connect(an);
 var buf=new Uint8Array(an.fftSize),t0=Date.now();
 var iv=setInterval(function(){an.getByteTimeDomainData(buf);var m=0;for(var i=0;i<buf.length;i++)m=Math.max(m,Math.abs(buf[i]-128));pk.push(Math.min(1,m/80));$("rt").textContent=fmt((Date.now()-t0)/1000);drawLive(pk)},100);
 R={mr:mr,st:st,ch:ch,pk:pk,iv:iv,ac:ac,t0:t0,mt:mt};
 mr.start();$("bar").classList.add("rec");
 if(navigator.vibrate)navigator.vibrate(30);
}
function recStop(cancel){
 var r=R;R=null;clearInterval(r.iv);$("bar").classList.remove("rec");
 var d=(Date.now()-r.t0)/1000;
 r.mr.onstop=function(){
  r.st.getTracks().forEach(function(t){t.stop()});try{r.ac.close()}catch(e){}
  if(cancel)return toast("Vocal annulé");
  if(d<1)return toast("Maintiens le bouton pour enregistrer");
  var p=[],n=28;
  for(var i=0;i<n;i++){var s=Math.floor(i*r.pk.length/n),en=Math.max(s+1,Math.floor((i+1)*r.pk.length/n)),mx=0;for(var j=s;j<en&&j<r.pk.length;j++)mx=Math.max(mx,r.pk[j]);p.push(Math.max(.12,mx))}
  add("me","",{url:URL.createObjectURL(new Blob(r.ch,{type:r.mt||"audio/webm"})),p:p,d:d});
 };
 try{r.mr.stop()}catch(e){}
}
function recEnd(e){hold=false;if(R)recStop(x0-e.clientX>90)}
var mic=$("mic");
mic.addEventListener("pointerdown",recStart);
mic.addEventListener("pointerup",recEnd);
mic.addEventListener("pointercancel",recEnd);
mic.addEventListener("contextmenu",function(e){e.preventDefault()});

/* ---------- appels : vraie caméra / micro du téléphone ---------- */
async function startCall(v){
 var f=friends[cur];$("cname").textContent=f.n;$("cav2").textContent=ini(f.n);
 var c=$("call");c.classList.add("open");c.classList.toggle("vid",v);$("cst").textContent="Connexion…";
 try{call={v:v,face:"user",t0:Date.now(),st:await navigator.mediaDevices.getUserMedia(v?{video:{facingMode:"user"},audio:true}:{audio:true})}}
 catch(e){c.classList.remove("open");toast(v?"Autorise la caméra et le micro":"Autorise le micro");return}
 $("lv").srcObject=call.st;$("lv").style.transform="scaleX(-1)";
 $("cst").textContent=(v?"Caméra active · ":"Appel · ")+"0:00";
 call.iv=setInterval(function(){$("cst").textContent=(v?"Caméra active · ":"Appel · ")+fmt((Date.now()-call.t0)/1000)},1000);
}
$("cv").onclick=function(){startCall(false)};
$("cvid").onclick=function(){startCall(true)};
$("end").onclick=function(){
 if(!call)return $("call").classList.remove("open");
 clearInterval(call.iv);call.st.getTracks().forEach(function(t){t.stop()});
 var d=(Date.now()-call.t0)/1000,v=call.v;call=null;$("lv").srcObject=null;$("call").classList.remove("open");
 add("me",(v?"🎥 Appel vidéo":"📞 Appel vocal")+" · "+fmt(d));
};
$("mute").onclick=function(){if(!call)return;var t=call.st.getAudioTracks()[0];if(t){t.enabled=!t.enabled;this.textContent=t.enabled?"🎙":"🔇"}};
$("flip").onclick=async function(){
 if(!call||!call.v)return;
 call.face=call.face==="user"?"environment":"user";call.st.getTracks().forEach(function(t){t.stop()});
 try{call.st=await navigator.mediaDevices.getUserMedia({video:{facingMode:call.face},audio:true});$("lv").srcObject=call.st;$("lv").style.transform=call.face==="user"?"scaleX(-1)":"none"}
 catch(e){toast("Caméra indisponible")}
};
$("q-wa").onclick=function(){$("s-wa").onclick()};
$("q-sms").onclick=function(){$("s-sms").onclick()};
$("q-sh").onclick=function(){$("s-sh").onclick()};
render();
