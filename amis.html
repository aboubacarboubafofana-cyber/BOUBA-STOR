#iv{position:fixed;inset:0;background:#000e;z-index:95;display:none;align-items:center;justify-content:center}

#toast.on{opacity:1}
</style>

<script>
/* ===== À REMPLIR : copie ici FB_CFG depuis ton index.html (la même configuration Firebase) ===== */
window.FB_CFG = window.FB_CFG || {
  apiKey:"", authDomain:"", databaseURL:"", projectId:"", appId:""

</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getDatabase,ref,get,set,update,remove,push,onValue,onChildAdded,query,limitToLast} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js';
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';

const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=s=>{const n=String(s||'').replace(/\D/g,'');return n.length>=10?'u'+n.slice(-10):''};
const ph=k=>k.slice(1);
const U=u=>/^data:(image|audio|video|application|text)\/[\w.+-]+(;[\w=.+-]+)*;base64,[A-Za-z0-9+\/=]+$/.test(u||'')?u:'';
const ini=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const fmt=s=>Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2);
const hhmm=t=>{const d=new Date(t||0);return d.getHours()+':'+('0'+d.getMinutes()).slice(-2)};
const day=t=>{const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return hhmm(t);const y=new Date(n-864e5);return d.toDateString()===y.toDateString()?'Hier':('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)};
let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)};
const base=()=>location.href.split('#')[0].split('?')[0].replace(/amis\.html$/,'');
const INV='Rejoins-moi sur BOUBA STORE :';
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};

if(!FB_CFG.apiKey){document.body.innerHTML='<p style="padding:30px;color:#ffd600">Configuration Firebase manquante : colle FB_CFG en haut de amis.html.</p>';throw 0}
const app=initializeApp(FB_CFG,'amis2'),db=getDatabase(app),au=getAuth(app),R=p=>ref(db,p);

let me=null,fr={},rq={},P={},REG={},L={},W={},tab='amis',cur=null,dir=[],unMsg=null,MSG={},sel={},lastRaw=[];
let rd={};try{rd=JSON.parse(localStorage.bb_read||'{}');dir=JSON.parse(localStorage.bb_dir||'[]')}catch(e){}
const online=k=>Date.now()-((P[k]||{}).seen||0)<70000;
const nm=k=>(fr[k]&&fr[k].name)||(P[k]&&P[k].name)||(rq[k]&&rq[k].name)||ph(k);
function av(k,size,dot){
 const p=P[k]&&U(P[k].photo);
 return '<div class="av'+(dot&&online(k)?' on':'')+'">'+(p?'<img src="'+p+'" alt="">':esc(ini(nm(k))))+'</div>';
}
function prof(k){ if(W[k]||REG[k]!==undefined)return;
 REG[k]=false;get(R('profiles/'+k)).then(s=>{REG[k]=s.exists();P[k]=s.val()||P[k]||{};render()}).catch(()=>{});
}
function watch(k){ if(W[k])return;W[k]=1;REG[k]=true;
 onValue(R('profiles/'+k),s=>{P[k]=s.val()||{};render();if(cur===k)head()});
 onValue(query(R('chats/'+me.k+'/'+k),limitToLast(1)),s=>{let m=null;s.forEach(c=>{m=c.val()});L[k]=m;render()});
}

/* ---------- connexion ---------- */
onAuthStateChanged(au,u=>{
 let m=null;try{m=JSON.parse(localStorage.bb_me||'null')}catch(e){}
 if(u&&m){me=m;start()}else $('login').style.display='flex';
});
$('lg').onclick=async()=>{
 const name=$('ln').value.trim(),k=K($('lp').value),pw=$('lw').value;
 if(!name||!k)return $('le').textContent='Entre ton nom et un numéro valide.';
 if(pw.length<6)return $('le').textContent='Mot de passe : 6 caractères minimum.';
 $('le').textContent='Connexion…';const email=k+'@bouba.app';
 try{try{await signInWithEmailAndPassword(au,email,pw)}catch(e){await createUserWithEmailAndPassword(au,email,pw)}
  await update(R('profiles/'+k),{name,phone:ph(k),seen:Date.now()});
  localStorage.bb_me=JSON.stringify({k,name});me={k,name};$('login').style.display='none';start();
 }catch(e){$('le').textContent='Impossible de se connecter. Vérifie ton mot de passe.'}
};
let started=0;
function start(){
 if(started)return;started=1;watch(me.k);
 onValue(R('friends/'+me.k),s=>{fr=s.val()||{};Object.keys(fr).forEach(watch);render()});
 onValue(R('requests/'+me.k),s=>{rq=s.val()||{};Object.keys(rq).forEach(prof);render()});
 onValue(R('incoming/'+me.k),s=>{const v=s.val();if(v&&Date.now()-v.t<60000&&!pc)ring(v)});
 const beat=()=>update(R('profiles/'+me.k),{seen:Date.now()}).catch(()=>{});beat();setInterval(beat,30000);setInterval(render,60000);
 render();
}

/* ---------- liste ---------- */
function render(){
 if(!me)return;
 const q=$('q').value.toLowerCase(),n=Object.keys(rq).length;let h='';
 $('tdem').textContent='🔔 Demandes'+(n?' ('+n+')':'');
 $('me').innerHTML=av(me.k).replace('class="av"','class="av" style="width:100%;height:100%"');
 if(tab==='dem'){
  h=Object.keys(rq).map(k=>'<div class="row">'+av(k)+'<div class="mid"><b>'+esc(nm(k))+'</b><span>Veut devenir ton ami</span></div><button class="tab on small" data-ok="'+k+'">Accepter</button><button class="tab small" data-no="'+k+'">Refuser</button></div>').join('')||'<div class="empty">Aucune demande en attente.</div>';
 }else if(tab==='rep'){
  h='<button class="invite" id="pick" style="margin-top:4px">📲 Choisir dans les contacts du téléphone</button>';
  h+=dir.filter(x=>(x.n+x.k).toLowerCase().indexOf(q)>-1).map((x,i)=>{
   const a=fr[x.k]?'<span class="meta">✅ ami</span>':REG[x.k]?'<button class="tab on small" data-add="'+x.k+'">Ajouter</button>':'<button class="tab small wa" data-inv="'+x.k+'">Inviter</button>';
   return '<div class="row">'+av(x.k)+'<div class="mid"><b>'+esc(x.n)+'</b><span>'+ph(x.k)+(REG[x.k]?' · sur BOUBA STORE':'')+'</span></div>'+a+'</div>'}).join('');
  dir.forEach(x=>prof(x.k));
 }else{
  const ks=Object.keys(fr).filter(k=>nm(k).toLowerCase().indexOf(q)>-1).sort((a,b)=>((L[b]||{}).t||0)-((L[a]||{}).t||0));
  h=ks.map(k=>{const m=L[k],un=m&&m.from!==me.k&&m.t>(rd[k]||0);
   const pv=!m?'Dis bonjour 👋':(m.from===me.k?'Toi : ':'')+(m.type==='audio'?'🎤 Message vocal':m.type==='image'?'🖼️ Photo':m.type==='video'?'🎞️ Vidéo':m.type==='file'?'📎 Fichier':esc(m.text));
   return '<button class="row" data-i="'+k+'">'+av(k,0,1)+'<div class="mid"><b>'+esc(nm(k))+'</b><span>'+pv+'</span></div><div class="meta">'+(m?day(m.t):'')+(un?'<br><span class="badge">1</span>':'')+'</div></button>'}).join('')
   ||'<div class="empty">Aucun ami pour l\'instant. Invite quelqu\'un ou ouvre l\'onglet Répertoire.</div>';
 }
 $('list').innerHTML=h;
}
$('tabs').onclick=e=>{const t=e.target.closest('.tab');if(!t)return;tab=t.dataset.t;[].forEach.call(document.querySelectorAll('#tabs .tab'),x=>x.classList.toggle('on',x===t));render()};
$('q').oninput=render;
$('list').onclick=async e=>{let t;
 if(e.target.closest('#pick'))return pick();
 if(t=e.target.closest('[data-i]'))return openChat(t.dataset.i);
 if(t=e.target.closest('[data-add]'))return addFriend(t.dataset.add);
 if(t=e.target.closest('[data-inv]'))return void window.open('https://wa.me/225'+ph(t.dataset.inv)+'?text='+encodeURIComponent(INV+' '+base()),'_blank');
 if(t=e.target.closest('[data-ok]')){const k=t.dataset.ok,u={};
  u['friends/'+me.k+'/'+k]={name:nm(k)};u['friends/'+k+'/'+me.k]={name:me.name};u['requests/'+me.k+'/'+k]=null;
  try{await update(ref(db),u);toast('✅ Ami ajouté')}catch(x){toast('Erreur')}return}
 if(t=e.target.closest('[data-no]'))remove(R('requests/'+me.k+'/'+t.dataset.no)).catch(()=>{});
};
async function pick(){
 if(!(navigator.contacts&&navigator.contacts.select))return toast('Ouvre l\'app dans Chrome sur Android pour accéder aux contacts.');
 try{const c=await navigator.contacts.select(['name','tel'],{multiple:true});
  c.forEach(x=>(x.tel||[]).forEach(t=>{const k=K(t);if(k&&k!==me.k&&!dir.some(d=>d.k===k))dir.push({n:(x.name&&x.name[0])||ph(k),k})}));
  dir.sort((a,b)=>a.n.localeCompare(b.n));try{localStorage.bb_dir=JSON.stringify(dir)}catch(e){}render();
 }catch(e){}
}
async function addFriend(k){
 if(k===me.k)return toast('C\'est ton numéro');
 try{if(!(await get(R('profiles/'+k))).exists())return false;
  await set(R('requests/'+k+'/'+me.k),{name:me.name,t:Date.now()});toast('✅ Demande envoyée');return true}
 catch(e){toast('Demande impossible')}
}

/* ---------- invitations ---------- */
const txt=()=>INV+' '+base();
function share(s){
 if(s==='wa')window.open('https://wa.me/?text='+encodeURIComponent(txt()),'_blank');
 else if(s==='sms')location.href='sms:?body='+encodeURIComponent(txt());
 else if(s==='cp'){try{navigator.clipboard.writeText(txt());toast('Lien copié')}catch(e){prompt('Copie ce lien',base())}}
 else if(navigator.share)navigator.share({title:'BOUBA STORE',text:INV,url:base()}).catch(()=>{});else toast('Utilise WhatsApp ou Copier le lien');
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-s]');if(t)share(t.dataset.s)});
$('inv').onclick=()=>$('sx').classList.add('open');
$('sx').onclick=e=>{if(e.target===$('sx')||e.target.id==='sclose')$('sx').classList.remove('open')};
$('sadd').onclick=async()=>{
 const k=K($('snum').value);if(!k)return toast('Entre un numéro valide');
 if(await addFriend(k)===false){window.open('https://wa.me/225'+ph(k)+'?text='+encodeURIComponent(txt()),'_blank');toast('Pas encore inscrit : invitation WhatsApp')}
 $('snum').value='';$('sx').classList.remove('open');
};

/* ---------- photo de profil ---------- */
function resize(file,max,cb){const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};i.onerror=()=>toast('Image illisible');i.src=e.target.result};r.readAsDataURL(file)}
$('me').onclick=()=>$('pf').click();
$('pf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 resize(f,256,d=>set(R('profiles/'+me.k+'/photo'),d).then(()=>toast('✅ Photo mise à jour')).catch(()=>toast('Échec : vérifie les règles Firebase')))};

/* ---------- chat ---------- */
function head(){
 $('cav').outerHTML=av(cur,0,1).replace('class="av','id="cav" class="av');
 $('cn').textContent=nm(cur);$('cs').textContent=online(cur)?'en ligne':'hors ligne';
}
function openChat(k){
 cur=k;rd[k]=Date.now();try{localStorage.bb_read=JSON.stringify(rd)}catch(e){}
 sel={};updSel();head();$('chat').classList.add('open');$('msgs').innerHTML='';
 if(unMsg)unMsg();
 unMsg=onValue(query(R('chats/'+me.k+'/'+k),limitToLast(60)),s=>{
  const a=[];s.forEach(c=>{a.push(Object.assign({id:c.key},c.val()))});a.sort((x,y)=>x.t-y.t);lastRaw=a;a.forEach(m=>MSG[m.id]=m);
  rd[k]=Date.now();draw();
 });
}
function bub(m){
 const mine=m.from===me.k,u=U(m.media);let c;
 if(m.type==='audio'&&u)c='<div class="vo"><button class="pl" data-a="'+m.id+'" aria-label="Lire">▶</button><div class="pb" data-p="'+m.id+'"><i></i></div><span>'+fmt(m.dur||0)+'</span></div>';
 else if(m.type==='image'&&u)c='<img src="'+u+'" data-v="1" alt="Photo">';
 else if(m.type==='video'&&u)c='<video controls preload="metadata" playsinline src="'+u+'"></video>';
 else if(m.type==='file'&&u)c='<a download="'+esc(m.name||'fichier')+'" href="'+u+'">📎 '+esc(m.name||'fichier')+'</a>';
 else c=esc(m.text);
 return '<div class="b '+(mine?'me':'th')+(sel[m.id]?' sel':'')+'" data-id="'+m.id+'">'+c+'<small>'+hhmm(m.t)+(mine?' ✓✓':'')+'</small></div>';
}
function draw(){const c=$('msgs'),keep=c.scrollHeight-c.scrollTop-c.clientHeight<140||!c.innerHTML;
 c.innerHTML='<div class="sys">⚡ Messages en direct, appels voix et vidéo gratuits</div>'+lastRaw.map(bub).join('');
 if(keep)c.scrollTop=c.scrollHeight}
async function sendMsg(m){
 if(!cur)return false;const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5),full=Object.assign({from:me.k,text:'',t:Date.now()},m),u={};
 u['chats/'+me.k+'/'+cur+'/'+id]=full;u['chats/'+cur+'/'+me.k+'/'+id]=full;
 try{await update(ref(db),u);return true}catch(e){toast('Envoi impossible (fichier trop lourd ?)');return false}
}
async function sendTxt(){const i=$('txt'),v=i.value.trim();if(!v)return;i.value='';if(!(await sendMsg({type:'text',text:v.slice(0,1000)})))i.value=v}
$('send').onclick=sendTxt;$('txt').onkeydown=e=>{if(e.key==='Enter')sendTxt()};
$('back').onclick=()=>{$('chat').classList.remove('open');if(unMsg){unMsg();unMsg=null}stopPl();cur=null;render()};
const toData=(b,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(b)};
$('file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 if(f.type.indexOf('image/')===0){toast('Envoi de la photo…');return resize(f,1000,d=>sendMsg({type:'image',text:'🖼️ Photo',media:d}))}
 if(f.size>2.5*1048576)return toast('Fichier trop lourd (max 2,5 Mo)');
 toast('Envoi…');toData(f,d=>sendMsg({type:f.type.indexOf('video/')===0?'video':'file',text:'📎 '+f.name.slice(0,80),name:f.name.slice(0,80),media:d}))};
/* lecture vocale + aperçu + sélection */
let pl=null;
function stopPl(){if(pl){pl.au.pause();pl=null}}
function play(id){
 const m=MSG[id];if(!m)return;
 if(pl&&pl.id===id){pl.au.paused?pl.au.play():pl.au.pause();return}
 stopPl();const au=new Audio(U(m.media));pl={id,au};
 au.ontimeupdate=()=>{const b=document.querySelector('[data-p="'+id+'"] i');if(b&&au.duration)b.style.width=(au.currentTime/au.duration*100)+'%'};
 au.onended=()=>{pl=null;draw()};au.play().catch(()=>toast('Lecture impossible'));
}
const M=$('msgs');let lp=0,lpf=0;
function updSel(){const n=Object.keys(sel).length;$('selc').textContent=n+' sélectionné(s)';$('hdr').classList.toggle('selmode',n>0)}
function tog(id){sel[id]?delete sel[id]:sel[id]=1;updSel();draw()}
M.addEventListener('pointerdown',e=>{const b=e.target.closest('.b');if(!b)return;lp=setTimeout(()=>{lpf=1;tog(b.dataset.id);if(navigator.vibrate)navigator.vibrate(20)},500)});
['pointerup','pointercancel','scroll'].forEach(v=>M.addEventListener(v,()=>clearTimeout(lp)));
M.addEventListener('contextmenu',e=>e.preventDefault());
M.onclick=e=>{
 if(lpf){lpf=0;return}
 const b=e.target.closest('.b');if(!b)return;
 if(Object.keys(sel).length)return tog(b.dataset.id);
 if(e.target.closest('.pl'))return play(b.dataset.id);
 if(e.target.dataset.v){$('ivi').src=e.target.src;$('iv').classList.add('on')}
};
$('iv').onclick=()=>$('iv').classList.remove('on');
$('unsel').onclick=()=>{sel={};updSel();draw()};
$('del').onclick=async()=>{const u={};Object.keys(sel).forEach(id=>{u['chats/'+me.k+'/'+cur+'/'+id]=null;u['chats/'+cur+'/'+me.k+'/'+id]=null});
 sel={};updSel();try{await update(ref(db),u)}catch(e){toast('Suppression impossible')}};
/* enregistrement vocal */
let rec=null,rch=[],rt0=0,rtm=0,rstream=null;
function recEnd(){clearInterval(rtm);if(rstream){rstream.getTracks().forEach(t=>t.stop());rstream=null}$('bar').classList.remove('rec')}
$('mic').onclick=async()=>{
 if(rec||!cur)return;
 try{rstream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  rec=new MediaRecorder(rstream,mt?{mimeType:mt,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});
  rch=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)rch.push(e.data)};rec.start();rt0=Date.now();
  $('bar').classList.add('rec');$('rt').textContent='0:00';
  rtm=setInterval(()=>{const s=Math.floor((Date.now()-rt0)/1000);$('rt').textContent=fmt(s);if(s>=120)$('rs').click()},500);
 }catch(e){rec=null;recEnd();toast('Autorise le micro pour enregistrer')}
};
$('rc').onclick=()=>{if(rec){rec.onstop=null;try{rec.stop()}catch(e){}}rec=null;recEnd()};
$('rs').onclick=()=>{if(!rec)return;const r=rec,dur=Math.round((Date.now()-rt0)/1000);rec=null;
 r.onstop=()=>{const b=new Blob(rch,{type:r.mimeType||'audio/webm'});recEnd();if(dur<1)return toast('Message trop court');toData(b,d=>sendMsg({type:'audio',text:'🎤 Message vocal',media:d,dur}))};
 try{r.stop()}catch(e){recEnd()}};

/* ---------- appels voix / vidéo ---------- */
let pc=null,ms=null,cid='',role='',cOff=[],pend=[],inc=null,peerK='',ringT=0;
function showCall(k,txt,ringing,video){
 $('call').classList.add('open');$('cname').textContent=nm(k);$('cst').textContent=txt;
 $('cav2').outerHTML=av(k).replace('class="av"','id="cav2" class="av"');
 $('acc').style.display=ringing?'':'none';$('lv').style.display=video&&!ringing?'block':'none';
}
async function media(video){ms=await navigator.mediaDevices.getUserMedia({audio:true,video:!!video});$('lv').srcObject=ms}
function mkpc(){
 pc=new RTCPeerConnection(ICE);pend=[];ms.getTracks().forEach(t=>pc.addTrack(t,ms));
 pc.ontrack=e=>{$('rv').srcObject=e.streams[0]};
 pc.onicecandidate=e=>{if(e.candidate)push(R('calls/'+cid+'/ice_'+role),e.candidate.toJSON())};
 pc.onconnectionstatechange=()=>{if(!pc)return;if(pc.connectionState==='connected'){clearTimeout(ringT);$('cst').textContent='🟢 En communication'}
  if(pc.connectionState==='failed'||pc.connectionState==='closed')endCall(false)};
}
function listen(other){
 cOff.push(onChildAdded(R('calls/'+cid+'/ice_'+other),s=>{if(!pc)return;pc.remoteDescription?pc.addIceCandidate(s.val()).catch(()=>{}):pend.push(s.val())}));
 cOff.push(onValue(R('calls/'+cid+'/end'),s=>{if(s.val())endCall(false)}));
}
async function flush(){for(const c of pend)await pc.addIceCandidate(c).catch(()=>{});pend=[]}
async function startCall(video){
 if(pc||!cur)return;const callee=cur;peerK=callee;
 try{await media(video);cid='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);role='a';mkpc();
  const o=await pc.createOffer();await pc.setLocalDescription(o);
  await set(R('calls/'+cid),{caller:me.k,callee,video:!!video,offer:{type:o.type,sdp:o.sdp},t:Date.now()});
  await set(R('incoming/'+callee),{from:me.k,name:me.name,id:cid,video:!!video,t:Date.now()});
  showCall(callee,'Appel en cours…',false,video);
  cOff.push(onValue(R('calls/'+cid+'/answer'),async s=>{const a=s.val();if(a&&pc&&!pc.currentRemoteDescription){await pc.setRemoteDescription(a);flush()}}));
  listen('b');ringT=setTimeout(()=>{toast('Pas de réponse');endCall(true)},45000);
 }catch(e){toast('Appel impossible : micro/caméra refusé ?');endCall(false)}
}
function ring(v){inc=v;peerK=v.from;P[v.from]=P[v.from]||{name:v.name};showCall(v.from,v.video?'Appel vidéo entrant…':'Appel vocal entrant…',true,false)}
$('acc').onclick=async()=>{
 if(!inc)return;const v=inc;inc=null;cid=v.id;role='b';
 try{await media(v.video);mkpc();const c=(await get(R('calls/'+cid))).val();if(!c||c.end)throw 0;
  await pc.setRemoteDescription(c.offer);await flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);
  await set(R('calls/'+cid+'/answer'),{type:a.type,sdp:a.sdp});remove(R('incoming/'+me.k));
  $('acc').style.display='none';$('lv').style.display=v.video?'block':'none';$('cst').textContent='Connexion…';listen('a');
 }catch(e){toast('Appel terminé');endCall(true)}
};
function endCall(send){
 clearTimeout(ringT);
 if(send&&cid)set(R('calls/'+cid+'/end'),1).catch(()=>{});
 if(inc||role==='a')remove(R('incoming/'+(role==='a'?peerK:me.k))).catch(()=>{});
 cOff.forEach(f=>{try{f()}catch(e){}});cOff=[];
 if(pc){try{pc.close()}catch(e){}pc=null}
 if(ms){ms.getTracks().forEach(t=>t.stop());ms=null}
 inc=null;cid='';role='';$('rv').srcObject=null;$('call').classList.remove('open');
}
$('end').onclick=()=>endCall(true);
$('mute').onclick=()=>{if(!ms)return;const t=ms.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mute').textContent=t.enabled?'🎙':'🔇'}};
$('cv').onclick=()=>startCall(false);
$('cvid').onclick=()=>startCall(true);

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
