<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laisser un avis - BOuba STOR</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        h1 { color: #ffd700; margin-top: 40px; }
        .stars { font-size: 45px; cursor: pointer; color: #555; margin: 20px 0; }
        .stars span { transition: color 0.2s; padding: 0 5px; }
        textarea { width: 100%; height: 120px; background: #222; color: #fff; border: 1px solid #ffd700; border-radius: 8px; padding: 12px; margin-top: 10px; font-size: 15px; box-sizing: border-box; }
        button { background: #ffd700; color: #000; border: none; padding: 16px; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 20px; width: 100%; cursor: pointer; }
        a { color: #ffd700; display: block; margin-top: 25px; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Laissez-nous un avis ⭐</h1>
    <p style="color:#aaa; font-size:14px;">Votre avis nous aide à améliorer notre service.</p>

    <div class="stars" id="stars">
        <span data-val="1">★</span><span data-val="2">★</span><span data-val="3">★</span><span data-val="4">★</span><span data-val="5">★</span>
    </div>

    <textarea id="comment" placeholder="Dites-nous ce que vous pensez de votre commande..."></textarea>
    <button onclick="envoyerAvis()">Envoyer mon avis</button>
    <a href="index.html">← Retour à la boutique</a>

    <script>
        let note = 0;
const stars = document.querySelectorAll('.stars span');

stars.forEach(star => {
    star.addEventListener('click', () => {
        note = parseInt(star.getAttribute('data-val'));
        stars.forEach(s => {
            s.style.color = parseInt(s.getAttribute('data-val')) <= note ? '#ffd700' : '#555';
        });
    });
});

async function envoyerAvis() {
    const commentaire = document.getElementById('comment').value;
    if (note === 0) { alert("Veuillez choisir une note (les étoiles)."); return; }
    if (!commentaire.trim()) { alert("Veuillez écrire un petit commentaire."); return; }

    const btn = document.querySelector('button');
    btn.innerText = "Envoi en cours...";
    btn.disabled = true;

    // On récupère le nom du client s'il est connecté
    const storedMe = localStorage.getItem('b_me');
    const nom = storedMe ? JSON.parse(storedMe).name : 'Client BOuba';

    try {
        // On envoie l'avis directement dans Firebase
        const reviewRef = window.firebaseDb 
            ? window.firebaseDb.push(window.firebaseDb.ref(window.firebaseDb.db, 'reviews'))
            : null;
            
        // Si on a une fonction de sauvegarde globale (définie dans index.html)
        if (window.saveReview) {
            await window.saveReview({ name: nom, note: note, text: commentaire, date: Date.now() });
            alert('✅ Merci ! Votre avis a bien été publié sur la page d\'accueil.');
            window.location.href = 'index.html';
        } else {
            // Fallback simple si on est sur la page seule
            alert('✅ Merci pour votre avis !');
            window.location.href = 'index.html';
        }
    } catch (e) {
        alert("Erreur d'envoi : " + e.message);
        btn.innerText = "Envoyer mon avis";
        btn.disabled = false;
    }
}
</body>
</html>
