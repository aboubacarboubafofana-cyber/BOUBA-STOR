<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Arial;overflow:hidden}
#remoteVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#localVideo{position:absolute;top:14px;right:14px;width:90px;height:130px;object-fit:cover;border-radius:14px;border:2px solid gold;background:#222;z-index:2;transition:all .3s}
#statusBox{position:absolute;top:28%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);backdrop-filter:blur(10px);border:1px solid #222;border-radius:16px;padding:14px 20px;text-align:center;z-index:3;min-width:220px}
#statusBox h3{color:gold;font-size:16px;margin:0 0 4px}
#statusBox p{color:#aaa;font-size:12px;margin:0}
.bar{position:absolute;bottom:30px;left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:4}
.bar button{width:56px;height:56px;border-radius:50%;border:0;font-size:20px;display:flex;align-items:center;justify-content:center}
#muteBtn{background:#222;color:gold;border:1px solid #333}
#muteBtn.off{background:#444;color:#888}
#hangupBtn{background:#e53935;color:#fff;box-shadow:0 4px 20px rgba(229,57,53,.4)}
#switchBtn{background:#222;color:#fff;border:1px solid #333}
#permBox{position:absolute;inset:0;background:rgba(0,0,0,.9);z-index:10;display:none;align-items:center;justify-content:center;flex-direction:column;padding:30px;text-align:center}
#permBox h2{color:gold;margin-bottom:12px}
#permBox p{color:#aaa;font-size:13px;margin-bottom:16px;line-height:1.5}
#permBox button{background:gold;color:#000;border:0;border-radius:12px;padding:12px 20px;font-weight:900;width:100%;max-width:300px}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

async function requestPerm(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true, video:true});
    s.getTracks().forEach(t=>t.stop());
    hidePermBox();
    location.reload();
  }catch(e){
    alert('Permission refusée. Clique sur le cadenas 🔒 en haut du navigateur pour autoriser.');
  }
}
window.requestPerm=requestPerm;

async function getMedia(video){
  try{
    // HTTPS obligatoire pour getUserMedia
    if(location.protocol!=='https:' && location.hostname!=='localhost'){
      throw new Error('HTTPS requis pour appel');
    }
    localStream=await navigator.mediaDevices.getUserMedia({audio:true, video: video?{facingMode:facing}:false});
  }catch(e){
    console.error(e);
    if(e.name==='NotAllowedError' || e.name==='PermissionDeniedError'){
      setStatus('Permission refusée','Autorise micro/caméra');
      showPermBox();
    } else if(e.name==='NotFoundError'){
      // pas de caméra, essaie audio seul
      try{
        localStream=await navigator.mediaDevices.getUserMedia({audio:true, video:false});
        setStatus('Caméra non trouvée','Appel vocal seulement');
      }catch(e2){
        setStatus('Micro non trouvé','Vérifie ton appareil');
        showPermBox();
        throw e2;
      }
    } else {
      setStatus('Erreur micro/caméra', e.message);
      showPermBox();
      throw e;
    }
    return;
  }
  $('localVideo').srcObject=localStream;
  $('localVideo').style.display= video?'block':'none';
  localStream.getTracks().forEach(t=>pc.addTrack(t, localStream));
  hidePermBox();
}

async function addCand(c){ if(pc.remoteDescription){ try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){} } else queue.push(c); }
async function flushCands(){ for(const c of queue) await addCand(c); queue=[]; }
function listenCandidates(colRef){ onSnapshot(colRef, snap=>snap.docChanges().forEach(ch=>{ if(ch.type==='added') addCand(ch.doc.data()); })); }

async function notifyCall(friendId, video, callId){
  try{
    await addDoc(collection(db,'notifications'),{toUid:friendId, title:MY_NAME, body: video?'📹 Appel vidéo entrant - Décroche !':'📞 Appel vocal entrant', tag:'bouba-call', url:'call.html?answer='+callId, type:'call', fromUid:MON_ID, fromName:MY_NAME, createdAt: serverTimestamp()});
  }catch(e){}
}

async function startCall(friendId, video){
  setStatus('Appel...','Ça sonne chez ton contact');
  await getMedia(video);
  if(!localStream) return;
  callRef=doc(collection(db,'calls'));
  const offerCands=collection(callRef,'offerCandidates');
  const answerCands=collection(callRef,'answerCandidates');
  pc.onicecandidate=e=>e.candidate&&addDoc(offerCands, e.candidate.toJSON());
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
  await setDoc(callRef,{from:MON_ID, to:friendId, fromName:MY_NAME, video, status:'ringing', createdAt:Date.now(), offer:{type:offer.type, sdp:offer.sdp}});
  notifyCall(friendId, video, callRef.id);
  onSnapshot(callRef, async snap=>{
    const d=snap.data(); if(!d) return;
    if(d.answer && !pc.remoteDescription){ await pc.setRemoteDescription(new RTCSessionDescription(d.answer)); await flushCands(); setStatus('Connecté','Appel en cours'); }
    if(d.status==='declined') end('Refusé');
    if(d.status==='ended') end('Terminé');
  });
  listenCandidates(answerCands);
  setTimeout(()=>{ if(!pc.remoteDescription) hangup('Pas de réponse'); },45000);
}

async function answerCall(callId){
  setStatus('Connexion...','Préparation');
  callRef=doc(db,'calls',callId);
  const snap=await getDoc(callRef); if(!snap.exists()) return end('Appel introuvable');
  const d=snap.data(); await getMedia(d.video); if(!localStream) return;
  const offerCands=collection(callRef,'offerCandidates');
  const answerCands=collection(callRef,'answerCandidates');
  pc.onicecandidate=e=>e.candidate&&addDoc(answerCands, e.candidate.toJSON());
  await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
  const answer=await pc.createAnswer(); await pc.setLocalDescription(answer);
  await updateDoc(callRef,{answer:{type:answer.type, sdp:answer.sdp}, status:'active'});
  listenCandidates(offerCands); await flushCands();
  onSnapshot(callRef, s=>{ if(s.data()?.status==='ended') end('Terminé'); });
}

async function hangup(msg){ try{ if(callRef) await updateDoc(callRef,{status:'ended'}); }catch(e){} end(msg); }
$('hangupBtn').onclick=()=>hangup();
$('muteBtn').onclick=e=>{
  const t=localStream&&localStream.getAudioTracks()[0]; if(!t) return;
  t.enabled=!t.enabled; e.currentTarget.classList.toggle('off', !t.enabled);
  e.currentTarget.innerHTML= t.enabled?'<i class="fas fa-microphone"></i>':'<i class="fas fa-microphone-slash"></i>';
};
$('switchBtn').onclick=async()=>{
  if(!localStream) return;
  facing = facing==='user'?'environment':'user';
  const videoTrack=localStream.getVideoTracks()[0];
  if(videoTrack) videoTrack.stop();
  try{
    const newStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});
    const newVideoTrack=newStream.getVideoTracks()[0];
    const sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video');
    if(sender) sender.replaceTrack(newVideoTrack);
    localStream.getVideoTracks().forEach(t=>localStream.removeTrack(t));
    localStream.addTrack(newVideoTrack);
    $('localVideo').srcObject=localStream;
  }catch(e){}
};

const p=new URLSearchParams(location.search);
(async()=>{
  try{
    if(p.get('call')) await startCall(p.get('call'), p.get('video')==='true');
    else if(p.get('answer')) await answerCall(p.get('answer'));
    else setStatus('Aucun appel');
  }catch(e){ console.error(e); }
})();

function stopRingtone(){ const a=document.getElementById('ringtone'); if(a){ a.pause(); a.currentTime=0; } }
window.stopRingtone=stopRingtone;
</script>

<audio id="ringtone" loop>
  <source src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_rings.ogg" type="audio/ogg">
</audio>
<script>
  const ring=document.getElementById('ringtone');
  document.addEventListener('click',()=>{ ring.play().catch(()=>{}); },{once:true});
</script>
