    --muted:#c9c2b6;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--cream);
  font-family:"Trebuchet MS", "Segoe UI", Tahoma, sans-serif
}

button,input,select,textarea{
  font:inherit
}

a{
  color:inherit
}

.display{
  font-family:Impact, "Arial Black", "Trebuchet MS", sans-serif;
  letter-spacing:.02em
}

.gold-text{
  background:linear-gradient(90deg,#fff0a8,#f7c948,#ff8a00);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.gold-border{
  border:2px solid var(--gold)
}

@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 0 0 rgba(255,140,0,.55)
  }

  50%{
    box-shadow:0 0 0 14px rgba(255,140,0,0)
  }
}

@keyframes shine{
  0%{
    transform:translateX(-140%) skewX(-18deg)
  }

  100%{
    transform:translateX(260%) skewX(-18deg)
  }
}

@keyframes blink{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }

  50%{
    transform:translateY(-7px) rotate(2deg)
  }
}

@keyframes pop{
  0%{
    transform:scale(.92)
  }

  100%{
    transform:scale(1)
  }
}

@keyframes ticker{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(-50%)
  }
}

.pulse{
  animation:pulseGlow 1.8s infinite
}

.blink{
  animation:blink 1s infinite
}

.floaty{
  animation:floaty 3s ease-in-out infinite
}

.pop{
  animation:pop .25s ease
}

.shine-wrap{
  position:relative;
  overflow:hidden
}

.shine-wrap::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:42%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shine 2.6s infinite;
  pointer-events:none
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.ticker-track{
  display:flex;
  width:-moz-max-content;
  width:max-content;
  animation:ticker 18s linear infinite
}

.wheel{
  transition:transform 2.2s cubic-bezier(.15,.9,.2,1)
}

.chat-scroll::-webkit-scrollbar{
  width:5px
}

.chat-scroll::-webkit-scrollbar-thumb{
  background:#f7c948;
  border-radius:99px
}

input:focus,select:focus,textarea:focus,button:focus-visible{
  outline:3px solid #f7c948;
  outline-offset:2px
}
