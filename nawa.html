<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAwa</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#F6F7FB;--sf:#fff;--tx:#0E1B3D;--mu:#66708C;--ac:#0E1B3D;--ac2:#F5B301;--ok:#15955B;--bd:#E2E5EF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1226;--sf:#131D38;--tx:#EEF1FA;--mu:#98A2C0;--ac:#F5B301;--ac2:#F5B301;--bd:#24304F}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Sora,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{margin:0}
.logo{font-weight:800;font-size:28px;letter-spacing:-1px}.logo i{color:var(--ac2);font-style:normal}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.hero{background:var(--ac);color:#fff;border-radius:22px;padding:22px;margin:14px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#1B2A55}}
.hero small{opacity:.75}.bal{font-size:36px;font-weight:800;margin:6px 0}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;font-size:16px}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-weight:600;font-size:16px;margin-top:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0A1226}}
.btn.alt{background:var(--ac2);color:#0E1B3D}.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row b{font-weight:600}.mu{color:var(--mu);font-size:13px}.in{color:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:480px;width:100%}
nav button{flex:1;background:none;border:0;padding:12px 2px;color:var(--mu);font-size:12px}
nav button.on{color:var(--tx);font-weight:800;box-shadow:inset 0 3px 0 var(--ac2)}
.bio{width:110px;height:110px;border-radius:50%;margin:20px auto;border:3px solid var(--ac2);display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--sf);user-select:none;touch-action:none;transition:box-shadow .3s}
.bio.go{box-shadow:0 0 0 14px rgba(245,179,1,.25)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:13px}
.chip.on{background:var(--ac2);border-color:var(--ac2);color:#0E1B3D}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90%}
.av{border-radius:50%;object-fit:cover;background:var(--ac2);color:#0E1B3D;display:inline-flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--ac2)}
.demo{font-size:12px;color:var(--mu);text-align:center;margin-top:8px}
#qr,#sqr{display:flex;justify-content:center;background:#fff;padding:14px;border-radius:14px;margin:10px auto;width:fit-content}
video{width:100%;border-radius:14px;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden><div id="tabs"></div></nav>
<script>
var RATES={XOF:1,EUR:0.00152,USD:0.0017,NGN:2.6,GHS:0.021,MAD:0.0165,XAF:1};
var COUNTRIES=[["Sénégal","+221","XOF"],["Côte d’Ivoire","+225","XOF"],["Mali","+223","XOF"],["Burkina Faso","+226","XOF"],["Guinée","+224","XOF"],["Bénin","+229","XOF"],["Togo","+228","XOF"],["Niger","+227","XOF"],["Nigeria","+234","NGN"],["Ghana","+233","GHS"],["Cameroun","+237","XAF"],["France","+33","EUR"],["États-Unis","+1","USD"],["Autre pays","+","USD"]];
var PARTNERS=[["Orange Money","📱"],["Wave","🌊"],["Ecobank","🏦"],["MTN MoMo","📶"],["Moov Money","📲"],["Visa / Mastercard","💳"]];
var unl=false,admOK=false,S=null,tab="home",step=1,draft={},toast="",stream=null;
try{S=JSON.parse(localStorage.getItem("zelle")||"null")}catch(e){}
function save(){try{localStorage.setItem("zelle",JSON.stringify(S))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){return new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2}).format(n)+" "+S.cur}
function say(m){toast=m;render();setTimeout(function(){toast="";render()},2400)}
function tx(type,label,amt){if(type==="in")setTimeout(capCheck,0);S.tx.unshift({type:type,label:label,amt:amt,t:Date.now(),ref:"NW"+Math.random().toString(36).slice(2,8).toUpperCase(),d:new Date().toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})})}

function render(){
  var a=$("app"),h="";
  if(!S){h=onboard()}else if(S.pin&&!unl){h=lock()}else{h=({home:home,send:send,scan:scan,net:net,pay:pay,shop:shop,rcpt:rcpt,adm:adm,agt:agt,cash:cash})[tab]()}
  a.innerHTML=h+(toast?'<div class="toast">'+esc(toast)+'</div>':"");
  $("nav").hidden=!S||(S.pin&&!unl);
  if(S){$("tabs").innerHTML=[["home","Accueil"],["send","Envoyer"],["scan","Scanner"],["shop","Commerce"],["net","Réseaux"]].map(function(t){return '<button class="'+(tab===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("")}
  if(S&&tab==="scan")drawQR();if(S&&tab==="shop"&&draft.sc)drawQR2();
}
function av(p,n,s){var st='width:'+s+'px;height:'+s+'px;font-size:'+(s*0.4)+'px';return p?'<img class="av" style="'+st+'" src="'+p+'" alt="">':'<span class="av" style="'+st+'">'+esc((n||"?").charAt(0))+'</span>'}
function keep(){["fn","ln","bd","ci"].forEach(function(k){var e=$(k);if(e){draft[k==="ci"?"city":k]=e.value}})}
function pickPhoto(inp){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=c.height=192;var x=c.getContext("2d"),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,192,192);var d=c.toDataURL("image/jpeg",0.8);if(S){S.photo=d;save();say("Photo mise à jour")}else{keep();draft.photo=d;render()}};im.src=r.result};r.readAsDataURL(f)}
function pay(){var p=draft.pay;if(!p)return scan();var cv=(p.c!==S.cur&&p.a>0)?'<p class="mu">Soit ≈ '+fmt(convert(p.a,p.c,S.cur))+'</p>':'';return '<h2>Payer un achat</h2><div class="card"><div style="text-align:center">'+av("",p.n,72)+'<h3 style="margin-top:8px">'+esc(p.n)+'</h3><p class="mu">Commerçant</p></div><label>Montant ('+esc(p.c)+')</label><input id="pa" type="number" inputmode="decimal" value="'+(p.a||"")+'" '+(p.a?"readonly":"")+'>'+cv+'<button class="btn alt" onclick="doPay()">Payer</button><button class="btn ghost" onclick="draft.pay=null;go(\'scan\')">Annuler</button></div>'}
function doPay(){var p=draft.pay,a=parseFloat($("pa").value);if(!(a>0)){say("Montant invalide");return}var own=Math.round(convert(a,p.c,S.cur)*100)/100;var ov=over(own,true);if(ov){say(ov);return}if(own>S.bal){say("Solde insuffisant");return}if(S.pin&&prompt("Entrez votre code PIN")!==S.pin){say("Code PIN incorrect");return}S.bal-=own;tx("out","Achat · "+p.n,own);save();draft.pay=null;tab="rcpt";draft.rc=S.tx[0];say("Paiement effectué : "+fmt(own))}
function now(){return new Date().toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}
function showRc(i){draft.rc=S.tx[i];tab="rcpt";render();window.scrollTo(0,0)}
function rcpt(){var t=draft.rc;if(!t)return home();return '<h2>Reçu</h2><div class="card" style="text-align:center">'+av(S.photo,S.name,64)+'<p class="mu">'+esc(S.name)+'</p><div class="bal">'+(t.type==="in"?"+":"−")+fmt(t.amt)+'</div><p><b>'+esc(t.label)+'</b></p><p class="mu">'+t.d+'</p><p class="mu">Référence '+esc(t.ref||"—")+'</p><p class="in"><b>✔ Confirmé</b></p></div><button class="btn alt" onclick="shareRc()">Partager le reçu</button><button class="btn ghost" onclick="go(\'home\')">Terminé</button>'}
function shareRc(){var t=draft.rc,txt="Reçu NAwa\n"+(t.type==="in"?"Reçu":"Payé")+" : "+fmt(t.amt)+"\n"+t.label+"\n"+t.d+"\nRéf. "+t.ref+"\nCompte "+S.id;if(navigator.share){navigator.share({title:"Reçu NAwa",text:txt}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){say("Reçu copié")},function(){say("Copie impossible")})}else{say("Partage indisponible")}}
function shop(){
 if(!S.shop)return '<h2>Espace commerçant</h2><p class="mu">Encaissez vos clients avec un code NAwa.</p><div class="card"><label>Nom du commerce</label><input id="sn" placeholder="Ex. Boutique Awa"><button class="btn alt" onclick="mkShop()">Ouvrir mon commerce</button></div>';
 var t=0;S.shop.sales.forEach(function(s){t+=s.amt});
 var h='<h2>'+esc(S.shop.name)+'</h2><div class="hero"><small>Ventes totales</small><div class="bal">'+fmt(t)+'</div><small>'+S.shop.sales.length+' vente(s)</small></div>';
 h+='<div class="card"><h3>Code de paiement</h3><label>Montant ('+S.cur+'). Laissez vide pour que le client le saisisse.</label><input id="sa" type="number" inputmode="decimal" placeholder="0"><button class="btn" onclick="mkCode()">Créer le code</button>';
 if(draft.sc)h+='<div id="sqr"></div><p class="mu" style="text-align:center">'+(draft.sc.a?fmt(draft.sc.a):"Montant libre")+'</p><button class="btn alt" onclick="fakeSale()">Simuler un paiement client</button>';
 h+='</div><div class="card"><h3>Ventes</h3>';
 if(!S.shop.sales.length)h+='<p class="mu">Aucune vente. Créez un code et faites-le scanner.</p>';
 S.shop.sales.slice(0,15).forEach(function(s){h+='<div class="row"><div><b>'+esc(s.by)+'</b><div class="mu">'+s.d+'</div></div><b class="in">+'+fmt(s.amt)+'</b></div>'});
 return h+'</div>';
}
function mkShop(){var n=$("sn").value.trim();if(!n){say("Entrez le nom du commerce");return}S.shop={name:n,sales:[]};save();render()}
function mkCode(){var a=parseFloat($("sa").value)||0;draft.sc={a:a,code:"NAWAPAY|"+S.shop.name.replace(/\|/g,"")+"|"+(a||"")+"|"+S.cur};render()}
function drawQR2(){var q=$("sqr");if(!q)return;q.innerHTML="";try{new QRCode(q,{text:draft.sc.code,width:170,height:170})}catch(e){q.textContent=draft.sc.code}}
function fakeSale(){var a=draft.sc.a||5000;S.bal+=a;S.shop.sales.unshift({amt:a,by:"Client démo",d:now()});tx("in","Vente · client démo",a);save();say("Vente encaissée : "+fmt(a))}
function lock(){return '<div class="logo" style="margin:30px 0 10px;text-align:center">NA<i>w</i>a</div><div style="text-align:center">'+av(S.photo,S.name,84)+'<h3 style="margin:10px 0">'+esc(S.name)+'</h3></div><div class="card"><label>Code PIN</label><input id="lp" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><button class="btn alt" onclick="unlock()">Ouvrir</button></div>'}
function unlock(){if($("lp").value===S.pin){unl=true;render()}else{say("Code PIN incorrect")}}
var EM=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function openAdm(){var c=prompt("Code administrateur");if(c!==S.adm){say("Code administrateur incorrect");return}admOK=true;tab="adm";render();window.scrollTo(0,0)}
function letter(){var fr=draft.lg!=="en",nm=S.name;var s=draft.ls!=null?draft.ls:(fr?"Demande de partenariat : NAwa, paiement mobile ouvert à tous":"Partnership request: NAwa, mobile payments open to everyone");var b=draft.lb!=null?draft.lb:(fr?"Bonjour,\n\nJe suis "+nm+", administrateur de NAwa, un projet d’application de paiement mobile ouverte à tous, partout dans le monde. Nous souhaitons associer votre institution à NAwa afin que nos utilisateurs puissent recharger leur compte et envoyer de l’argent vers vos services.\n\nSeriez-vous disponibles pour un échange afin d’étudier ce partenariat ?\n\nCordialement,\n"+nm+"\nNAwa · "+S.phone:"Hello,\n\nI am "+nm+", administrator of NAwa, a mobile payment app project open to everyone, everywhere. We would like to connect your institution to NAwa so our users can top up their accounts and send money to your services.\n\nWould you be available for a call to explore this partnership?\n\nBest regards,\n"+nm+"\nNAwa · "+S.phone);return{s:s,b:b}}
function gm(to,bcc){var m=letterT();return "https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(to)+"&bcc="+encodeURIComponent(bcc)+"&su="+encodeURIComponent(m.s)+"&body="+encodeURIComponent(m.b)}
function openGm(u){var w=window.open(u,"_blank");if(!w)say("Fenêtre bloquée : autorisez les pop-ups")}
function setMail(i){var e=prompt("E-mail de contact de "+S.inst[i].n);if(!e)return;e=e.trim();if(!EM.test(e)){say("Adresse e-mail invalide");return}S.inst[i].e=e;save();render()}
function cyc(i){var o=["À contacter","Contacté","Partenaire"],x=S.inst[i];x.s=o[(o.indexOf(x.s)+1)%3];save();render()}
function sendOne(i){var x=S.inst[i];openGm(gm(x.e,""));if(x.s==="À contacter")x.s="Contacté";save();render()}
function sendAll(){var L=S.inst.filter(function(i){return i.e&&i.s!=="Partenaire"}).map(function(i){return i.e});if(!L.length){say("Ajoutez d’abord des adresses e-mail");return}draft.batches=[];for(var k=0;k<L.length;k+=25)draft.batches.push(L.slice(k,k+25));draft.bi=0;nextBatch()}
function nextBatch(){var b=draft.batches[draft.bi];if(!b)return;openGm(gm("",b.join(",")));S.inst.forEach(function(x){if(b.indexOf(x.e)>-1&&x.s==="À contacter")x.s="Contacté"});draft.bi++;save();render()}
function addInst(){var n=$("in").value.trim(),c=$("ic").value.trim(),e=$("ie").value.trim();if(!n){say("Entrez le nom");return}if(e&&!EM.test(e)){say("Adresse e-mail invalide");return}S.inst.push({n:n,c:c||"—",e:e,s:"À contacter"});save();render()}
function impInst(){var k=0;$("bulk").value.split("\n").forEach(function(l){var p=l.split(/[,;]/).map(function(x){return x.trim()});if(p[0]){var e=p[2]||"";if(e&&!EM.test(e))e="";S.inst.push({n:p[0],c:p[1]||"—",e:e,s:"À contacter"});k++}});save();say(k+" institution(s) importée(s)")}
function adm(){
 if(!admOK)return home();
 S.inst=S.inst||[];
 if(!S.inst.length)S.inst=[["Orange Money","Afrique de l’Ouest"],["Wave","Sénégal, Côte d’Ivoire"],["Ecobank","Afrique"],["MTN MoMo","Afrique"],["Moov Money","Afrique de l’Ouest"],["UBA","Afrique"],["Visa","Mondial"],["Mastercard","Mondial"],["PayPal","Mondial"],["Western Union","Mondial"]].map(function(x){return{n:x[0],c:x[1],e:"",s:"À contacter"}});
 var m=S.inst.filter(function(i){return i.e}).length,p=S.inst.filter(function(i){return i.s==="Partenaire"}).length,L=letterT();
 var h='<div class="row"><h2>Administration</h2><button class="chip" onclick="go(\'home\')">Fermer</button></div><div class="hero"><small>Institutions suivies</small><div class="bal">'+S.inst.length+'</div><small>'+m+' avec e-mail · '+p+' partenaire(s)</small></div>';
 h+=alertsCard()+'<div class="card"><h3>Messages</h3><label>Type de message</label><select onchange="draft.lt=this.value;draft.ls=null;draft.lb=null;render()"><option value="p">Partenariat institution</option><option value="a"'+(draft.lt==="a"?" selected":"")+'>Recrutement d’agents</option><option value="d"'+(draft.lt==="d"?" selected":"")+'>Dossier de présentation</option><option value="c"'+(draft.lt==="c"?" selected":"")+'>Contrat d’agent</option></select><label>Langue</label><select onchange="draft.lg=this.value;draft.ls=null;draft.lb=null;render()"><option value="fr"'+(draft.lg==="en"?"":" selected")+'>Français</option><option value="en"'+(draft.lg==="en"?" selected":"")+'>English</option></select><label>Objet</label><input value="'+esc(L.s)+'" oninput="draft.ls=this.value"><label>Message</label><textarea rows="9" oninput="draft.lb=this.value">'+esc(L.b)+'</textarea><button class="btn alt" onclick="sendAll()">Envoyer à toutes via Gmail</button><button class="btn ghost" onclick="waShare()">Partager par WhatsApp</button>';
 if(draft.batches&&draft.bi<draft.batches.length)h+='<button class="btn" onclick="nextBatch()">Lot suivant ('+(draft.bi+1)+'/'+draft.batches.length+')</button>';
 h+='<p class="demo">Gmail s’ouvre avec le message prêt et les destinataires en copie cachée. Vous appuyez sur Envoyer depuis votre compte.</p></div><div class="card"><h3>Institutions</h3>';
 S.inst.forEach(function(x,i){h+='<div class="row"><div><b>'+esc(x.n)+'</b><div class="mu">'+esc(x.c)+' · '+(x.e?esc(x.e):"e-mail à renseigner")+'</div><div class="mu">'+x.s+'</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="chip'+(x.e?" on":"")+'" onclick="'+(x.e?"sendOne("+i+")":"setMail("+i+")")+'">'+(x.e?"Gmail":"E-mail")+'</button><button class="chip" onclick="cyc('+i+')">Statut</button></div></div>'});
 h+='</div>'+plafCard()+caisseCard()+treasCard()+agentsCard()+'<div class="card"><h3>Ajouter une institution</h3><label>Nom</label><input id="in"><label>Pays</label><input id="ic"><label>E-mail de contact</label><input id="ie" type="email"><button class="btn" onclick="addInst()">Ajouter</button><label>Ou collez une liste (nom, pays, e-mail par ligne)</label><textarea id="bulk" rows="4"></textarea><button class="btn ghost" onclick="impInst()">Importer la liste</button></div>';
 return h}
function letterT(){var t=draft.lt||"p";if(t==="p")return letter();var nm=S.name,d;
 if(t==="a")d=["Devenez agent NAwa","Bonjour,\n\nNAwa recrute des agents dans votre quartier. Un agent NAwa reçoit les dépôts des clients (espèces, Orange Money, Wave) et paie leurs retraits. Il gagne une commission sur chaque opération.\n\nConditions : une pièce d’identité ou une attestation locale, un téléphone, un point fixe (boutique ou kiosque) et une réserve de départ.\n\nSi vous êtes intéressé, répondez avec votre nom, votre quartier et votre numéro.\n\nMerci,\n"+nm+"\nNAwa · "+S.phone];
 else if(t==="c")d=["Contrat d’agent NAwa (modèle)","CONTRAT D’AGENT NAwa\n\nEntre NAwa, représentée par "+nm+", et l’agent : ____________ (nom, téléphone, quartier).\n\n1. Rôle. L’agent reçoit les dépôts des clients de NAwa (espèces, Orange Money, Wave) et paie leurs retraits.\n2. Identité. L’agent note le numéro ou l’ID NAwa du client et vérifie le nom avant chaque opération.\n3. Réserve. NAwa donne à l’agent une réserve électronique de départ. L’agent en est responsable et l’utilise seulement pour des opérations de clients.\n4. Commission. 0,5 % du montant de chaque dépôt et de chaque retrait (à confirmer).\n5. Interdictions. Aucune opération pour un client anonyme, aucun frais caché, aucun partage du code PIN.\n6. Fraude. En cas de fraude ou de faute, NAwa peut suspendre l’agent, bloquer sa réserve et signaler les faits aux autorités.\n7. Registre. L’agent garde la liste de ses opérations et la présente sur demande.\n8. Durée. Un an renouvelable, résiliable avec 15 jours de préavis.\n9. Droit applicable. Lois du pays de l’agent.\n\nFait à ________, le ________\nSignature de NAwa : ________   Signature de l’agent : ________\n\nModèle à faire valider par un avocat avant signature."];
 else d=["Présentation de NAwa","NAwa est un projet d’application de paiement mobile ouverte à tous.\n\n• Compte avec téléphone, photo, code PIN et biométrie\n• Envoi et réception par numéro ou code QR, avec conversion de devises\n• Paiement chez les commerçants par code QR\n• Dépôt et retrait par un réseau d’agents, en espèces, Orange Money ou Wave\n• Réseaux et banques partenaires (Orange Money, Wave, Ecobank…)\n\nÉtat : prototype fonctionnel. Licence et partenaire agréé en cours de cadrage.\n\nContact : "+nm+" · "+S.phone];
 return{s:draft.ls!=null?draft.ls:d[0],b:draft.lb!=null?draft.lb:d[1]}}

  var id="NAW-"+Math.random().toString(36).slice(2,8).toUpperCase();
  S={id:id,name:draft.fn+" "+draft.ln,phone:draft.code+draft.ph,country:draft.country,cur:draft.cur,bal:0,tier:"Niveau 1",links:[],tx:[],pin:p,photo:draft.photo,adm:a6,inst:[]};
  save();unl=true;step=1;tab="home";say("Compte créé : "+id)}
function bioStop(){clearTimeout(bioT);var b=$("bio");if(b){b.classList.remove("go");$("bt").textContent="Maintenez pendant 2 secondes"}}

/* ---------- Accueil ---------- */
function home(){
  var h='<div class="row"><div class="logo">NA<i>w</i>a</div><label style="display:flex;align-items:center;gap:8px;margin:0"><span class="mu">'+esc(S.id)+'</span>'+av(S.photo,S.name,44)+'<input type="file" accept="image/*" hidden onchange="pickPhoto(this)"></label></div>';
  h+='<div class="hero"><small>Bonjour '+esc(S.name.split(" ")[0])+', solde disponible</small><div class="bal">'+fmt(S.bal)+'</div><small>'+esc(S.phone)+' · '+S.tier+' · plafond '+fmt(plaf())+'</small></div>';
  h+='<div class="chips"><button class="chip on" onclick="go(\'net\')">Recharger</button><button class="chip" onclick="go(\'send\')">Envoyer</button><button class="chip" onclick="go(\'scan\')">Mon code</button><button class="chip" onclick="go(\'scan\')">Payer un achat</button><button class="chip" onclick="go(\'cash\')">Dépôt / Retrait</button>'+(S.agent?'<button class="chip" onclick="go(\'agt\')">Espace agent</button>':"")+(S.adm?'<button class="chip" onclick="openAdm()">Administration'+((S.req||[]).filter(function(r){return r.auto&&r.s==="En attente"}).length?" 🔔":"")+'</button>':"")+'</div>';
  h+='<div class="card"><h3>Activité</h3><p class="mu">Touchez une opération pour voir son reçu.</p>';
  if(!S.tx.length)h+='<p class="mu">Aucune opération. Liez un réseau partenaire pour recharger votre compte.</p>';
  S.tx.slice(0,12).forEach(function(t,i){h+='<div class="row" style="cursor:pointer" onclick="showRc('+i+')"><div><b>'+esc(t.label)+'</b><div class="mu">'+t.d+'</div></div><b class="'+(t.type==="in"?"in":"")+'">'+(t.type==="in"?"+":"−")+fmt(t.amt)+'</b></div>'});
  h+='</div><div class="card"><details><summary><b>Installer NAwa sur le téléphone</b></summary><p class="mu">Android (Chrome) : touchez ⋮ puis « Ajouter à l’écran d’accueil ».<br>iPhone (Safari) : touchez Partager puis « Sur l’écran d’accueil ».</p></details><button class="btn ghost" onclick="invite()">Inviter par WhatsApp ou message</button></div><p class="demo">Prototype de démonstration : argent fictif</p><button class="btn ghost" onclick="unl=false;render()">Verrouiller l’application</button><button class="btn ghost" onclick="reset()">Supprimer mon compte démo</button>';
  return h;
}
function reset(){if(confirm("Supprimer le compte démo ?")){S=null;try{localStorage.removeItem("zelle")}catch(e){}step=1;render()}}

/* ---------- Envoyer ---------- */
function send(){
  var d=S.links.map(function(n){return '<option>'+esc(n)+'</option>'}).join("");
  return '<h2>Envoyer de l’argent</h2><div class="card"><label>Destinataire : numéro, ID NAwa ou code scanné</label><input id="to" placeholder="+221 77 000 00 00 ou NAW-XXXXXX" value="'+esc(draft.to||"")+'"><label>Montant ('+S.cur+')</label><input id="am" type="number" inputmode="decimal" placeholder="0" oninput="conv()"><label>Le destinataire reçoit en</label><select id="rc" onchange="conv()">'+Object.keys(RATES).map(function(c){return '<option'+(c===S.cur?" selected":"")+'>'+c+'</option>'}).join("")+'</select><p class="mu" id="cv"></p><label>Envoyer vers</label><select id="dest"><option>Compte NAwa</option>'+d+'</select><p class="mu">Frais : 0 '+S.cur+' (démo)</p><button class="btn alt" onclick="doSend()">Envoyer maintenant</button></div>';
}
function convert(a,f,t){return a/RATES[f]*RATES[t]}
function fmtn(n){return new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2}).format(n)}
function conv(){var a=parseFloat($("am").value),rc=$("rc").value;$("cv").textContent=(a>0&&rc!==S.cur)?"Le destinataire reçoit ≈ "+fmtn(convert(a,S.cur,rc))+" "+rc+" (taux de démonstration)":""}
function doSend(){
  var to=$("to").value.trim(),am=parseFloat($("am").value),dest=$("dest").value;
  if(!to){say("Indiquez un destinataire");return}
  if(!(am>0)){say("Montant invalide");return}
  var lim=plaf(),ov=over(am,true);if(ov){say(ov);return}
  if(am>lim){say("Limite du niveau atteinte : "+fmt(lim));return}
  if(am>S.bal){say("Solde insuffisant");return}
  if(S.pin&&prompt("Entrez votre code PIN")!==S.pin){say("Code PIN incorrect");return}
  var rc=$("rc").value,got=convert(am,S.cur,rc);S.bal-=am;tx("out",to+" · "+dest+(rc!==S.cur?" → "+fmtn(got)+" "+rc:""),am);save();draft.to="";tab="rcpt";draft.rc=S.tx[0];say("Envoyé : "+fmt(am));
}

/* ---------- Scanner / Mon code ---------- */
function myCode(){return "NAWA|"+S.id+"|"+S.phone+"|"+S.name}
function scan(){
  return '<h2>Mon code NAwa</h2><p class="mu">Montrez ce code pour recevoir de l’argent.</p><div class="card"><div style="display:flex;justify-content:center">'+av(S.photo,S.name,72)+'</div><div id="qr"></div><p class="mu" style="text-align:center">'+esc(S.id)+' · '+esc(S.phone)+'</p></div><h2 style="margin-top:20px">Scanner un code ou payer un achat</h2><div class="card"><button class="btn" style="margin-top:0" onclick="startCam()">Ouvrir la caméra</button><video id="vd" playsinline muted hidden></video><label>Ou collez le code reçu</label><input id="cd" placeholder="NAWA|NAW-…"><button class="btn ghost" onclick="useCode($(\'cd\').value)">Utiliser ce code</button><button class="btn ghost" onclick="useCode(\'NAWAPAY|Boutique Awa Dakar|7500|XOF\')">Essayer un achat de démonstration</button></div>';
}
function drawQR(){var q=$("qr");if(!q)return;q.innerHTML="";try{new QRCode(q,{text:myCode(),width:170,height:170})}catch(e){q.textContent=myCode()}}
function useCode(c){var p=String(c).split("|");if(p[0]==="NAWAPAY"&&p[1]){stopCam();draft.pay={n:p[1],a:parseFloat(p[2])||0,c:RATES[p[3]]?p[3]:S.cur};tab="pay";render();return}if(p[0]!=="NAWA"||p.length<3){say("Code non reconnu");return}draft.to=p[1]+" ("+p[3]+")";stopCam();say("Destinataire : "+(p[3]||p[1]));tab="send";render()}
function startCam(){
  if(!("BarcodeDetector" in window)||!navigator.mediaDevices){say("Scan caméra indisponible ici. Collez le code.");return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){
    stream=s;var v=$("vd");v.hidden=false;v.srcObject=s;v.play();var bd=new BarcodeDetector({formats:["qr_code"]});
    (function loop(){if(!stream)return;bd.detect(v).then(function(r){if(r.length){useCode(r[0].rawValue)}else setTimeout(loop,300)}).catch(function(){setTimeout(loop,500)})})();
  }).catch(function(){say("Caméra refusée. Collez le code.")});
}
function stopCam(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}

/* ---------- Réseaux partenaires ---------- */
function net(){
  var h='<h2>Réseaux et banques</h2><p class="mu">Liez vos comptes pour recharger NAwa ou envoyer vers eux.</p><div class="card">';
  PARTNERS.concat(S.links.filter(function(n){return !PARTNERS.some(function(p){return p[0]===n})}).map(function(n){return [n,"🔗"]})).forEach(function(p){
    var on=S.links.indexOf(p[0])>-1;
    h+='<div class="row"><div><b>'+p[1]+' '+esc(p[0])+'</b><div class="mu">'+(on?"Lié":"Non lié")+'</div></div>'+(on?'<button class="chip on" onclick="topup(\''+esc(p[0]).replace(/'/g,"")+'\')">Recharger</button>':'<button class="chip" onclick="link(\''+esc(p[0]).replace(/'/g,"")+'\')">Lier</button>')+'</div>';
  });
  h+='</div><div class="card"><h3>Ajouter un réseau ou une banque</h3><label>Nom</label><input id="np" placeholder="Ex. Free Money, UBA, PayPal…"><button class="btn alt" onclick="addNet()">Demander l’association</button></div>';
  return h;
}
function link(n){if(S.links.indexOf(n)<0)S.links.push(n);save();say(n+" lié");render()}
function addNet(){var n=$("np").value.trim();if(!n){say("Entrez un nom");return}link(n)}
function topup(n){var v=prompt("Montant à recharger depuis "+n+" ("+S.cur+")");var a=parseFloat(v);if(!(a>0))return;var ov=over(a,false);if(ov){say(ov);return}S.bal+=a;tx("in","Recharge "+n,a);save();say("Compte rechargé : "+fmt(a));render()}

render();
</script>
</body>
</html>
