<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
.btn-bouba-create {
  background: linear-gradient(145deg, #FFD700, #FFCC00);
  color: #000; border: 2px solid #000;
  padding: 14px 22px; border-radius: 30px;
  font-weight: 900; font-size: 14px;
  cursor: pointer; box-shadow: 0 4px 0 #000;
  display: inline-flex; align-items: center; gap: 8px;
  text-transform: uppercase;
}
.btn-bouba-create:active { transform: translateY(4px); box-shadow: 0 0 0 #000; }
.bouba-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 15px; }
.bouba-modal.active { display: flex; }
.bouba-box { background: #1a1a1a; border: 2px solid #FFD700; border-radius: 15px; width: 100%; max-width: 380px; padding: 20px; position: relative; }
.bouba-box h2 { color: #FFD700; text-align: center; margin-bottom: 15px; }
.bouba-box label { font-size: 12px; color: #ccc; display: block; margin: 10px 0 4px; }
.bouba-box input, .bouba-box textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; }
.btn-submit-bouba { width: 100%; padding: 13px; background: #FFD700; color: #000; border: none; border-radius: 8px; font-weight: 900; font-size: 16px; margin-top: 15px; cursor: pointer; }
.btn-close-x { position: absolute; top: 10px; right: 12px; background: #ff4444; color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
</style>
</head>
<body>

<button class="btn-bouba-create" id="openBoutiqueBtn">🏪 + CRÉER MA BOUTIQUE</button>

<div class="bouba-modal" id="shopModalBouba">
  <div class="bouba-box">
    <button class="btn-close-x" onclick="closeBoubaModal()">X</button>
    <h2>Créer ta boutique</h2>
    <label>Nom de la boutique *</label>
    <input type="text" id="bShopName" placeholder="Ex: Style Shop Abidjan">
    <label>Ton nom complet *</label>
    <input type="text" id="bShopOwner" placeholder="Ex: Bouba Diallo">
    <label>Numéro WhatsApp boutique *</label>
    <input type="tel" id="bShopPhone" placeholder="Ex: 07 01 02 03 04">
    <label>Description</label>
    <textarea id="bShopDesc" rows="2" placeholder="Vêtements, maillots..."></textarea>
    <button class="btn-submit-bouba" id="btnSaveShop">✅ ENREGISTRER</button>
  </div>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const auth = getAuth(getApp());
let MON_ID = null;
onAuthStateChanged(auth, (u)=>{ if(u) MON_ID = u.uid; });
const modal = document.getElementById('shopModalBouba');
document.getElementById('openBoutiqueBtn').onclick = ()=> modal.classList.add('active');
window.closeBoubaModal = ()=> modal.classList.remove('active');
modal.addEventListener('click', (e)=>{ if(e.target === modal) closeBoubaModal(); });
document.getElementById('btnSaveShop').onclick = async ()=>{
  const name = document.getElementById('bShopName').value.trim();
  const owner = document.getElementById('bShopOwner').value.trim();
  const phone = document.getElementById('bShopPhone').value.trim();
  const desc = document.getElementById('bShopDesc').value.trim();
  if(!name || !owner || !phone) return alert('Remplis les 3 champs *');
  const btn = document.getElementById('btnSaveShop');
  btn.textContent = '⏳ Création...'; btn.disabled = true;
  try{
    await addDoc(collection(db, 'shops'), {
      name, owner, phone, desc,
      ownerId: MON_ID || 'invite_'+Date.now(),
      status: 'active', createdAt: serverTimestamp(), createdAtMs: Date.now()
    });
    alert('🔥 Boutique "'+name+'" créée !'); closeBoubaModal(); location.reload();
  }catch(err){ alert('Erreur: '+err.message); }
  finally{ btn.textContent = '✅ ENREGISTRER'; btn.disabled = false; }
};
</script>
</body>
</html>
