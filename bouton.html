<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutiques - BOUBA STORE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#000;color:#fff;min-height:100vh;padding:12px 12px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h1{color:#ffd700;font-size:18px;flex:1}
.btn{background:#222;color:#ffd700;border:1px solid #ffd700;border-radius:20px;padding:8px 13px;text-decoration:none;font-weight:bold;font-size:13px;cursor:pointer;display:inline-block}
.red{background:#c0392b;color:#fff;border:none}
.green{background:#25D366;color:#000;border:none}
.blue{background:#2d7ff9;color:#fff;border:none}
.card{background:#111;border:2px solid #ffd700;border-radius:15px;padding:16px;max-width:480px;margin:0 auto 14px}
.card h2{color:#ffd700;text-align:center;margin-bottom:12px;font-size:18px}
label{display:block;margin:10px 0 4px;font-size:13px}
input,textarea,select{width:100%;padding:11px;border-radius:8px;border:1px solid #555;background:#222;color:#fff;font-size:15px}
.main{width:100%;margin-top:16px;padding:13px;font-size:16px;border-radius:25px;font-weight:bold;cursor:pointer;border:none;background:linear-gradient(#ffd700,#b8860b);color:#000}
.tabs{display:flex;gap:6px;max-width:480px;margin:0 auto 12px}
.tabs .btn{flex:1;text-align:center;padding:10px 4px}
.tabs .on{background:#ffd700;color:#000}
.msg{text-align:center;margin-top:10px;font-size:14px;min-height:18px}
.ok{color:#25D366}.err{color:#ff6666}
.badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold}
.b-open{background:#1e7d3a}.b-closed{background:#c0392b}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.art{display:flex;gap:10px;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:8px;margin-bottom:8px;align-items:center}
.art img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.art div{flex:1;min-width:0}
.art b{color:#ffd700}
small{color:#aaa;display:block;margin-top:2px;font-size:12px;word-break:break-word}
.pw{background:#333;padding:2px 8px;border-radius:6px;color:#ffd700;font-family:monospace}
#prev{max-width:100%;max-height:180px;border-radius:8px;margin-top:8px;display:none}
.warn{background:#3a1010;border-color:#c0392b;font-size:14px}
.av{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #ffd700;display:block;margin:0 auto 8px;background:#222}
.avl{width:84px;height:84px;border-radius:50%;border:3px solid #ffd700;background:#222;color:#ffd700;font-size:34px;font-weight:bold;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.newb{background:#ffd700;color:#000}
.share{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.share a,.share button{flex:1;text-align:center;padding:7px 4px;border-radius:8px;border:none;font-size:12px;font-weight:bold;text-decoration:none;color:#000;background:#ffd700;cursor:pointer;min-width:60px}
</style>
</head>
<body>
<div class="top">
  <a class="btn" href="index.html">← Accueil</a>
  <h1>🏪 BOUBA STORE</h1>
  <span id="mode" class="badge" style="background:#444"></span>
</div>
<div id="app">Chargement…</div>

<script type="module">
import { mode, list, put, patch, remove, uid, esc, money, intl, compress, shareLinks, homeUrl } from './bouba-data.js';

// ⚠️ CODE ADMINISTRATEUR : change-le ici (une seule fois)
const ADMIN_CODE = 'bouba-admin-2025';

const $ = id => document.getElementById(id);
const app = $('app');
let tab = 'create', photo = '', avatar = '', video = '';
const avatarHtml = s => s.avatar ? `<img class="av" src="${s.avatar}" alt="">` : `<div class="avl">${esc((s.name || '?')[0].toUpperCase())}</div>`;
const getSession = () => { try { return localStorage.getItem('bouba_session'); } catch (e) { return null; } };
const setSession = v => { try { v ? localStorage.setItem('bouba_session', v) : localStorage.removeItem('bouba_session'); } catch (e) {} };
const isAdmin = () => { try { return sessionStorage.getItem('bouba_admin') === '1'; } catch (e) { return false; } };
const setAdmin = v => { try { v ? sessionStorage.setItem('bouba_admin', '1') : sessionStorage.removeItem('bouba_admin'); } catch (e) {} };
const say = (t, ok) => { const m = $('msg'); if (m) { m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); } };

async function render() {
  const m = await mode();
  $('mode').textContent = m === 'online' ? '🟢 En ligne' : '📱 Local';
  if (isAdmin()) return renderAdmin();
  const sid = getSession();
  if (sid) {
    const shops = await list('boutiques');
    const shop = shops.find(s => s.id === sid);
    if (shop) return renderShop(shop);
    setSession(null);
  }
  renderAuth();
}

function renderAuth() {
  const tabs = `<div class="tabs">
    <button class="btn ${tab === 'create' ? 'on' : ''}" data-act="tab" data-v="create">Créer</button>
    <button class="btn ${tab === 'login' ? 'on' : ''}" data-act="tab" data-v="login">Connexion</button>
    <button class="btn ${tab === 'admin' ? 'on' : ''}" data-act="tab" data-v="admin">Admin</button></div>`;
  let f = '';
  if (tab === 'create') f = `<h2>Créer ma boutique</h2>
    <label>Photo de profil de la boutique</label><input id="f_avatar" type="file" accept="image/*">
    <img id="prevAv" class="av" style="display:none;margin-top:8px" alt="">
    <label>Nom de la boutique *</label><input id="f_name" placeholder="Ex: Style Shop">
    <label>Nom du créateur *</label><input id="f_owner" placeholder="Ex: Bouba Diallo">
    <label>Téléphone *</label><input id="f_phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="0102030405">
    <label>Mot de passe * (4 caractères min.)</label><input id="f_pass" type="password">
    <label>Description</label><textarea id="f_desc" rows="3" placeholder="Chaussures, vêtements, maillots..."></textarea>
    <button class="main" data-act="create">Créer ma boutique</button>`;
  if (tab === 'login') f = `<h2>Connexion boutique</h2>
    <label>Téléphone</label><input id="l_phone" type="tel" inputmode="numeric" autocomplete="off">
    <label>Mot de passe</label><input id="l_pass" type="password">
    <button class="main" data-act="login">Entrer dans ma boutique</button>`;
  if (tab === 'admin') f = `<h2>Administration</h2>
    <label>Code administrateur</label><input id="a_code" type="password">
    <button class="main" data-act="admin">Entrer</button>`;
  app.innerHTML = tabs + `<div class="card">${f}<div class="msg" id="msg"></div></div>`;
}

async function renderShop(shop) {
  const arts = (await list('articles')).filter(a => a.shopId === shop.id).sort((a, b) => b.date - a.date);
  const closed = shop.status === 'closed';
  app.innerHTML = `
  <div class="card">
    ${avatarHtml(shop)}
    <label class="btn" style="text-align:center;display:block;margin:0 auto 10px;max-width:210px">📷 Changer ma photo<input id="av_file" type="file" accept="image/*" hidden></label>
    <h2>🏪 ${esc(shop.name)}</h2>
    <p style="text-align:center"><span class="badge ${closed ? 'b-closed' : 'b-open'}">${closed ? 'Fermée par l\'administrateur' : 'Ouverte'}</span></p>
    <small style="text-align:center;margin-top:8px">Créateur : ${esc(shop.owner)} • 📞 ${esc(shop.phone)}</small>
    ${shop.desc ? `<small style="text-align:center">${esc(shop.desc)}</small>` : ''}
    <div class="row" style="justify-content:center"><button class="btn red" data-act="logout">Déconnexion</button></div>
  </div>
  ${closed ? `<div class="card warn">⛔ Votre boutique est fermée. Vos articles sont cachés et vous ne pouvez plus publier. Contactez l'administrateur.</div>` : `
  <div class="card">
    <h2>📦 Publier un article</h2>
    <label>Nom de l'article *</label><input id="p_name" placeholder="Ex: Crêpes NB gris sportif">
    <label>Prix (F) *</label><input id="p_price" type="number" inputmode="numeric" placeholder="8000">
    <label>Catégorie</label>
    <select id="p_cat"><option>Chaussures</option><option>Vêtements</option><option>Maillots</option><option>Accessoires</option><option>Autre</option></select>
    <label>Description (taille, couleur, état…)</label><textarea id="p_desc" rows="3"></textarea>
    <label>Photo *</label><input id="p_file" type="file" accept="image/*">
    <img id="prev" alt="">
    <label>Vidéo courte (optionnel, 500 Ko max)</label><input id="p_video" type="file" accept="video/*">
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="p_share" type="checkbox" checked style="width:auto"> Proposer le partage sur les réseaux après publication</label>
    <button class="main" data-act="publish">Publier sur l'accueil</button>
    <div class="msg" id="msg"></div>
  </div>`}
  <div class="card">
    <h2>Mes articles (${arts.length})</h2>
    ${arts.length ? arts.map(a => { const t = `${a.name} - ${money(a.price)} chez ${shop.name} sur BOUBA STORE`, sl = shareLinks(t, homeUrl()); return `<div style="margin-bottom:12px"><div class="art" style="margin-bottom:0"><img src="${a.img}" alt=""><div><b>${esc(a.name)}</b><small>${money(a.price)} • ${esc(a.cat)}</small></div>
      <button class="btn red" data-act="delart" data-id="${a.id}">🗑</button></div>
      <div class="share"><a target="_blank" href="${sl.whatsapp}">WhatsApp</a><a target="_blank" href="${sl.facebook}" style="background:#2d7ff9;color:#fff">Facebook</a><a target="_blank" href="${sl.telegram}" style="background:#333;color:#fff">Telegram</a><a target="_blank" href="${sl.x}" style="background:#333;color:#fff">X</a><button data-act="nshare" data-t="${esc(t)}">📤 Partager</button></div></div>`; }).join('') : '<small style="text-align:center">Aucun article publié.</small>'}
  </div>`;
  photo = ''; video = '';
}

async function renderAdmin() {
  const shops = await list('boutiques'), arts = await list('articles');
  app.innerHTML = `<div class="card"><h2>⚙️ Administration</h2>
    <small style="text-align:center">${shops.length} boutique(s) • ${arts.length} article(s) • 🆕 ${shops.filter(x => Date.now() - x.createdAt < 864e5).length} nouvelle(s) (24h)</small>
    <div class="row" style="justify-content:center"><button class="btn red" data-act="logout">Quitter l'admin</button></div></div>` +
    (shops.length ? shops.sort((a, b) => b.createdAt - a.createdAt).map(s => {
      const n = arts.filter(a => a.shopId === s.id).length, closed = s.status === 'closed', p = intl(s.phone), isNew = Date.now() - s.createdAt < 864e5;
      return `<div class="card">
        ${avatarHtml(s)}<h2 style="margin-bottom:6px">${esc(s.name)} ${isNew ? '<span class="badge newb">🆕 Nouveau</span>' : ''}</h2>
        <p style="text-align:center"><span class="badge ${closed ? 'b-closed' : 'b-open'}">${closed ? 'Fermée' : 'Ouverte'}</span></p>
        <small>👤 Créateur : ${esc(s.owner)}</small>
        <small>📞 Téléphone : ${esc(s.phone)}</small>
        <small>📅 Créée le ${new Date(s.createdAt).toLocaleString('fr-FR')}</small>
        <small>🔑 Mot de passe : <span class="pw">${esc(s.password)}</span></small>
        <small>📝 ${esc(s.desc || '—')}</small>
        <small>📦 Articles : ${n}</small>
        <div class="row">
          <button class="btn ${closed ? 'green' : 'red'}" data-act="toggle" data-id="${s.id}" data-s="${closed ? 'open' : 'closed'}">${closed ? '🔓 Ouvrir' : '🔒 Fermer'}</button>
          <a class="btn blue" href="tel:${esc(s.phone)}">📞 Appeler</a>
          <a class="btn green" target="_blank" href="https://wa.me/${p}">💬 WhatsApp</a>
          <a class="btn" href="sms:${esc(s.phone)}">✉️ SMS</a>
          <button class="btn red" data-act="delshop" data-id="${s.id}">🗑 Supprimer</button>
        </div></div>`;
    }).join('') : '<div class="card"><small style="text-align:center">Aucune boutique créée.</small></div>');
}

document.addEventListener('change', async e => {
  const id = e.target.id, f = e.target.files && e.target.files[0];
  if (!f) return;
  try {
    if (id === 'p_file') { photo = await compress(f); const p = $('prev'); p.src = photo; p.style.display = 'block'; }
    if (id === 'p_video') {
      if (f.size > 500 * 1024) { e.target.value = ''; video = ''; return say('Vidéo trop lourde (' + Math.round(f.size / 1024) + ' Ko). Maximum 500 Ko : choisissez un clip de quelques secondes.', false); }
      video = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(f); });
      say('🎬 Vidéo ajoutée.', true);
    }
    if (id === 'f_avatar') { avatar = await compress(f, 240); const p = $('prevAv'); p.src = avatar; p.style.display = 'block'; }
    if (id === 'av_file') { const a = await compress(f, 240); await patch('boutiques', getSession(), { avatar: a }); render(); }
  } catch (err) { say('Photo illisible, essayez une autre.', false); }
});

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, v = id => ($(id) ? $(id).value.trim() : '');
  try {
    if (act === 'nshare') {
      if (navigator.share) navigator.share({ title: 'BOUBA STORE', text: b.dataset.t, url: homeUrl() }).catch(() => {});
      else { navigator.clipboard && navigator.clipboard.writeText(b.dataset.t + ' ' + homeUrl()); alert('Lien copié !'); }
      return;
    }
    if (act === 'tab') { tab = b.dataset.v; return renderAuth(); }
    if (act === 'logout') { setSession(null); setAdmin(false); return render(); }
    if (act === 'admin') {
      if (v('a_code') !== ADMIN_CODE) return say('Code incorrect.', false);
      setAdmin(true); return render();
    }
    if (act === 'create') {
      const name = v('f_name'), owner = v('f_owner'), phone = v('f_phone'), pass = v('f_pass'), desc = v('f_desc');
      if (!name || !owner) return say('Remplissez le nom de la boutique et du créateur.', false);
      if (phone.replace(/\D/g, '').length < 8) return say('Le téléphone doit être un numéro (chiffres), ex : 0102030405.', false);
      if (pass.length < 4) return say('Mot de passe : 4 caractères minimum.', false);
      const shops = await list('boutiques');
      if (shops.some(s => s.phone === phone)) return say('Ce numéro a déjà une boutique. Utilisez « Connexion ».', false);
      if (shops.some(s => s.name.toLowerCase() === name.toLowerCase())) return say('Ce nom de boutique existe déjà.', false);
      const shop = { id: uid(), name, owner, phone, password: pass, desc, avatar, status: 'open', createdAt: Date.now() };
      await put('boutiques', shop); setSession(shop.id); return render();
    }
    if (act === 'login') {
      const shops = await list('boutiques');
      const s = shops.find(x => x.phone === v('l_phone') && x.password === v('l_pass'));
      if (!s) return say('Téléphone ou mot de passe incorrect.', false);
      setSession(s.id); return render();
    }
    if (act === 'publish') {
      const shops = await list('boutiques'), shop = shops.find(s => s.id === getSession());
      if (!shop || shop.status === 'closed') return say('Boutique fermée.', false);
      const name = v('p_name'), price = Number(v('p_price')), wantShare = !!($('p_share') && $('p_share').checked);
      if (!name || !(price > 0)) return say('Nom et prix obligatoires.', false);
      if (!photo) return say('Ajoutez une photo.', false);
      await put('articles', { id: uid(), shopId: shop.id, shopName: shop.name, owner: shop.owner, phone: shop.phone,
        name, price, cat: v('p_cat'), desc: v('p_desc'), img: photo, video, date: Date.now() });
      fetch('/api/push',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({act:'new',title:'🆕 Nouvel article',body:name+' - '+price+' F chez '+shop.name})}).catch(()=>{});
      await render(); say('✅ Article publié sur l\'accueil !', true);
      if (wantShare && navigator.share) navigator.share({ title: 'BOUBA STORE', text: `${name} - ${money(price)} chez ${shop.name} sur BOUBA STORE`, url: homeUrl() }).catch(() => {});
      return;
    }
    if (act === 'delart') {
      if (!confirm('Supprimer cet article ?')) return;
      await remove('articles', b.dataset.id); return render();
    }
    if (act === 'toggle') { await patch('boutiques', b.dataset.id, { status: b.dataset.s }); return render(); }
    if (act === 'delshop') {
      if (!confirm('Supprimer définitivement cette boutique et ses articles ?')) return;
      const arts = await list('articles');
      for (const a of arts.filter(a => a.shopId === b.dataset.id)) await remove('articles', a.id);
      await remove('boutiques', b.dataset.id); return render();
    }
  } catch (err) {
    console.error(err);
    say('Erreur : ' + (err.message || 'enregistrement impossible'), false);
  }
});

render();
</script>
</body>
</html>
