<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouba Store</title>
<style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;padding:20px}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #444;background:#222;color:#fff;font-size:1rem;box-sizing:border-box}
button{background:#ffd700;color:#000;font-weight:bold;border:0}
  select{background:#222;color:#fff;border:1px solid #444;border-radius:12px;padding:14px 4px;font-size:1rem}
a{color:#ffd700}h2{color:#ffd700}</style></head><body>
<h2 id="titre">Créer un compte</h2>
<div id="step1">
<input id="nom" placeholder="Nom complet">
<input id="photo" type="file" accept="image/*">
<div style="display:flex;gap:8px"><select id="ind" style="width:38%"></select><input id="tel" type="tel" placeholder="Numéro" inputmode="tel"></div>
<script>
(function(){var P=[["🇨🇮","Côte d'Ivoire","225"],["🇧🇫","Burkina Faso","226"],["🇲🇱","Mali","223"],["🇸🇳","Sénégal","221"],["🇬🇳","Guinée","224"],["🇹🇬","Togo","228"],["🇧🇯","Bénin","229"],["🇨🇲","Cameroun","237"],["🇳🇪","Niger","227"],["🇬🇭","Ghana","233"],["🇳🇬","Nigeria","234"],["🇲🇦","Maroc","212"],["🇩🇿","Algérie","213"],["🇹🇳","Tunisie","216"],["🇫🇷","France","33"],["🇧🇪","Belgique","32"],["🇨🇭","Suisse","41"],["🇨🇦","Canada","1"],["🇺🇸","États-Unis","1"],["🇬🇧","Royaume-Uni","44"],["🇩🇪","Allemagne","49"],["🇪🇸","Espagne","34"],["🇮🇹","Italie","39"],["🇵🇹","Portugal","351"],["🇨🇬","Congo","242"],["🇨🇩","RD Congo","243"],["🇬🇦","Gabon","241"],["🇲🇷","Mauritanie","222"],["🇱🇷","Libéria","231"],["🇸🇱","Sierra Leone","232"],["🇨🇻","Cap-Vert","238"],["🇹🇩","Tchad","235"],["🇨🇫","Centrafrique","236"],["🇧🇮","Burundi","257"],["🇷🇼","Rwanda","250"],["🇪🇬","Égypte","20"],["🇿🇦","Afrique du Sud","27"],["🇧🇷","Brésil","55"],["🇮🇳","Inde","91"],["🇨🇳","Chine","86"],["🇹🇷","Turquie","90"],["🇸🇦","Arabie saoudite","966"],["🇦🇪","Émirats arabes unis","971"],["🇱🇧","Liban","961"]];
var s=document.getElementById('ind');
P.forEach(function(p){var o=document.createElement('option');o.value=p[2];o.textContent=p[0]+' +'+p[2]+' '+p[1];s.appendChild(o)});
})();
</script>
<button id="go">Créer mon compte</button>
</div>
<p style="color:#aaa;font-size:.85rem">Ton compte reste enregistré sur cet appareil.</p>
<p id="msg" style="color:#f66"></p>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyAnLLXpUC35OleB0hCLUXnLU0lMiesY7j4",
  authDomain: "project-f4477c80-7c55-4db7-b2e.firebaseapp.com",
  projectId: "project-f4477c80-7c55-4db7-b2e",
  storageBucket: "project-f4477c80-7c55-4db7-b2e.firebasestorage.app",
  messagingSenderId: "697604298457",
  appId: "1:697604298457:web:4f9a6d66ec6fde9c1990c8"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
let enCours = false;

// Déjà connecté sur cet appareil (avec profil) : on va directement à la boutique
onAuthStateChanged(auth, async u => {
  if (!u || enCours) return;
  try { if ((await getDoc(doc(db, 'users', u.uid))).exists()) location.replace('index.html'); } catch (_) {}
});

// Côte d'Ivoire (225) : le 0 initial fait partie du numéro
function formatTel(ind, saisie) {
  let d = saisie.replace(/\D/g, '');
  if (ind !== '225') d = d.replace(/^0+/, '');
  return ind + d;
}

function photoVersDataURL(f) {
  return new Promise((ok, ko) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 240 / Math.max(im.naturalWidth, im.naturalHeight));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(im.naturalWidth * k));
        cv.height = Math.max(1, Math.round(im.naturalHeight * k));
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        ok(cv.toDataURL('image/jpeg', 0.7));
      };
      im.onerror = () => ko(new Error('image'));
      im.src = r.result;
    };
    r.onerror = () => ko(new Error('lecture'));
    r.readAsDataURL(f);
  });
}

$('go').onclick = async () => {
  $('msg').textContent = '';
  const nom = $('nom').value.trim();
  const tel = formatTel($('ind').value, $('tel').value);
  if (nom.length < 3 || tel.length < 9) return $('msg').textContent = 'Remplis tous les champs correctement.';
  $('go').disabled = true; enCours = true;
  try {
    const { user } = auth.currentUser ? { user: auth.currentUser } : await signInAnonymously(auth);
    let photo = '';
    const f = $('photo').files[0];
    if (f) { try { photo = await photoVersDataURL(f); } catch (_) {} }
    await updateProfile(user, { displayName: nom });
    await setDoc(doc(db, 'users', user.uid), { name: nom, tel, photo, createdAt: Date.now() });
    location.href = 'index.html';
  } catch (e) {
    console.error(e);
    $('msg').textContent = 'Erreur : ' + (e.code || e.message);
    $('go').disabled = false; enCours = false;
  }
};
</script></body></html>
