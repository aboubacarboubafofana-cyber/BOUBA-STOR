<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouba Store</title>
<style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;padding:20px}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #444;background:#222;color:#fff;font-size:1rem;box-sizing:border-box}
button{background:#ffd700;color:#000;font-weight:bold;border:0}
  select{background:#222;color:#fff;border:1px solid #444;border-radius:12px;padding:14px 4px.;font-size:1rem}
a{color:#ffd700}h2{color:#ffd700}</style></head><body>
<h2 id="titre">Créer un compte</h2>
<input id="nom" placeholder="Nom complet">

<div style="display:flex;gap:8px"><select id="ind" style="width:42%."></select><input id="tel" type="tel" placeholder="Numéro"></div>
<script>
(function(){var P=[["🇨🇮","Côte d'Ivoire","225"],["🇧🇫","Burkina Faso","226"],["🇲🇱","Mali","223"],["🇸🇳","Sénégal","221"],["🇬🇳","Guinée","224"],["🇹🇬","Togo","228"],["🇧🇯","Bénin","229"],["🇨🇲","Cameroun","237"],["🇳🇪","Niger","227"],["🇬🇭","Ghana","233"],["🇳🇬","Nigeria","234"],["🇲🇦","Maroc","212"],["🇩🇿","Algérie","213"],["🇹🇳","Tunisie","216"],["🇫🇷","France","33"],["🇧🇪","Belgique","32"],["🇨🇭","Suisse","41"],["🇨🇦","Canada","1"],["🇺🇸","États-Unis","1"],["🇬🇧","Royaume-Uni","44"],["🇩🇪","Allemagne","49"],["🇪🇸","Espagne","34"],["🇮🇹","Italie","39"],["🇵🇹","Portugal","351"],["🇨🇬","Congo","242"],["🇨🇩","RD Congo","243"],["🇬🇦","Gabon","241"],["🇲🇷","Mauritanie","222"],["🇱🇷","Libéria","231"],["🇸🇱","Sierra Leone","232"],["🇨🇻","Cap-Vert","238"],["🇹🇩","Tchad","235"],["🇨🇫","Centrafrique","236"],["🇧🇮","Burundi","257"],["🇷🇼","Rwanda","250"],["🇪🇬","Égypte","20"],["🇿🇦","Afrique du Sud","27"],["🇧🇷","Brésil","55"],["🇮🇳","Inde","91"],["🇨🇳","Chine","86"],["🇹🇷","Turquie","90"],["🇸🇦","Arabie saoudite","966"],["🇦🇪","Émirats arabes unis","971"],["🇱🇧","Liban","961"]];
var s=document.getElementById('ind');
P.forEach(function(p){var o=document.createElement('option');o.value=p[2];o.textContent=p[0]+' +'+p[2]+' '+p[1];s.appendChild(o)});
})();
</script>
<input id="mdp" type="password" placeholder="Mot de passe (6 caractères min.)">
<button id="go">S'inscrire</button>
<p><a href="#" id="switch">J'ai déjà un compte</a></p><p id="msg" style="color:#f66"></p>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyAnLLXpUC35OleB0hCLUXnLU0lMiesY7j4",
  authDomain: "project-f4477c80-7c55-4db7-b2e.firebaseapp.com",
  projectId: "project-f4477c80-7c55-4db7-b2e",
  storageBucket: "project-f4477c80-7c55-4db7-b2e.firebasestorage.app",
  messagingSenderId: "697604298457",
  appId: "1:697604298457:web:4f9a6d66ec6fde9c1990c8"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
let inscription = true;
$('switch').onclick = e => {
  e.preventDefault(); inscription = !inscription;
  $('nom').style.display = inscription ? '' : 'none';
  $('titre').textContent = inscription ? 'Créer un compte' : 'Connexion';
  $('go').textContent = inscription ? "S'inscrire" : 'Se connecter';
  $('switch').textContent = inscription ? "J'ai déjà un compte" : 'Créer un compte';
};
$('go').onclick = async () => {
  const nom = $('nom').value.trim(), tel = $('ind').value + $('tel').value.replace(/\D/g,'').replace(/^0+/,''), mdp = $('mdp').value;
  if (tel.length < 8 || mdp.length < 6 || (inscription && nom.length < 3))
    return $('msg').textContent = "Remplis tous les champs correctement.";
  const email = tel + '@bouba-store.app';
  try {
    if (inscription) {
      const c = await createUserWithEmailAndPassword(auth, email, mdp);
      await updateProfile(c.user, { displayName: nom });
let photo = '';
const f = $('photo').files[0];
if (f) {
  try {
    photo = await new Promise((ok, ko) => {
      const r = new FileReader();
      r.onload = () => {
        const im = new Image();
        im.onload = () => {
          const k = Math.min(1, 240 / Math.max(im.naturalWidth, im.naturalHeight));
          const cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(im.naturalWidth * k));
          cv.height = Math.max(1, Math.round(im.naturalHeight * k));
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          ok(cv.toDataURL('image/jpeg', 0.7));
        };
        im.onerror = () => ko(new Error('image'));
        im.src = r.result;
      };
      r.onerror = () => ko(new Error('lecture'));
      r.readAsDataURL(f);
    });
  } catch (err) {
    $('msg').textContent = 'Photo illisible : ' + err.message;
  }
  }
await setDoc(doc(db, 'users', c.user.uid), { name: nom, tel, photo, createdAt: Date.now() });
    } else {
      await signInWithEmailAndPassword(auth, email, mdp);
    }
    location.href = 'amis.html';
  } catch (e) {
    const m = { 'auth/email-already-in-use':'Ce numéro a déjà un compte.',
      'auth/invalid-credential':'Numéro ou mot de passe incorrect.',
      'auth/weak-password':'Mot de passe trop court.' };
    $('msg').textContent = m[e.code] || 'Erreur : ' + e.code;
  }
};
</script></body></html>
